<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Kino TV — VIDAA OS Edition</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e50914"/>
      <stop offset="1" stop-color="#7a040a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2638"/>
      <stop offset="1" stop-color="#0a0d15"/>
    </linearGradient>
  </defs>
  <!-- fondo rojo de la app -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- antena -->
  <path d="M206 92 L256 136 L306 92" fill="none" stroke="#f4f6fb" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- televisor: marco claro, pantalla oscura -->
  <rect x="84" y="136" width="344" height="252" rx="44" fill="#f4f6fb"/>
  <rect x="108" y="160" width="250" height="204" rx="26" fill="url(#screen)"/>
  <!-- botón de reproducir, en rojo dentro de la pantalla -->
  <path d="M206 214 L206 310 L286 262 Z" fill="#e50914" stroke="#e50914" stroke-width="14" stroke-linejoin="round"/>
  <!-- panel lateral: perilla y luz de encendido -->
  <circle cx="393" cy="214" r="15" fill="#1f2638"/>
  <circle cx="393" cy="262" r="8" fill="#1f2638"/>
  <circle cx="393" cy="334" r="9" fill="#22c55e"/>
  <!-- patas -->
  <path d="M150 388 L136 420 M362 388 L376 420" stroke="#f4f6fb" stroke-width="16" stroke-linecap="round"/>
</svg>
