<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kino TV — VIDAA OS Edition (Tienda Completa de Plugins)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #090a0f;
      --panel: #12151f;
      --panel-alt: #181c29;
      --card: #1b2030;
      --accent: #e50914;
      --accent-hover: #ff1e29;
      --accent-glow: rgba(229, 9, 20, 0.45);
      --green: #1db954;
      --text: #f5f6fa;
      --muted: #9aa2b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 250px;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      padding: 24px 14px;
      gap: 8px;
      border-right: 1px solid var(--border);
      z-index: 20;
      flex-shrink: 0;
    }
    .brand {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--accent);
      padding: 0 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand span {
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      background: #252b3d;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.4px;
    }
    .nav-btn {
      background: transparent;
      border: 2px solid transparent;
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.14s ease;
    }
    .nav-btn.active {
      color: var(--text);
      background: rgba(229, 9, 20, 0.14);
      border-color: rgba(229, 9, 20, 0.35);
    }
    .nav-badge {
      background: #262c3f;
      color: #dce1f0;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 700;
    }
    .focusable:focus, .focusable.tv-focus {
      outline: none;
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 4px var(--accent-glow);
      transform: scale(1.02);
      color: var(--text);
      z-index: 5;
    }
    /* Main area */
    .main {
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      padding: 28px 36px 90px;
      /* Sin scroll-behavior: smooth. Con el desplazamiento animado, la navegación
         medía posiciones a mitad de la animación y saltaba a botones lejanos. */
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .section-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    .status-pill {
      font-size: 13px;
      color: #d0d6e8;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 99px;
      max-width: 520px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Tabs & Pills */
    .tabs-bar, .cat-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .pill-btn {
      background: var(--panel-alt);
      color: var(--muted);
      border: 2px solid transparent;
      padding: 9px 16px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .pill-btn.active {
      background: var(--accent);
      color: #fff;
    }
    /* Media Rows & Grids */
    .row-section { margin-bottom: 34px; }
    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .row-title { font-size: 19px; font-weight: 700; color: #e4e8f5; display: flex; align-items: center; gap: 10px; }
    .row-source-tag { font-size: 11px; background: #23293b; color: var(--muted); padding: 3px 8px; border-radius: 6px; font-weight: 600; }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.14s ease;
      position: relative;
    }
    .card-poster {
      width: 100%;
      aspect-ratio: 2/3;
      background: #232838;
      object-fit: cover;
      display: block;
    }
    .card-body { padding: 10px 12px; }
    .card-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Plugin Store Grid */
    .plugins-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }
    .plugin-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: space-between;
    }
    .plugin-card.installed {
      border-color: rgba(29, 185, 84, 0.45);
      background: linear-gradient(180deg, rgba(29, 185, 84, 0.08), var(--card));
    }
    .plugin-top { display: flex; gap: 12px; align-items: center; }
    .plugin-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #262c3f;
      object-fit: cover;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
    }
    .plugin-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .plugin-sub { font-size: 12px; color: var(--muted); margin-top: 2px; word-break: break-all; }
    .plugin-desc { font-size: 13px; color: #c4cadb; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .plugin-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag-chip { font-size: 11px; background: #252b3d; color: #b8c0d8; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
    .tag-chip.official { background: rgba(229, 9, 20, 0.2); color: #ff858b; }
    .tag-chip.stremio { background: rgba(115, 75, 255, 0.22); color: #bca6ff; }
    .plugin-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    /* Inputs & Buttons */
    .input-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .tv-input {
      flex: 1;
      min-width: 240px;
      background: var(--panel-alt);
      border: 2px solid #2d344a;
      color: var(--text);
      font-size: 16px;
      padding: 11px 15px;
      border-radius: 10px;
    }
    .action-btn {
      background: var(--accent);
      color: #fff;
      border: 2px solid transparent;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn.secondary { background: #262d42; color: #e2e6f3; }
    .action-btn.success { background: var(--green); color: #fff; }
    .action-btn.small { padding: 8px 13px; font-size: 13px; }
    /* Overlays */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 8, 12, 0.96);
      display: none;
      flex-direction: column;
      padding: 36px 44px;
      z-index: 60;
      overflow-y: auto;
    }
    .overlay.open { display: flex; }
    .detail-box { display: flex; gap: 32px; max-width: 1180px; width: 100%; margin: 0 auto; align-items: flex-start; }
    .detail-poster { width: 240px; border-radius: 14px; aspect-ratio: 2/3; object-fit: cover; background: #222; flex-shrink: 0; }
    .detail-info { flex: 1; min-width: 0; }
    .detail-title { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
    .detail-desc { font-size: 16px; line-height: 1.55; color: #c5cae0; margin: 14px 0 22px; }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 16px;
      max-height: 320px;
      overflow-y: auto;
      padding: 4px;
    }
    .ep-btn {
      background: var(--panel-alt);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .streams-box { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
    .stream-badge {
      display: inline-block;
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .stream-item {
      background: var(--panel-alt);
      border: 2px solid var(--border);
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    #playerOverlay { padding: 0; background: #000; }
    video { width: 100vw; height: 100vh; background: #000; }
    #webPlayerFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    .player-hud {
      position: absolute;
      bottom: 24px;
      left: 36px;
      right: 36px;
      z-index: 5; /* siempre por encima del iframe de servidores embed */
      background: rgba(14, 16, 24, 0.9);
      padding: 16px 22px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.14);
    }
    /* La barra del reproductor se oculta sola para poder ver el video */
    #playerOverlay .player-hud { transition: opacity 0.25s ease, transform 0.25s ease; gap: 18px; }
    #playerOverlay.hud-hidden .player-hud { opacity: 0; transform: translateY(40px); pointer-events: none; }
    #playerOverlay.hud-hidden { cursor: none; }
    #playerOverlay.mode-embed .video-only, #playerOverlay.mode-video .embed-only { display: none; }
    .player-hud .btn-group { flex-wrap: nowrap; flex-shrink: 0; }
    .hud-info { flex: 1; min-width: 0; }
    .hud-progress { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 13px; color: var(--muted); }
    .hud-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; }
    #hudBarFill { height: 100%; width: 0; background: var(--accent); }
    .player-osd {
      position: absolute; top: 36px; right: 44px; z-index: 6;
      background: rgba(14, 16, 24, 0.88); padding: 12px 22px; border-radius: 12px;
      font-size: 22px; font-weight: 700; opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .player-osd.show { opacity: 1; }
    .list-box {
      background: var(--panel-alt);
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
    }
    .diag-log {
      background: #0d1017;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.65;
      color: #b8c4e0;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text !important;
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">KINO <span>v0.9.79 VIDAA</span></div>
    <button class="nav-btn focusable active" id="navHome" data-view="home">
      <span>🏠 Inicio</span>
    </button>
    <button class="nav-btn focusable" id="navSearch" data-view="search">
      <span>🔍 Buscar</span>

      <span>🧩 Tienda Plugins</span>

    </button>
    <button class="nav-btn focusable" id="navLive" data-view="livetv">
      <span>📺 En Vivo</span>

    <button class="nav-btn focusable" id="navFavs" data-view="favorites">
      <span>❤️ Mi Biblioteca</span>

    <button class="nav-btn focusable" id="navSettings" data-view="settings">
      <span>⚙️ Ajustes / Red</span>

    <button class="nav-btn focusable" id="navDiag" data-view="diag">
      <span>🩺 Diagnóstico</span>

  <main class="main" id="mainView">
    <div class="header-bar">
      <h1 class="section-title" id="viewTitle">Inicio</h1>
      <div class="status-pill" id="statusPill">Listo · Usa las flechas del control remoto y OK</div>
    </div>
    <div id="viewContent"></div>
  </main>

  <!-- Modal de Ficha de Título, Episodios y Servidores -->
  <div class="overlay" id="detailOverlay">
    <div class="detail-box">
      <img id="detailPoster" class="detail-poster" src="https://raw.githubusercontent.com/kinotvapp/kino-plugin-archive/HEAD/icon.png" alt="Poster" />
      <div class="detail-info">
        <h2 class="detail-title" id="detailTitle">Título</h2>
        <div id="detailMeta" style="color: var(--muted); font-size: 15px;"></div>
        <p class="detail-desc" id="detailDesc"></p>
        <div class="btn-group">
          <button class="action-btn focusable" id="playDirectBtn">▶ Resolver y Reproducir</button>
          <button class="action-btn secondary focusable" id="searchAllPluginsBtn">🔎 Buscar Streams en Plugins</button>
          <button class="action-btn secondary focusable" id="playNativeBtn">🟡 Abrir en Player Nativo VIDAA</button>
          <button class="action-btn secondary focusable" id="favToggleBtn">❤️ Favorito</button>
          <button class="action-btn secondary focusable" id="closeDetailBtn">⬅ Volver</button>
        </div>
        <div id="episodesSection" style="margin-top: 18px;"></div>
        <div id="streamsList" class="streams-box"></div>
      </div>
    </div>
  </div>

  <!-- Modal de Configuración de Plugin -->
  <div class="overlay" id="configOverlay">
    <div style="max-width: 720px; width: 100%; margin: auto; background: var(--panel); padding: 28px; border-radius: 16px; border: 1px solid var(--border);">
      <h2 id="configPluginTitle" style="font-size: 24px; margin-bottom: 8px;">Configurar Plugin</h2>
      <p id="configPluginSub" style="color: var(--muted); font-size: 14px; margin-bottom: 18px;"></p>
      <div id="configFieldsBox"></div>
      <div class="btn-group" style="margin-top: 20px;">
        <button class="action-btn focusable" id="saveConfigBtn">💾 Guardar y Recargar</button>
        <button class="action-btn secondary focusable" id="closeConfigBtn">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Reproductor de Video (HTML5 directo o iframe de servidores embed) -->
  <div class="overlay mode-video" id="playerOverlay">
    <video id="videoPlayer" autoplay playsinline></video>
    <iframe id="webPlayerFrame" style="display:none;" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <div class="player-osd" id="playerOsd"></div>
    <div class="player-hud" id="playerHud">
      <div class="hud-info">
        <div id="nowPlayingTitle" style="font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Reproduciendo...</div>
        <div id="nowPlayingSub" style="font-size: 13px; color: var(--muted);">OK: Pausa/Play · ◀ ▶: 10 s · Back: Salir</div>
        <div class="hud-progress video-only">
          <div class="hud-bar"><div id="hudBarFill"></div></div>
          <span id="hudTime">0:00</span>
        </div>
      </div>
      <div class="btn-group">
        <button class="action-btn small focusable video-only" id="playerRewBtn">⏪ 10 s</button>
        <button class="action-btn small focusable video-only" id="playerPlayPauseBtn">⏸ Pausa</button>
        <button class="action-btn small focusable video-only" id="playerFwdBtn">10 s ⏩</button>
        <button class="action-btn small focusable embed-only" id="playerFocusFrameBtn">🖱 Controlar video</button>
        <button class="action-btn blue small focusable" id="playerNextServerBtn">🔄 Siguiente</button>
        <button class="action-btn secondary small focusable" id="playerNativeHandoffBtn">🟡 Nativo</button>
        <button class="action-btn secondary small focusable" id="closePlayerBtn">✖ Cerrar</button>
      </div>
    </div>
  </div>
    </div>
  </div>

    // Lee el cuerpo con un tope de bytes: evita descargar un video completo cuando
    // un plugin solo "prueba" si la dirección responde (kino.fetch probe).
    async function readBodyCapped(res, capBytes = 4 * 1024 * 1024) {
      try {
        if (res.body && typeof res.body.getReader === "function") {
          const reader = res.body.getReader();
          const chunks = [];
          let total = 0;
          while (total < capBytes) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            total += value.length;
            if (total >= capBytes) { try { await reader.cancel(); } catch (_) {} break; }
          }
          const merged = new Uint8Array(Math.min(total, capBytes));
          let off = 0;
          for (const c of chunks) { merged.set(c.subarray(0, merged.length - off), off); off += Math.min(c.length, merged.length - off); if (off >= merged.length) break; }
          return new TextDecoder("utf-8").decode(merged);
        }
        return await res.text();
      } catch (_) {
        try { return await res.text(); } catch (_) { return ""; }
      }
    }

          return { ok: res.ok, status: res.status, url: url, text: txt, headers: {}, via: proxyPrefix };
        } catch (e) {
          diagLog("red", `${method} ${shortUrl} → proxy ${proxyName} → sin respuesta (${((Date.now() - t0) / 1000).toFixed(1)}s)`);
          throw e;
        }
      };

      // Cadena de proxies pública actualizada (corsproxy.io ya exige llave de pago y se eliminó)
      const proxies = [];
      if (state.customProxy) proxies.push(state.customProxy);
      if (state.lastGoodProxy && !proxies.includes(state.lastGoodProxy)) proxies.push(state.lastGoodProxy);
      ["https://api.codetabs.com/v1/proxy?quest=",
       "https://api.allorigins.win/raw?url=",
       "https://api.cors.lol/?url="].forEach(p => { if (!proxies.includes(p)) proxies.push(p); });

      if (state.corsMode === "direct" || isLikelyCorsFriendly(url)) {
        try {
          const d = await tryDirect();
          if (state.corsMode === "direct" || !looksBlocked(d)) return d;
        } catch (err) {
          if (state.corsMode === "direct") throw err;
        }
      }

      if (state.corsMode === "auto") {
        try {
          const d = await tryDirect();
          if (!looksBlocked(d)) return d;
        } catch (_) {}
        // Sonda no-cors para video: evita que los proxies se ahoguen con archivos
        // pesados y confirma al plugin que el CDN del video sí responde.
        if (!body && isMediaUrl(url)) {
          try {
            const p = await probeMediaNoCors(url, timeoutMs);
            diagLog("red", `SONDA ${shortUrl} → no-cors → CDN alcanzable ✓`);
            return p;
          } catch (_) {
            diagLog("red", `SONDA ${shortUrl} → no-cors → sin respuesta`);
          }
        }
      }

      let firstUsable = null;
      let lastAny = null;
      // Si TODOS los proxies están marcados como caídos, se reintenta con todos igualmente:
      // la marca es una pista, no una condena (una sola URL que falle no debe vetar el proxy).
      const anyAlive = proxies.some(p => Date.now() - (state.deadProxies[p] || 0) >= 10 * 60 * 1000);
      for (const p of proxies) {
        // Proxy marcado como caído hace menos de 10 min: se salta para no pagar su timeout en cada petición
        const deadAt = state.deadProxies[p] || 0;
        if (anyAlive && Date.now() - deadAt < 10 * 60 * 1000) continue;
        try {
          const r = await tryProxy(p);
          if (!r || r.status <= 0) { state.deadProxies[p] = Date.now(); continue; }
          lastAny = r;
          if (r.ok && !looksBlocked(r)) {
            // Recuerda el proxy que sí funcionó para intentarlo primero la próxima vez
            if (state.lastGoodProxy !== p) {
              state.lastGoodProxy = p;
              saveStore("kino_last_proxy", p);
            }
            return r;
          }
          if (looksBlocked(r)) diagLog("red", `   ↳ respuesta inutilizable (reto Cloudflare o proxy saturado)`);
          if (!looksBlocked(r) && !firstUsable) firstUsable = r;
        } catch (_) {
          state.deadProxies[p] = Date.now(); // sin respuesta o timeout: no insistir por un rato
        }
      }
      if (firstUsable) return firstUsable;
      if (lastAny) return lastAny; // conserva la semántica de error del sitio para el plugin
      return await tryDirect();
    }

    // Selector HTML compatible con Jsoup / kino.html.select de Kino APK
    function kinoHtmlSelect(htmlStr, cssSelector) {
      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(String(htmlStr || ""), "text/html");
        const nodes = Array.from(doc.querySelectorAll(String(cssSelector || "*")));
        return nodes.map(el => {
          const attrs = {};
          for (let i = 0; i < el.attributes.length; i++) {
            const a = el.attributes[i];
            attrs[a.name] = a.value;
          }
          let ownText = "";
          el.childNodes.forEach(n => { if (n.nodeType === 3) ownText += n.textContent; });
          return {
            tag: el.tagName.toLowerCase(),
            tagName: el.tagName.toLowerCase(),
            text: (el.textContent || "").trim(),
            ownText: ownText.trim(),
            html: el.innerHTML || "",
            innerHtml: el.innerHTML || "",
            outerHtml: el.outerHTML || "",
            attrs: attrs,
            attr: function(k) { return attrs[k] !== undefined ? attrs[k] : null; }
          };
        });
      } catch (e) {
        return [];
      }
    }

    // Algoritmo oficial kino.rank de prelude.js
    function foldAccents(text) {
      return String(text || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
    }
    function titleTokens(text) {
      const plain = foldAccents(String(text || "").toLowerCase());
      return new Set((plain.match(/[a-z0-9]+/g) || []).filter(w => w.length > 2));
    }
    function sharedCount(a, b) {
      let n = 0;
      a.forEach(t => { if (b.has(t)) n++; });
      return n;
    }
    const kinoRank = {
      shortQuery: function(query) {
        const text = String(query || "").trim();
        const head = text.split(/[:,|–—]/)[0].trim();
        return head.length >= 3 ? head : text;
      },
      sortBySimilarity: function(items, query, getTitle) {
        if (!Array.isArray(items)) return [];
        const of = getTitle || (it => it && it.title);
        const qTokens = titleTokens(Array.isArray(query) ? query.join(" ") : query);
        if (!qTokens.size) return items;
        return items
          .map((item, index) => {
            const t = of(item);
            const iTokens = titleTokens(Array.isArray(t) ? t.join(" ") : t);
            return { item, index, score: sharedCount(qTokens, iTokens) };
          })
          .sort((a, b) => b.score - a.score || a.index - b.index)
          .map(x => x.item);
      },
      filterRelevant: function(items, query, getTitle) {
        if (!Array.isArray(items)) return [];
        return items;
      }
    };

    // Construye el entorno `window.kino` activo para un plugin específico
    function createKinoEnv(pluginId) {
      return {
        apiVersion: 15,
        appVersion: "0.9.79",
        lang: "es",
        fetchAnyHost: true,
        device: "tv",
        screen: { widgets: [], names: [], version: 1 },
        fetch: async function(url, opts = {}) {
          const r = await smartFetch(url, opts);
          return {
            ok: r.ok,
            status: r.status,
            url: r.url,
            headers: r.headers || {},
            truncated: false,
            text: function() { return r.text; },
            json: function() { return JSON.parse(r.text); },
            base64: function() { return btoa(unescape(encodeURIComponent(r.text))); }
          };
        },
        html: {
          select: kinoHtmlSelect
        },
        rank: kinoRank,
        storage: {
          get: function(k) { return loadStore(`kino_pstore_${pluginId}_${k}`, null); },
          set: function(k, v) { saveStore(`kino_pstore_${pluginId}_${k}`, String(v)); },
          remove: function(k) { try { localStorage.removeItem(`kino_pstore_${pluginId}_${k}`); } catch (e) {} },
          keys: function() {
            const prefix = `kino_pstore_${pluginId}_`;
            const out = [];
            try {
              for (let i = 0; i < localStorage.length; i++) {
                const full = localStorage.key(i);
                if (full && full.startsWith(prefix)) out.push(full.slice(prefix.length));
              }
            } catch (e) {}
            return out;
          }
        },
        // Navegador oculto (kino.browser, apiVersion 6+): aproximación web.
        // Descarga la página del reproductor y busca enlaces .m3u8/.mp4 en el HTML.
        // Servidores con ofuscación JS pesada (p. ej. VOE) pueden no resolverse aquí.
        browser: {
          capture: async function(pageUrl, capOpts = {}) {
            try {
              const r = await smartFetch(String(pageUrl), { timeoutMs: capOpts.timeoutMs || 12000 });
              if (!r.ok || !r.text) return null;
              const media = [];
              const seen = new Set();
              const push = (u) => {
                if (!u || seen.has(u)) return;
                seen.add(u);
                media.push({
                  url: u,
                  mime: /\.mp4(?:[?#]|$)/i.test(u) ? "video/mp4" : "application/vnd.apple.mpegurl",
                  headers: { Referer: String(pageUrl) }
                });
              };
              const re = /https?:\\?\/\\?\/[^"'<>\s\\]+?\.(?:m3u8|mp4)(?:\?[^"'<>\s\\]*)?/gi;
              let m;
              while ((m = re.exec(r.text)) !== null) push(m[0].replace(/\\\//g, "/"));
              const matchRe = capOpts.match ? new RegExp(capOpts.match, "i") : null;
              const filtered = matchRe ? media.filter(x => matchRe.test(x.url)) : media;
              if (!filtered.length) return null;
              return { url: String(pageUrl), media: filtered };
            } catch (_) {
              return null;
            }
          }
        },
        config: {
          get: function(k) {
            const cfg = state.pluginConfigs[pluginId] || {};
            return cfg[k];
          },
          all: function() {
            return Object.assign({}, state.pluginConfigs[pluginId] || {});
          }
        },
        cookies: {
          get: function() { return null; },
          clear: function() {}
        },
        crypto: {
          sha256: function(d) { return String(d); },
          md5: function(d) { return String(d); }
        },
        tmdb: async function(path, params = {}) {
          if (!state.tmdbKey) return { results: [] };
          const q = new URLSearchParams(Object.assign({}, params, { api_key: state.tmdbKey }));
          const r = await smartFetch(`https://api.themoviedb.org/3${path}?${q}`);
          return JSON.parse(r.text);
        },
        sleep: function(ms) { return new Promise(res => setTimeout(res, Math.min(Number(ms) || 0, 5000))); },
        error: function(code, message, extra) {
          const err = new Error((extra && extra.userMessage) || message || code);
          err.code = code;
          if (extra && typeof extra === "object") Object.assign(err, extra);
          return err;
        },
        log: Object.assign(function(...a) {
          console.log(`[Plugin ${pluginId}]`, ...a);
          diagLog(pluginId, a.map(x => typeof x === "object" ? JSON.stringify(x) : String(x)).join(" ").slice(0, 300));
        }, {
          report: function(...a) {
            console.warn(`[Plugin ${pluginId}]`, ...a);
            diagLog(pluginId, "⚠️ " + a.map(x => typeof x === "object" ? JSON.stringify(x) : String(x)).join(" ").slice(0, 300));
          }
        })
      };
    }

    // Carga y compila un plugin de GitHub (`kino-plugin.json` + `plugin.js`)
    // Promesas en curso: si Inicio, la ficha y Configurar piden el mismo plugin
    // a la vez, se descarga y compila UNA sola vez (antes se compilaba en paralelo
    // y cada copia quedaba con su propio estado).
    const pluginLoadsInFlight = {};
    function loadGitHubPlugin(pluginEntry) {
      const id = pluginEntry.id;
      if (state.loadedModules[id]) return Promise.resolve(state.loadedModules[id]);
      if (!pluginEntry.address) return Promise.resolve(null);
      if (!pluginLoadsInFlight[id]) {
        pluginLoadsInFlight[id] = loadGitHubPluginNow(pluginEntry)
          .finally(() => { delete pluginLoadsInFlight[id]; });
      }
      return pluginLoadsInFlight[id];
    }

    // Quita el BOM UTF-8 que algunos editores de Windows dejan al inicio y que
    // hace fallar JSON.parse (el plugin "no se instalaba" sin razón aparente).
    function stripBom(text) {
      return String(text || "").replace(/^﻿/, "");
    }

    async function loadGitHubPluginNow(pluginEntry) {
      const id = pluginEntry.id;
      const repo = String(pluginEntry.address).replace(/^\/+|\/+$/g, "");

      // Cada candidato recuerda su rama para bajar el código del MISMO sitio que el manifiesto
      const sources = [
        { ref: "HEAD", base: `https://raw.githubusercontent.com/${repo}/HEAD/` },
        { ref: "main", base: `https://raw.githubusercontent.com/${repo}/main/` },
        { ref: "master", base: `https://raw.githubusercontent.com/${repo}/master/` },
        { ref: "", base: `https://cdn.jsdelivr.net/gh/${repo}/` },
        { ref: "main", base: `https://cdn.jsdelivr.net/gh/${repo}@main/` },
        { ref: "master", base: `https://cdn.jsdelivr.net/gh/${repo}@master/` }
      ];
      let manifest = null;
      let source = null;
      let lastManifestErr = "";
      for (const src of sources) {
        try {
          const r = await smartFetch(src.base + "kino-plugin.json");
          if (!r.ok) { lastManifestErr = `HTTP ${r.status}`; continue; }
          const parsed = JSON.parse(stripBom(r.text));
          if (!parsed || typeof parsed !== "object") { lastManifestErr = "manifiesto vacío"; continue; }
          manifest = parsed;
          source = src;
          break;
        } catch (e) {
          lastManifestErr = e instanceof SyntaxError ? "kino-plugin.json no es JSON válido" : "sin conexión";
        }
      }
      if (!manifest) {
        throw new Error(`No se pudo descargar kino-plugin.json de ${repo} (${lastManifestErr || "sin respuesta"}). ¿El repositorio existe y es público?`);
      }

      // Inicializar (y guardar) los valores por defecto de configuración del manifiesto
      if (Array.isArray(manifest.settings)) {
        state.pluginConfigs[id] = state.pluginConfigs[id] || {};
        let changed = false;
        manifest.settings.forEach(s => {
          if (s && s.key && state.pluginConfigs[id][s.key] === undefined && s.default !== undefined) {
            state.pluginConfigs[id][s.key] = s.default;
            changed = true;
          }
        });
        if (changed) saveStore("kino_plugin_configs", state.pluginConfigs);
      }

      const entryFile = String(manifest.entry || manifest.main || "plugin.js").replace(/^\.?\//, "");
      // Primero la misma rama donde estaba el manifiesto, luego las demás
      const codeSources = [source].concat(sources.filter(s => s !== source));
      let code = null;
      let lastCodeErr = "";
      for (const src of codeSources) {
        try {
          const r = await smartFetch(src.base + entryFile);
          if (r.ok && r.text && !/^\s*</.test(r.text)) { code = stripBom(r.text); break; }
          lastCodeErr = r.ok ? "respuesta vacía o HTML" : `HTTP ${r.status}`;
        } catch (_) { lastCodeErr = "sin conexión"; }
      }
      if (!code) throw new Error(`No se pudo descargar ${entryFile} de ${repo} (${lastCodeErr || "sin respuesta"})`);

      // Imports relativos (`import x from "./lib.js"`): desde un blob: no se pueden
      // resolver, y raw.githubusercontent los sirve como text/plain (el navegador
      // los rechaza como módulo). Se reescriben a jsDelivr, que sí sirve JS.
      const jsdBase = `https://cdn.jsdelivr.net/gh/${repo}${source.ref && source.ref !== "HEAD" ? "@" + source.ref : ""}/`;
      const entryDir = entryFile.includes("/") ? entryFile.slice(0, entryFile.lastIndexOf("/") + 1) : "";
      const absolutize = spec => { try { return new URL(spec, jsdBase + entryDir).href; } catch (_) { return spec; } };
      code = code
        .replace(/(\bimport\s[^'"]*?\bfrom\s*|\bimport\s*|\bexport\s[^'"]*?\bfrom\s*)(['"])(\.{1,2}\/[^'"]+)\2/g,
          (_, pre, q, spec) => `${pre}${q}${absolutize(spec)}${q}`)
        .replace(/\bimport\(\s*(['"])(\.{1,2}\/[^'"]+)\1\s*\)/g, (_, q, spec) => `import(${q}${absolutize(spec)}${q})`);

      // Un solo entorno `kino` por plugin: el que ve el módulo al compilarse es el
      // mismo que se reactiva en cada llamada (storage/config coherentes).
      const env = createKinoEnv(id);
      globalThis.kino = env;
      // No inyectar la declaración si el propio plugin ya declara `kino`
      const declaresKino = /(^|\n)\s*(?:const|let|var)\s+kino\b/.test(code);
      let modExports = null;
      let importErr = null;
      try {
        const wrappedCode = declaresKino ? code : `const kino = globalThis.kino;\n${code}`;
        const blob = new Blob([wrappedCode], { type: "text/javascript" });
        const blobUrl = URL.createObjectURL(blob);
        try { modExports = await import(blobUrl); }
        finally { URL.revokeObjectURL(blobUrl); }
      } catch (err) {
        importErr = err;
      }

      if (!modExports) {
        // Fallback transformando `export async function` / `export function` / `export { ... }`
        try {
          let transformed = code
            .replace(/^\s*import\s[^;]*;?\s*$/gm, "") // quita imports estáticos (no soportados en Function)
            .replace(/export\s+default\s+/g, "exports.default = ")
            .replace(/export\s+async\s+function\s+([A-Za-z0-9_$]+)/g, "exports.$1 = async function $1")
            .replace(/export\s+function\s+([A-Za-z0-9_$]+)/g, "exports.$1 = function $1")
            .replace(/export\s+const\s+([A-Za-z0-9_$]+)\s*=/g, "exports.$1 =")
            .replace(/export\s+let\s+([A-Za-z0-9_$]+)\s*=/g, "exports.$1 =")
            .replace(/export\s+var\s+([A-Za-z0-9_$]+)\s*=/g, "exports.$1 =")
            .replace(/export\s*\{([^}]+)\}\s*;?/g, (_, list) => {
              return list.split(",").map(part => {
                const tokens = part.trim().split(/\s+as\s+/);
                const local = tokens[0].trim();
                const exported = (tokens[1] || tokens[0]).trim();
                return local ? `exports.${exported} = ${local};` : "";
              }).join("\n");
            });
          // Si el plugin declara su propio `kino`, un parámetro con el mismo nombre
          // daba "Identifier 'kino' has already been declared".
          const prelude = declaresKino ? "" : "const kino = __kinoEnv;\n";
          const fn = new Function("__kinoEnv", `const exports = {};\n${prelude}${transformed}\nreturn exports;`);
          modExports = fn(env);
        } catch (fallbackErr) {
          const why = (importErr && importErr.message) || (fallbackErr && fallbackErr.message) || "error desconocido";
          throw new Error(`El código de ${repo} no se pudo ejecutar en este TV: ${why}`);
        }
      }

      // `export default { home, search, ... }` también cuenta
      if (modExports && modExports.default && typeof modExports.default === "object") {
        const merged = Object.assign({}, modExports.default);
        Object.keys(modExports).forEach(k => { if (k !== "default") merged[k] = modExports[k]; });
        modExports = merged;
      }

      const record = { manifest, exports: modExports, env };
      state.loadedModules[id] = record;
      return record;
    }

    async function callPluginFn(pluginEntry, fnName, ...args) {
      const t0 = Date.now();
      const rawArg = args.length ? args[0] : null;
      const argVal = typeof rawArg === "string" ? rawArg : (rawArg && (rawArg.q || rawArg.query));
      const argHint = argVal ? ` "${String(argVal).slice(0, 40)}"` : "";
      try {
        const mod = await loadGitHubPlugin(pluginEntry);
        if (!mod || !mod.exports || typeof mod.exports[fnName] !== "function") return null;
        globalThis.kino = mod.env;
        const res = await mod.exports[fnName](...args);
        const secs = ((Date.now() - t0) / 1000).toFixed(1);
        const size = Array.isArray(res) ? res.length + " ítems" : (res && typeof res === "object" ? Object.keys(res).length + " campos" : String(res));
        diagLog("plugin", `${pluginEntry.id}.${fnName}(${argHint}) → ${size} (${secs}s)`);
        return res;
      } catch (e) {
        const secs = ((Date.now() - t0) / 1000).toFixed(1);
        diagLog("error", `${pluginEntry.id}.${fnName}(${argHint}) → ERROR ${e && e.code ? e.code + ": " : ""}${e && (e.userMessage || e.message)} (${secs}s)`);
        throw e;
      }
    }

    // =========================================================================
    // 3. ADAPTADOR DE ADDONS DE STREMIO (Cinemeta, Pluto TV, Dragon Ball, etc.)
    // =========================================================================
    async function fetchStremioAddonHome(addonEntry) {
      const manifestUrl = addonEntry.stremio;
      if (!manifestUrl) return [];
      const baseUrl = manifestUrl.replace(/\/manifest\.json$/i, "");
      const r = await smartFetch(manifestUrl);
      if (!r.ok) return [];
      const manifest = JSON.parse(r.text);
      const catalogs = (manifest.catalogs || []).filter(c => !c.extra || !c.extra.some(e => e.isRequired));
      const rows = [];

      for (const cat of catalogs.slice(0, 3)) {
        try {
          const catUrl = `${baseUrl}/catalog/${encodeURIComponent(cat.type)}/${encodeURIComponent(cat.id)}.json`;
          const cr = await smartFetch(catUrl);
          if (!cr.ok) continue;
          const data = JSON.parse(cr.text);
          const metas = data.metas || [];
          if (!metas.length) continue;
          rows.push({
            row: `${addonEntry.name} · ${cat.name || cat.type}`,
            sourceId: addonEntry.id,
            sourceName: addonEntry.name,
            items: metas.slice(0, 24).map(m => ({
              id: `${addonEntry.id}_${m.id}`,
              rawId: m.id,
              ref: m.id,
              title: m.name || m.title || "Sin título",
              year: m.releaseInfo || m.year || "",
              poster: m.poster || m.logo || "",
              backdrop: m.background || "",
              synopsis: m.description || "",
              kind: m.type === "series" ? "series" : (m.type === "tv" || m.type === "channel" ? "live" : "movie"),
              stremioBase: baseUrl,
              stremioType: m.type || cat.type,
              pluginId: addonEntry.id,
              source: addonEntry.name
            }))
          });
        } catch (_) {}
      }
      return rows;
    }

    // =========================================================================
    // 3.5 VÍA SIN PROXY: CATÁLOGO CINEMETA (CORS ABIERTO) + SERVIDORES EMBED
    // Cinemeta (el catálogo oficial de Stremio) sirve pósters y sinopsis con
    // CORS habilitado, y los servidores embed se abren en un <iframe>, que no
    // necesita CORS. Resultado: búsqueda y reproducción funcionan aunque todos
    // los proxies públicos estén caídos.
    // =========================================================================
    const CINEMETA_BASE = "https://v3-cinemeta.strem.io";

    function cinemetaItem(m, kind) {
      return {
        id: `cinemeta_${m.id}`,
        rawId: m.id,
        imdbId: m.id,
        ref: m.id,
        title: m.name,
        year: m.releaseInfo || "",
        poster: m.poster || "",
        synopsis: m.description || "",
        kind: kind,
        source: "Cinemeta (sin proxy)"
      };
    }

    async function fetchCinemetaCatalog(type, searchQuery) {
      const url = searchQuery
        ? `${CINEMETA_BASE}/catalog/${type}/top/search=${encodeURIComponent(searchQuery)}.json`
        : `${CINEMETA_BASE}/catalog/${type}/top.json`;
      try {
        const r = await smartFetch(url, { timeoutMs: 20000 });
        if (!r.ok || !r.text) return [];
        const d = JSON.parse(r.text);
        return (d.metas || []).map(m => cinemetaItem(m, type === "series" ? "series" : "movie"));
      } catch (_) { return []; }
    }

    // Servidores embed por ID de IMDb: se reproducen en iframe (sin CORS).
    // Cada uno es una página de terceros con su propio reproductor y publicidad.
    function getSourcesForTitle(imdbId, title, isSeries = false, season = 1, episode = 1) {
      const sources = [];
      if (!imdbId || !imdbId.startsWith("tt")) return sources;
      if (isSeries) {
        sources.push({ name: "Embed69 Latino", badge: "Latino / Sub", type: "embed",
          url: `https://embed69.org/tv/${imdbId}/${season}/${episode}` });
        sources.push({ name: "AutoEmbed HD Multi-idioma", badge: "Multi HD", type: "embed",
          url: `https://player.autoembed.cc/embed/tv/${imdbId}/${season}/${episode}` });

    // =========================================================================
    // 4. CARGA DE INICIO (HOME), CANALES EN VIVO Y BÚSQUEDA MULTIFUENTE
    // =========================================================================
    let homeRefreshRun = 0;
    async function refreshHomeCatalog() {
      // Si se instala/desinstala durante una recarga, la recarga vieja (con la
      // lista anterior) terminaba después y pisaba las filas nuevas.
      const run = ++homeRefreshRun;
      setStatus("Cargando filas desde tus plugins instalados...");
      const allRows = [];

      // Vía sin proxy: tendencias de Cinemeta primero (CORS abierto, nunca se cuelga)
      try {
        const [cmMovies, cmSeries] = await withTimeout(
          Promise.all([fetchCinemetaCatalog("movie"), fetchCinemetaCatalog("series")]),
          25000, "cinemeta home");
        if (cmMovies.length) allRows.push({ row: "⭐ Películas Populares (sin proxy)", sourceName: "Cinemeta", items: cmMovies.slice(0, 24) });
        if (cmSeries.length) allRows.push({ row: "📺 Series Populares (sin proxy)", sourceName: "Cinemeta", items: cmSeries.slice(0, 24) });
      } catch (_) {}

      for (const inst of state.installed.slice()) {
        if (run !== homeRefreshRun) return;
        if (inst.enabled === false || !isInstalled(inst.id)) continue;
        try {
          if (inst.stremio) {
            const sRows = await withTimeout(fetchStremioAddonHome(inst), 40000, inst.name);
            allRows.push(...sRows);
          } else if (inst.address) {
            const res = await withTimeout(callPluginFn(inst, "home"), 45000, inst.name);
            const rowsList = Array.isArray(res) ? res : (res && Array.isArray(res.rows) ? res.rows : []);
            rowsList.forEach(r => {
              const items = Array.isArray(r.items) ? r.items : [];
              if (!items.length) return;
              allRows.push({
                row: `${inst.name} · ${r.title || r.name || "Destacados"}`,
                sourceId: inst.id,
                sourceName: inst.name,
                items: items.slice(0, 30).map(it => ({
                  id: `${inst.id}_${it.id || it.ref || it.title}`,
                  ref: it.ref || it.id,
                  title: it.title || it.name || "Sin título",
                  year: it.year || "",
                  poster: it.poster || it.image || it.cover || "",
                  backdrop: it.backdrop || "",
                  synopsis: it.overview || it.synopsis || it.description || "",
                  kind: it.kind || it.type || "movie",
                  video: it.url || it.video || "",
                  pluginId: inst.id,
                  source: inst.name
                }))
              });
            });

            // Canales del plugin para En Vivo: contrato antiguo `channels()` y el
            // actual de Kino `liveCategories()` + `liveChannels({ categoryId })`
            // (YojaTV, TV Latam...), que antes se ignoraba y no salía ningún canal.
            const addChannel = (ch, group) => {
              if (!ch) return;
              const name = ch.name || ch.title || "Canal";
              const url = ch.url || (ch.stream && ch.stream.url) || "";
              const ref = ch.ref || ch.id || "";
              // Comparar por el nombre ya normalizado (antes los canales con `title`
              // se duplicaban en cada recarga del Inicio)
              const exists = state.liveChannels.some(x => x.pluginId === inst.id && (ref ? x.ref === ref : x.name === name));
              if (exists) return;
              state.liveChannels.push({
                name,
                group: ch.group || group || inst.name,
                logo: ch.logo || ch.poster || ch.image || "",
                url,
                ref,
                pluginId: inst.id
              });
            };
            try {
              const chRes = await withTimeout(callPluginFn(inst, "channels"), 25000, inst.name);
              const chList = Array.isArray(chRes) ? chRes : (chRes && Array.isArray(chRes.channels) ? chRes.channels : []);
              chList.slice(0, 120).forEach(ch => addChannel(ch));
            } catch (_) {}
            try {
              const mod = state.loadedModules[inst.id];
              if (mod && mod.exports && typeof mod.exports.liveChannels === "function") {
                let cats = [];
                if (typeof mod.exports.liveCategories === "function") {
                  const cRes = await withTimeout(callPluginFn(inst, "liveCategories"), 25000, inst.name);
                  cats = Array.isArray(cRes) ? cRes : (cRes && Array.isArray(cRes.items) ? cRes.items : []);
                }
                if (!cats.length) cats = [{ id: undefined, title: inst.name }];
                let total = 0;
                for (const cat of cats.slice(0, 12)) {
                  if (total >= 300 || run !== homeRefreshRun) break;
                  let cursor;
                  for (let page = 0; page < 5 && total < 300; page++) {
                    const lRes = await withTimeout(callPluginFn(inst, "liveChannels", { categoryId: cat.id, cursor }), 25000, inst.name);
                    const items = Array.isArray(lRes) ? lRes : (lRes && Array.isArray(lRes.items) ? lRes.items : []);
                    items.forEach(ch => { addChannel(ch, cat.title || cat.name); total++; });
                    cursor = lRes && lRes.next;
                    if (!cursor || !items.length) break;
                  }
                }
              }
            } catch (_) {}
          }
        } catch (err) {
          console.warn(`Error cargando Home de ${inst.name}:`, err);
          diagLog("error", `Inicio de ${inst.name} → ${(err && (err.userMessage || err.message)) || err}`);
        }
      }

      if (run !== homeRefreshRun) return;
      state.homeRows = allRows;
      setStatus(allRows.length ? `Inicio actualizado (${allRows.length} filas activas)` : "Instala o activa plugins en la Tienda para poblar tu Inicio");
      if (state.view === "home") renderView();
    }

    function isInstalled(id) {
      return state.installed.some(x => x.id === id);
    }

    // Plugins con una instalación/desinstalación en curso: un segundo OK mientras
    // se instala ya no lo desinstala a medias.
    const pluginsBusy = new Set();

    // Comprueba que el plugin realmente carga ANTES de darlo por instalado.
    // Antes se agregaba a la lista y se mostraba "✅ instalado" aunque fallara.
    async function validatePluginEntry(entry) {
      if (entry.stremio) {
        const r = await withTimeout(smartFetch(entry.stremio, { timeoutMs: 20000 }), 30000, entry.name);
        if (!r.ok) throw new Error(`El addon respondió HTTP ${r.status}`);
        let m;
        try { m = JSON.parse(stripBom(r.text)); } catch (_) { throw new Error("La URL no devuelve un manifest.json válido"); }
        if (!m || (!m.id && !Array.isArray(m.catalogs) && !Array.isArray(m.resources))) {
          throw new Error("El manifest.json no parece un addon de Stremio");
        }
        return { name: m.name };
      }
      if (entry.address) {
        delete state.loadedModules[entry.id]; // versión fresca del repositorio
        const mod = await withTimeout(loadGitHubPlugin(entry), 60000, entry.name);
        const fns = mod && mod.exports ? Object.keys(mod.exports).filter(k => typeof mod.exports[k] === "function") : [];
        if (!fns.length) throw new Error("El plugin no exporta ninguna función (home, search, resolve...)");
        return { name: mod.manifest && mod.manifest.name };
      }
      throw new Error("Falta la dirección del plugin (repositorio GitHub o manifest.json)");
    }

    async function toggleInstallPlugin(entry) {
      if (pluginsBusy.has(entry.id)) {
        setStatus(`⏳ ${entry.name}: espera, ya se está procesando...`);
        return;
      }
      pluginsBusy.add(entry.id);
      try {
        const idx = state.installed.findIndex(x => x.id === entry.id);
        if (idx >= 0) {
          state.installed.splice(idx, 1);
          delete state.loadedModules[entry.id];
          // Quitar también los canales que ese plugin había agregado a En Vivo
          state.liveChannels = state.liveChannels.filter(ch => ch.pluginId !== entry.id);
          saveStore("kino_installed_v2", state.installed);
          updateBadges();
          setStatus(`Desinstalado: ${entry.name}`);
          renderView();
          refreshHomeCatalog();
          return;
        }

        setStatus(`Instalando ${entry.name}: descargando y comprobando el plugin...`);
        let info;
        try {
          info = await validatePluginEntry(entry);
        } catch (e) {
          delete state.loadedModules[entry.id];
          const why = (e && (e.userMessage || e.message)) || String(e);
          diagLog("error", `Instalar ${entry.name} → ${why}`);
          setStatus(`✗ No se instaló ${entry.name}: ${why}`, { priority: true });
          return;
        }

        const displayName = (entry.isCustom && info && info.name) || entry.name;
        // Puede haberse instalado por otra vía mientras se validaba
        if (!isInstalled(entry.id)) {
          state.installed.push({
            id: entry.id,
            name: displayName,
            address: entry.address || null,
            stremio: entry.stremio || null,
            enabled: true
          });
          saveStore("kino_installed_v2", state.installed);
        }
        updateBadges();
        renderView();
        setStatus(`✅ ${displayName} instalado y activo · cargando su contenido en Inicio...`, { priority: true });
        // El Inicio se recarga en segundo plano: antes la instalación esperaba a
        // TODOS los plugins (minutos) y parecía colgada.
        refreshHomeCatalog();
      } finally {
        pluginsBusy.delete(entry.id);
      }
    }

    // Acepta "usuario/repo", URLs de github.com (con .git, /tree/rama, etc.)
    // y addons de Stremio (https://… o stremio://…/manifest.json).
    function parsePluginInput(raw) {
      let txt = String(raw || "").trim();
      if (!txt) return null;
      if (/^stremio:\/\//i.test(txt)) txt = "https://" + txt.replace(/^stremio:\/\//i, "");
      if (/manifest\.json(\?.*)?$/i.test(txt)) {
        if (!/^https?:\/\//i.test(txt)) txt = "https://" + txt;
        return { kind: "stremio", url: txt };
      }
      const m = txt
        .replace(/^https?:\/\//i, "")
        .replace(/^(www\.)?github\.com\//i, "")
        .match(/^([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)/);
      if (!m) return null;
      return { kind: "github", repo: `${m[1]}/${m[2].replace(/\.git$/i, "")}` };
    }

    async function installFromManualInput(raw) {
      const parsed = parsePluginInput(raw);
      if (!parsed) {
        setStatus("✗ Escribe usuario/repositorio de GitHub o una URL que termine en manifest.json", { priority: true });
        return;
      }
      const same = parsed.kind === "github"
        ? (x => x.address && x.address.toLowerCase() === parsed.repo.toLowerCase())
        : (x => x.stremio && x.stremio === parsed.url);
      // Antes, escribir un plugin ya instalado lo DESINSTALABA sin avisar
      const already = state.installed.find(same);
      if (already) {
        setStatus(`ℹ️ ${already.name} ya está instalado`, { priority: true });
        return;
      }
      // Si está en la tienda, usar su ficha (id y nombre correctos, sin duplicados)
      const storeEntry = state.storeEntries.find(same);
      if (storeEntry) { await toggleInstallPlugin(storeEntry); return; }

      if (parsed.kind === "stremio") {
        const id = "custom_" + parsed.url.replace(/^https?:\/\//i, "").replace(/[^A-Za-z0-9]+/g, "_").slice(0, 60);
        await toggleInstallPlugin({ id, name: "Addon Personalizado", stremio: parsed.url, isCustom: true });
      } else {
        const id = "gh_" + parsed.repo.toLowerCase().replace(/[^a-z0-9]+/g, "_");
        await toggleInstallPlugin({ id, name: parsed.repo, address: parsed.repo, isCustom: true });
      }
    }

    async function openPluginConfigModal(entry) {
      state.configuringPlugin = entry;
      const overlay = document.getElementById("configOverlay");
      document.getElementById("configPluginTitle").textContent = `Configurar: ${entry.name}`;
      document.getElementById("configPluginSub").textContent = entry.address ? `Repositorio GitHub: ${entry.address}` : (entry.stremio || "");
      const box = document.getElementById("configFieldsBox");
      box.innerHTML = "<p style='color:var(--muted)'>Leyendo opciones del manifiesto...</p>";
      overlay.classList.add("open");

      let settings = [];
      let pluginMod = null;
      if (entry.address) {
        try {
          pluginMod = await loadGitHubPlugin(entry);
          if (pluginMod && pluginMod.manifest && Array.isArray(pluginMod.manifest.settings)) {
            settings = pluginMod.manifest.settings;
          }
        } catch (_) {}
      }

      box.innerHTML = "";
      const currentCfg = state.pluginConfigs[entry.id] || {};
      if (!settings.length) {
        box.innerHTML = `
          <div style="margin-bottom:12px;">
            <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:6px;">URL / Servidor o Parámetro Opcional</label>
            <input class="tv-input focusable" data-cfg-key="url1" value="${currentCfg.url1 || ""}" placeholder="https://..." style="width:100%;" />
          </div>
        `;
      } else {
        // Renderiza cada campo según su tipo del manifiesto (section, select, status, action, texto)
        settings.slice(0, 14).forEach(s => {
          if (!s || !s.key) return;
          const type = String(s.type || "text").toLowerCase();
          const label = s.label || s.title || s.key;

          if (type === "section") {
            const h = document.createElement("div");
            h.style.cssText = "margin:14px 0 8px; font-size:14px; font-weight:700; color:#e4e8f5;";
            h.textContent = label;
            if (s.hint) {
              const hint = document.createElement("div");
              hint.style.cssText = "font-size:12px; color:var(--muted); font-weight:400; margin-top:3px;";
              hint.textContent = s.hint;
              h.appendChild(hint);
            }
            box.appendChild(h);
            return;
          }

          if (type === "status") {
            const row = document.createElement("div");
            row.style.cssText = "margin-bottom:12px; font-size:13px; color:var(--muted);";
            row.innerHTML = `<strong style="color:#e4e8f5;">${label}:</strong> <span data-status-line="${s.key}">…</span>`;
            box.appendChild(row);
            if (pluginMod && pluginMod.exports && typeof pluginMod.exports.settingsStatus === "function") {
              (async () => {
                try {
                  globalThis.kino = pluginMod.env;
                  const st = await pluginMod.exports.settingsStatus();
                  const el = box.querySelector(`[data-status-line="${s.key}"]`);
                  if (el) el.textContent = (st && (st[s.key] || st.info)) || "—";
                } catch (_) {
                  const el = box.querySelector(`[data-status-line="${s.key}"]`);
                  if (el) el.textContent = "—";
                }
              })();
            }
            return;
          }

          if (type === "action") {
            const row = document.createElement("div");
            row.style.marginBottom = "12px";
            const btn = document.createElement("button");
            btn.className = "action-btn secondary small focusable";
            btn.textContent = label;
            btn.addEventListener("click", async () => {
              if (s.confirm && !confirm(s.confirm)) return;
              btn.disabled = true;
              btn.textContent = "…";
              try {
                const res = await callPluginFn(entry, "action", s.key);
                btn.textContent = (res && res.message) || "✓ Listo";
              } catch (e) {
                btn.textContent = "Error";
              }
              setTimeout(() => { btn.disabled = false; btn.textContent = label; }, 2500);
            });
            row.appendChild(btn);
            box.appendChild(row);
            return;
          }

          if (type === "select" && Array.isArray(s.options)) {
            const val = currentCfg[s.key] !== undefined ? currentCfg[s.key] : (s.default !== undefined ? s.default : "");
            const row = document.createElement("div");
            row.style.marginBottom = "12px";
            row.innerHTML = `
              <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:5px;">${label}</label>
              <select class="tv-input focusable" data-cfg-key="${s.key}" style="width:100%;">
                ${s.options.map(o => `<option value="${o.value}" ${String(o.value) === String(val) ? "selected" : ""}>${o.label || o.value}</option>`).join("")}
              </select>
            `;
            box.appendChild(row);
            return;
          }

          // text / number / password / url y cualquier otro tipo simple
          const val = currentCfg[s.key] !== undefined ? currentCfg[s.key] : (s.default || "");
          const row = document.createElement("div");
          row.style.marginBottom = "12px";
          row.innerHTML = `
            <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:5px;">${label}</label>
            <input class="tv-input focusable" data-cfg-key="${s.key}" value="${String(val)}" placeholder="${s.placeholder || s.description || ''}" style="width:100%;" />
          `;
          box.appendChild(row);
        });
      }
    }

            <h3>Instalar cualquier Plugin de Kino (GitHub) o Addon de Stremio</h3>
            <p style="color:var(--muted); font-size:14px;">Escribe <code>usuario/repositorio</code> de GitHub (con <code>kino-plugin.json</code>) o pega una URL terminada en <code>manifest.json</code>:</p>
            <div class="input-row" style="margin-bottom:0;">
              <input id="customPluginInput" class="tv-input focusable" placeholder="Ej: YojaTV-kino/YojaTV_plugin o https://.../manifest.json" />
              <button id="customPluginInstallBtn" class="action-btn focusable">+ Instalar Ahora</button>
            </div>
          </div>

        wrap.appendChild(manualBox);
        viewContent.appendChild(wrap);
        document.getElementById("customPluginInstallBtn").addEventListener("click", async () => {

        });
        document.getElementById("customPluginInput").addEventListener("keydown", e => {
          if (e.key === "Enter") installFromManualInput(e.target.value);
        });
        return;
      }

      // Barra de categorías y filtro de texto
      const catBar = document.createElement("div");
      catBar.className = "cat-bar";
      const cats = [
        { id: "all", label: "Todos" },
        { id: "movies", label: "🎬 Películas" },
        { id: "series", label: "📺 Series" },
        { id: "anime", label: "🎌 Anime" },
        { id: "live", label: "📡 En Vivo" },
        { id: "radio", label: "📻 Radio" },
        { id: "subtitles", label: "💬 Subtítulos" },
        { id: "utilities", label: "🛠️ Utilidades" }
      ];
      if (state.showAdult) cats.push({ id: "adult", label: "🔞 18+" });

      cats.forEach(c => {
        const b = document.createElement("button");
        b.className = "pill-btn focusable" + (state.storeCategory === c.id ? " active" : "");
        b.textContent = c.label;
        b.addEventListener("click", () => { state.storeCategory = c.id; renderView(); });
        catBar.appendChild(b);
      });
      wrap.appendChild(catBar);

      const filterRow = document.createElement("div");
      filterRow.className = "input-row";
      filterRow.innerHTML = `
        <input id="storeFilterInput" class="tv-input focusable" value="${state.storeQuery}" placeholder="Filtrar plugins por nombre, autor o descripción (ej. Latino, Anime, TV, Yoja, CineHax, Pluto)..." />
      `;
      wrap.appendChild(filterRow);

      // Filtrar lista de plugins
      let list = state.storeEntries.filter(e => {
        const isAdult = Array.isArray(e.categories) && e.categories.includes("adult");
        if (isAdult && !state.showAdult && state.storeCategory !== "adult") return false;
        if (state.storeTab === "official" && !e.recommended) return false;
        if (state.storeTab === "community" && e.recommended) return false;
        if (state.storeTab === "installed" && !isInstalled(e.id)) return false;
        if (state.storeCategory !== "all" && (!Array.isArray(e.categories) || !e.categories.includes(state.storeCategory))) return false;
        if (state.storeQuery) {
          const q = state.storeQuery.toLowerCase();
          const hay = `${e.name} ${e.description} ${e.address || ""} ${e.author || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const grid = document.createElement("div");
      grid.className = "plugins-grid";
      const fallbackIcon = "https://avatars.githubusercontent.com/u/332969319?s=120&v=4";

      list.forEach(entry => {
        const installed = isInstalled(entry.id);
        const card = document.createElement("div");
        card.className = "plugin-card" + (installed ? " installed" : "");
        const sourceBadge = entry.stremio
          ? `<span class="tag-chip stremio">Stremio Addon</span>`
          : `<span class="tag-chip">${entry.address || "Kino Plugin"}</span>`;
        const officialBadge = entry.recommended ? `<span class="tag-chip official">De Kino</span>` : "";
        const catChips = (entry.categories || []).map(c => `<span class="tag-chip">${c}</span>`).join("");

        card.innerHTML = `
          <div>
            <div class="plugin-top">
              <img class="plugin-icon" src="${entry.icon || fallbackIcon}" alt="${entry.name}" />
              <div style="min-width:0;">
                <div class="plugin-title">${entry.name} ${entry.version ? `<small style="color:var(--muted); font-weight:500;">v${entry.version}</small>` : ""}</div>
                <div class="plugin-sub">${entry.author ? "Por " + entry.author : (entry.address || "Oficial")}</div>
              </div>
            </div>
            <p class="plugin-desc" style="margin-top:10px;">${entry.description || "Sin descripción."}</p>
          </div>
          <div>
            <div class="plugin-tags" style="margin-bottom:10px;">
              ${officialBadge}
              ${sourceBadge}
              ${catChips}
            </div>
            <div class="plugin-actions">
              <button class="action-btn small focusable ${installed ? 'success' : ''}" data-action="toggle">
                ${installed ? "✓ Instalado (Desinstalar)" : "+ Instalar"}
              </button>
              ${entry.address ? `<button class="action-btn secondary small focusable" data-action="config">⚙️ Configurar</button>` : ""}
              ${installed ? `<button class="action-btn secondary small focusable" data-action="test">▶ Probar Home</button>` : ""}
            </div>
          </div>
        `;
        const img = card.querySelector("img");
        img.addEventListener("error", () => { img.src = fallbackIcon; });
        card.querySelector('[data-action="toggle"]').addEventListener("click", () => toggleInstallPlugin(entry));
        const cfgBtn = card.querySelector('[data-action="config"]');
        if (cfgBtn) cfgBtn.addEventListener("click", () => openPluginConfigModal(entry));
        const testBtn = card.querySelector('[data-action="test"]');
        if (testBtn) testBtn.addEventListener("click", async () => {
          state.view = "home";
          renderView();
          await refreshHomeCatalog();
