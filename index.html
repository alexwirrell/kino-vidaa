    // Carga el selector de episodios de una serie desde Cinemeta y reconstruye
    // las URLs embed al cambiar de capítulo (llevan temporada/episodio dentro)
    async function loadCinemetaEpisodes(item, imdb) {
      try {
        const r = await smartFetch(`${CINEMETA_BASE}/meta/series/${encodeURIComponent(imdb)}.json`, { timeoutMs: 20000 });
        if (!r.ok || !r.text) return;
        const m = JSON.parse(r.text).meta;
        if (!m || !Array.isArray(m.videos) || m.videos.length <= 1) return;
        if (m.description) document.getElementById("detailDesc").textContent = m.description;
        const epSec = document.getElementById("episodesSection");
        epSec.innerHTML = `<h3 style="font-size:16px; margin-bottom:8px;">Seleccionar Episodio (${m.videos.length})</h3><div class="episodes-grid" id="epGrid"></div>`;
        const epGrid = document.getElementById("epGrid");
        m.videos.slice(0, 120).forEach((v, idx) => {
          const b = document.createElement("button");
          b.className = "ep-btn focusable" + (idx === 0 ? " active" : "");
          const sNum = v.season || 1, eNum = v.episode || v.number || (idx + 1);
          b.textContent = `T${sNum}:E${eNum} · ${v.name || v.title || "Episodio " + eNum}`;
          b.addEventListener("click", () => {
            epGrid.querySelectorAll(".ep-btn").forEach(btn => btn.classList.remove("active"));
            b.classList.add("active");
            state.selectedSeason = sNum;
            state.selectedEpisode = eNum;
            state.activeSources = getSourcesForTitle(imdb, item.title, true, sNum, eNum);
            renderEmbedSources(item);
            // Enlaces del episodio anterior ya no valen
            state.directStreams = [];
            document.getElementById("directStreamsList").innerHTML = "";
            state.extractSearch = { item, promise: extractAllEmbeds(item) };
            setStatus(`Servidores actualizados para T${sNum}:E${eNum}`);
          });
          epGrid.appendChild(b);
        });
      } catch (_) {}
    }

    // =========================================================================
    // 4. CARGA DE INICIO (HOME), CANALES EN VIVO Y BÚSQUEDA MULTIFUENTE
    // =========================================================================
    // Ejecuta tareas con un máximo de N a la vez (antes todo iba en fila, uno
    // por uno, y un solo plugin lento retrasaba todo el Inicio)
    async function runPool(items, limit, worker) {
      let next = 0;
      const runners = Array.from({ length: Math.max(1, Math.min(limit, items.length)) }, async () => {
        while (next < items.length) {
          const idx = next++;
          try { await worker(items[idx], idx); } catch (_) {}
        }
      });
      await Promise.all(runners);
    }

    // Caché del Inicio: al abrir la app se muestran al instante las filas de la
    // última vez mientras se actualizan en segundo plano.
    const HOME_CACHE_KEY = "kino_home_cache_v1";
    function loadHomeCache() {
      const c = loadStore(HOME_CACHE_KEY, null);
      if (!c || !Array.isArray(c.rows)) return [];
      if (Date.now() - (c.t || 0) > 3 * 24 * 3600 * 1000) return [];
      return c.rows;
    }
    function saveHomeCache(rows) {
      try {
        const slim = rows.slice(0, 40).map(r => Object.assign({}, r, {
          items: r.items.slice(0, 20).map(it => { const o = Object.assign({}, it); delete o.synopsis; return o; })
        }));
        localStorage.setItem(HOME_CACHE_KEY, JSON.stringify({ t: Date.now(), rows: slim }));
      } catch (_) { /* sin espacio: no pasa nada */ }
    }

    function mapPluginHomeRows(inst, res) {
      const rowsList = Array.isArray(res) ? res : (res && Array.isArray(res.rows) ? res.rows : []);
      const out = [];
      rowsList.forEach(r => {
        const items = r && Array.isArray(r.items) ? r.items : [];
        if (!items.length) return;
        out.push({
          row: `${inst.name} · ${r.title || r.name || "Destacados"}`,
          sourceId: inst.id,
          sourceName: inst.name,
          items: items.slice(0, 30).map(it => ({
            id: `${inst.id}_${it.id || it.ref || it.title}`,
            ref: it.ref || it.id,
            title: it.title || it.name || "Sin título",
            year: it.year || "",
            poster: it.poster || it.image || it.cover || "",
            backdrop: it.backdrop || "",
            synopsis: it.overview || it.synopsis || it.description || "",
            kind: it.kind || it.type || "movie",
            video: it.url || it.video || "",
            ids: it.ids || undefined,
            pluginId: inst.id,
            source: inst.name
          }))
        });
      });
      return out;
    }

    function cinemetaActive() {
      return state.installed.some(i => i.id === "cinemeta" && i.enabled !== false);
    }

    // Qué pasó con cada plugin la última vez (se ve en Tienda ▸ Instalados)
    function setPluginStatus(inst, msg, ok) {
      state.pluginStatus[inst.id] = { msg: String(msg).slice(0, 160), ok: !!ok, t: Date.now() };
      saveStore("kino_plugin_status", state.pluginStatus);
    }

    // Filas del Inicio que el plugin entrega vacías con un `ref` (se cargan
    // aparte con browse(ref)): antes se descartaban y el plugin "no salía"
    async function fillLazyRows(inst, res, rows) {
      const list = Array.isArray(res) ? res : (res && Array.isArray(res.rows) ? res.rows : []);
      const lazy = list.filter(r => r && (!Array.isArray(r.items) || !r.items.length) && (r.ref || r.id)).slice(0, 6);
      if (!lazy.length) return;
      const mod = state.loadedModules[inst.id];
      if (!mod || !mod.exports || typeof mod.exports.browse !== "function") return;
      await runPool(lazy, 3, async r => {
        try {
          const page = await withTimeout(callPluginFn(inst, "browse", r.ref || r.id), 20000, inst.name);
          const items = Array.isArray(page) ? page : (page && Array.isArray(page.items) ? page.items : []);
          if (items.length) rows.push(...mapPluginHomeRows(inst, [{ title: r.title || r.name, items }]));
        } catch (_) {}
      });
    }

    let homeRefreshRun = 0;
    async function refreshHomeCatalog() {
      // Si se instala/desinstala durante una recarga, la recarga vieja (con la
      // lista anterior) terminaba después y pisaba las filas nuevas.
      const run = ++homeRefreshRun;
      // Cinemeta se carga por la vía rápida de arriba: no repetir sus filas como addon
      const active = state.installed.filter(i => i.enabled !== false && (i.stremio || i.address) && i.id !== "cinemeta");
      const total = active.length + 1;
      let done = 0;
      setStatus(`Cargando Inicio... (0/${total})`);
      // Un "hueco" por fuente, en el orden de siempre; mientras una fuente no
      // responde se muestran sus filas guardadas de la última vez.
      const slots = new Array(total).fill(null);
      const previous = state.homeRows.slice();
      const sourceIds = ["cinemeta-home"].concat(active.map(i => i.id));
      const compose = () => {
        const rows = [];
        slots.forEach((sl, i) => {
          if (sl) rows.push(...sl);
          else rows.push(...previous.filter(r => r.sourceId === sourceIds[i]));
        });
        return rows;
      };
      let renderTimer = null;
      const publish = () => {
        if (run !== homeRefreshRun) return;
        state.homeRows = compose();
        if (state.view === "home") renderView();
      };
      const finished = () => {
        done++;
        if (run === homeRefreshRun) setStatus(`Cargando Inicio... (${done}/${total})`);
        // Se redibuja a lo sumo cada 0.8 s para no interrumpir la navegación
        if (!renderTimer) renderTimer = setTimeout(() => { renderTimer = null; publish(); }, 800);
      };

      const cinemetaTask = (async () => {
        // Las filas de Cinemeta solo salen si el addon Cinemeta está instalado y
        // activo (antes estaban fijas: seguían saliendo aunque se desinstalara)
        if (!cinemetaActive()) { slots[0] = []; finished(); return; }
        try {
          const [cmMovies, cmSeries] = await withTimeout(
            Promise.all([fetchCinemetaCatalog("movie"), fetchCinemetaCatalog("series")]),
            20000, "cinemeta home");
          const rows = [];
          if (cmMovies.length) rows.push({ row: "⭐ Películas Populares (sin proxy)", sourceId: "cinemeta-home", sourceName: "Cinemeta", items: cmMovies.slice(0, 24) });
          if (cmSeries.length) rows.push({ row: "📺 Series Populares (sin proxy)", sourceId: "cinemeta-home", sourceName: "Cinemeta", items: cmSeries.slice(0, 24) });
          slots[0] = rows.length ? rows : null; // sin respuesta: se conservan las filas anteriores
        } catch (_) { slots[0] = null; }
        finished();
      })();

      const pluginsTask = runPool(active, 4, async (inst, i) => {
        if (run !== homeRefreshRun || !isInstalled(inst.id)) { slots[i + 1] = []; finished(); return; }
        try {
          if (inst.stremio) {
            slots[i + 1] = await withTimeout(fetchStremioAddonHome(inst), 30000, inst.name);
            setPluginStatus(inst, slots[i + 1].length ? `✓ ${slots[i + 1].length} filas en Inicio` : "Sin filas de catálogo (addon de búsqueda, subtítulos o streams)", !!slots[i + 1].length);
          } else {
            const mod = await withTimeout(loadGitHubPlugin(inst), 30000, inst.name);
            if (!mod || !mod.exports || typeof mod.exports.home !== "function") {
              slots[i + 1] = [];
              setPluginStatus(inst, "No tiene Inicio: sirve para buscar o reproducir", true);
            } else {
              const res = await withTimeout(callPluginFn(inst, "home"), 30000, inst.name);
              const rows = mapPluginHomeRows(inst, res);
              await fillLazyRows(inst, res, rows);
              slots[i + 1] = rows;
              // Plugin solo de canales: sin "home" en sus capacidades (TV Latam). YojaTV
              // tiene canales Y catálogo: si su Inicio llega vacío, es un problema real
              const caps = (mod.manifest && Array.isArray(mod.manifest.capabilities)) ? mod.manifest.capabilities : null;
              const live = (typeof mod.exports.liveChannels === "function" || typeof mod.exports.channels === "function") && !(caps && caps.includes("search"));
              setPluginStatus(inst, rows.length ? `✓ ${rows.length} filas en Inicio`
                : live ? "📺 Plugin de canales: búscalos en En Vivo"
                : "Su Inicio llegó vacío (¿necesita configuración, una llave de TMDB, o el sitio no respondió?)", !!rows.length || live);
            }
          }
        } catch (err) {
          slots[i + 1] = null; // falló o tardó: se siguen mostrando sus filas anteriores
          setPluginStatus(inst, `✗ ${(err && (err.userMessage || err.message)) || err}`, false);
          diagLog("error", `Inicio de ${inst.name} → ${(err && (err.userMessage || err.message)) || err}`);
        }
        finished();
      });

      await Promise.all([cinemetaTask, pluginsTask]);
      if (run !== homeRefreshRun) return;
      clearTimeout(renderTimer);
      renderTimer = null;
      publish();
      if (state.homeRows.length) saveHomeCache(state.homeRows); // sin red no se borra la caché
      setStatus(state.homeRows.length ? `Inicio actualizado (${state.homeRows.length} filas)` : "Instala o activa plugins en la Tienda para poblar tu Inicio");
      // Los canales en vivo se cargan aparte, sin bloquear el Inicio
      refreshLiveChannels();
    }

    // Canales de los plugins para En Vivo: contrato antiguo `channels()` y el
    // actual de Kino `liveCategories()` + `liveChannels({ categoryId })`.
    let liveRefreshRun = 0;
    async function refreshLiveChannels() {
      const run = ++liveRefreshRun;
      const plugins = state.installed.filter(i => i.enabled !== false && i.address);
      state.liveLoading = true;
      if (state.view === "livetv") renderView();
      await runPool(plugins, 3, async inst => {
        if (run !== liveRefreshRun || !isInstalled(inst.id)) return;
        const addChannel = (ch, group) => {
          if (!ch) return;
          const name = ch.name || ch.title || "Canal";
          const url = ch.url || (ch.stream && ch.stream.url) || "";
          const ref = ch.ref || ch.id || "";
          const exists = state.liveChannels.some(x => x.pluginId === inst.id && (ref ? x.ref === ref : x.name === name));
          if (exists) return;
          state.liveChannels.push({ name, group: ch.group || group || inst.name, logo: ch.logo || ch.poster || ch.image || "", url, ref, pluginId: inst.id });
        };
        let mod;
        try { mod = await withTimeout(loadGitHubPlugin(inst), 30000, inst.name); } catch (_) { return; }
        const ex = (mod && mod.exports) || {};
        if (typeof ex.channels === "function") {
          try {
            const chRes = await withTimeout(callPluginFn(inst, "channels"), 15000, inst.name);
            const chList = Array.isArray(chRes) ? chRes : (chRes && Array.isArray(chRes.channels) ? chRes.channels : []);
            chList.slice(0, 200).forEach(ch => addChannel(ch));
          } catch (_) {}
        }
        if (typeof ex.liveChannels === "function") {
          let cats = [];
          if (typeof ex.liveCategories === "function") {
            try {
              const cRes = await withTimeout(callPluginFn(inst, "liveCategories"), 15000, inst.name);
              cats = Array.isArray(cRes) ? cRes : (cRes && Array.isArray(cRes.items) ? cRes.items : []);
            } catch (_) {}
          }
          if (!cats.length) cats = [{ id: undefined, title: inst.name }];
          // Categorías en paralelo (antes: hasta 60 llamadas seguidas por plugin)
          await runPool(cats.slice(0, 12), 4, async cat => {
            let cursor;
            for (let page = 0; page < 3; page++) {
              if (run !== liveRefreshRun) return;
              const lRes = await withTimeout(callPluginFn(inst, "liveChannels", { categoryId: cat.id, cursor }), 15000, inst.name);
              const items = Array.isArray(lRes) ? lRes : (lRes && Array.isArray(lRes.items) ? lRes.items : []);
              items.forEach(ch => addChannel(ch, cat.title || cat.name));
              cursor = lRes && lRes.next;
              if (!cursor || !items.length) break;
            }
          });
        }
        if (state.view === "livetv" && run === liveRefreshRun) renderView();
      });
      if (run !== liveRefreshRun) return;
      state.liveLoading = false;
      if (state.view === "livetv") renderView();
    }

    // =========================================================================
    // 5. RENDERIZADO DE PANTALLAS (INICIO, BUSCAR, TIENDA DE PLUGINS, EN VIVO)
    // =========================================================================
    async function playLiveChannel(ch) {
      markUserPlayIntent();
      if (ch.url) { startPlayback(ch.url, ch.name, { live: true }); return; }
      const inst = ch.pluginId && state.installed.find(x => x.id === ch.pluginId);
      if (!inst || !ch.ref) { setStatus("Este canal no tiene dirección de video"); return; }
      setStatus(`Resolviendo canal ${ch.name}...`);
      try {
        const r = await withTimeout(callPluginFn(inst, "resolve", ch.ref), 30000, inst.name);
        const streamUrl = r && (r.url || (Array.isArray(r.copies) && r.copies[0] && r.copies[0].url));
        if (streamUrl) startPlayback(streamUrl, ch.name, { mime: r.mime, referer: refOf(r), live: true });
        else setStatus("No se pudo obtener el video del canal");
      } catch (e) {
        setStatus(`✗ ${ch.name}: ${(e && (e.userMessage || e.message)) || "no disponible"}`, { priority: true });
      }
    }

    function renderCardGrid(items, horizontal) {
      const grid = document.createElement("div");
      grid.className = horizontal ? "cards-row" : "cards-grid";
      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "card focusable";
        card.tabIndex = 0;
        const fallbackImg = "https://avatars.githubusercontent.com/u/332969319?s=200&v=4";
        card.innerHTML = `
          <img class="card-poster" src="${item.poster || fallbackImg}" alt="${item.title}" />
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div class="card-meta">${item.year ? item.year + " · " : ""}${item.source || "Kino"}</div>
          </div>
        `;
        const imgEl = card.querySelector("img");
        imgEl.addEventListener("error", () => { imgEl.src = fallbackImg; });
        card.addEventListener("click", () => { state.lastFocusedCard = card; openDetail(item); });
        grid.appendChild(card);
      });
      return grid;
    }

    function isInstalled(id) {
      return state.installed.some(x => x.id === id);
    }

    // Plugins con una instalación/desinstalación en curso: un segundo OK mientras
    // se instala ya no lo desinstala a medias.
    const pluginsBusy = new Set();

    // Comprueba que el plugin realmente carga ANTES de darlo por instalado.
    // Antes se agregaba a la lista y se mostraba "✅ instalado" aunque fallara.
    async function validatePluginEntry(entry) {
      if (entry.stremio) {
        const r = await withTimeout(smartFetch(entry.stremio, { timeoutMs: 20000 }), 30000, entry.name);
        if (!r.ok) throw new Error(`El addon respondió HTTP ${r.status}`);
        let m;
        try { m = parseLenientJson(r.text); } catch (_) { throw new Error("La URL no devuelve un manifest.json válido"); }
        if (!m || (!m.id && !Array.isArray(m.catalogs) && !Array.isArray(m.resources))) {
          throw new Error("El manifest.json no parece un addon de Stremio");
        }
        return { name: m.name };
      }
      if (entry.address) {
        delete state.loadedModules[entry.id]; // versión fresca del repositorio
        const mod = await withTimeout(loadGitHubPlugin(entry), 60000, entry.name);
        const fns = mod && mod.exports ? Object.keys(mod.exports).filter(k => typeof mod.exports[k] === "function") : [];
        if (!fns.length) throw new Error("El plugin no exporta ninguna función (home, search, resolve...)");
        return { name: mod.manifest && mod.manifest.name };
      }
      throw new Error("Falta la dirección del plugin (repositorio GitHub o manifest.json)");
    }

    async function toggleInstallPlugin(entry) {
      if (pluginsBusy.has(entry.id)) {
        setStatus(`⏳ ${entry.name}: espera, ya se está procesando...`);
        return;
      }
      pluginsBusy.add(entry.id);
      try {
        const idx = state.installed.findIndex(x => x.id === entry.id);
        if (idx >= 0) {
          state.installed.splice(idx, 1);
          delete state.loadedModules[entry.id];
          // Quitar también los canales que ese plugin había agregado a En Vivo
          state.liveChannels = state.liveChannels.filter(ch => ch.pluginId !== entry.id);
          saveStore("kino_installed_v2", state.installed);
          updateBadges();
          setStatus(`Desinstalado: ${entry.name}`);
          renderView();
          refreshHomeCatalog();
          return;
        }

        setStatus(`Instalando ${entry.name}: descargando y comprobando el plugin...`);
        let info;
        try {
          info = await validatePluginEntry(entry);
        } catch (e) {
          delete state.loadedModules[entry.id];
          const why = (e && (e.userMessage || e.message)) || String(e);
          diagLog("error", `Instalar ${entry.name} → ${why}`);
          setStatus(`✗ No se instaló ${entry.name}: ${why}`, { priority: true });
          return;
        }

        const displayName = (entry.isCustom && info && info.name) || entry.name;
        // Puede haberse instalado por otra vía mientras se validaba
        if (!isInstalled(entry.id)) {
          state.installed.push({
            id: entry.id,
            name: displayName,
            address: entry.address || null,
            stremio: entry.stremio || null,
            enabled: true
          });
          saveStore("kino_installed_v2", state.installed);
        }
        updateBadges();
        renderView();
        setStatus(`✅ ${displayName} instalado y activo · cargando su contenido en Inicio...`, { priority: true });
        // El Inicio se recarga en segundo plano: antes la instalación esperaba a
        // TODOS los plugins (minutos) y parecía colgada.
        refreshHomeCatalog();
      } finally {
        pluginsBusy.delete(entry.id);
      }
    }

    // Acepta "usuario/repo", URLs de github.com (con .git, /tree/rama, etc.)
    // y addons de Stremio (https://… o stremio://…/manifest.json).
    function parsePluginInput(raw) {
      let txt = String(raw || "").trim();
      if (!txt) return null;
      if (/^stremio:\/\//i.test(txt)) txt = "https://" + txt.replace(/^stremio:\/\//i, "");
      if (/manifest\.json(\?.*)?$/i.test(txt)) {
        if (!/^https?:\/\//i.test(txt)) txt = "https://" + txt;
        return { kind: "stremio", url: txt };
      }
      const m = txt
        .replace(/^https?:\/\//i, "")
        .replace(/^(www\.)?github\.com\//i, "")
        .match(/^([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)/);
      if (!m) return null;
      return { kind: "github", repo: `${m[1]}/${m[2].replace(/\.git$/i, "")}` };
    }

    async function installFromManualInput(raw) {
      const parsed = parsePluginInput(raw);
      if (!parsed) {
        setStatus("✗ Escribe usuario/repositorio de GitHub o una URL que termine en manifest.json", { priority: true });
        return;
      }
      const same = parsed.kind === "github"
        ? (x => x.address && x.address.toLowerCase() === parsed.repo.toLowerCase())
        : (x => x.stremio && x.stremio === parsed.url);
      // Antes, escribir un plugin ya instalado lo DESINSTALABA sin avisar
      const already = state.installed.find(same);
      if (already) {
        setStatus(`ℹ️ ${already.name} ya está instalado`, { priority: true });
        return;
      }
      // Si está en la tienda, usar su ficha (id y nombre correctos, sin duplicados)
      const storeEntry = state.storeEntries.find(same);
      if (storeEntry) { await toggleInstallPlugin(storeEntry); return; }

      if (parsed.kind === "stremio") {
        const id = "custom_" + parsed.url.replace(/^https?:\/\//i, "").replace(/[^A-Za-z0-9]+/g, "_").slice(0, 60);
        await toggleInstallPlugin({ id, name: "Addon Personalizado", stremio: parsed.url, isCustom: true });
      } else {
        const id = "gh_" + parsed.repo.toLowerCase().replace(/[^a-z0-9]+/g, "_");
        await toggleInstallPlugin({ id, name: parsed.repo, address: parsed.repo, isCustom: true });
      }
    }

    async function openPluginConfigModal(entry) {
      state.configuringPlugin = entry;

      document.getElementById("configPluginSub").textContent = entry.address ? `Repositorio GitHub: ${entry.address}` : (entry.stremio || "");
      const box = document.getElementById("configFieldsBox");
      box.innerHTML = "<p style='color:var(--muted)'>Leyendo opciones del manifiesto...</p>";
      overlay.classList.add("open");

      let settings = [];
      let pluginMod = null;
      if (entry.address) {
        try {
          pluginMod = await loadGitHubPlugin(entry);
          if (pluginMod && pluginMod.manifest && Array.isArray(pluginMod.manifest.settings)) {
            settings = pluginMod.manifest.settings;
          }
        } catch (_) {}
      }

      box.innerHTML = "";

      if (!settings.length) {
        box.innerHTML = `
          <div style="margin-bottom:12px;">

          </div>
        `;
      } else {
        // Renderiza cada campo según su tipo del manifiesto (section, select, status, action, texto)
        settings.slice(0, 14).forEach(s => {
          if (!s || !s.key) return;
          const type = String(s.type || "text").toLowerCase();
          const label = s.label || s.title || s.key;

          if (type === "section") {

              hint.textContent = s.hint;
              h.appendChild(hint);
            }
            box.appendChild(h);

          }

          if (type === "status") {

            row.innerHTML = `<strong style="color:#e4e8f5;">${label}:</strong> <span data-status-line="${s.key}">…</span>`;
            box.appendChild(row);
            if (pluginMod && pluginMod.exports && typeof pluginMod.exports.settingsStatus === "function") {
              (async () => {
                try {
                  globalThis.kino = pluginMod.env;
                  const st = await pluginMod.exports.settingsStatus();
                  const el = box.querySelector(`[data-status-line="${s.key}"]`);
                  if (el) el.textContent = (st && (st[s.key] || st.info)) || "—";
                } catch (_) {
                  const el = box.querySelector(`[data-status-line="${s.key}"]`);
                  if (el) el.textContent = "—";

          }

            row.style.marginBottom = "12px";
            const btn = document.createElement("button");
            btn.className = "action-btn secondary small focusable";
            btn.textContent = label;
            btn.addEventListener("click", async () => {
              if (s.confirm && !confirm(s.confirm)) return;
              btn.disabled = true;
              btn.textContent = "…";
              try {
                const res = await callPluginFn(entry, "action", s.key);
                btn.textContent = (res && res.message) || "✓ Listo";
              } catch (e) {
                btn.textContent = "Error";
              }
              setTimeout(() => { btn.disabled = false; btn.textContent = label; }, 2500);
            });
            row.appendChild(btn);
            box.appendChild(row);
            return;
          }

          if (type === "select" && Array.isArray(s.options)) {
            const val = currentCfg[s.key] !== undefined ? currentCfg[s.key] : (s.default !== undefined ? s.default : "");
            const row = document.createElement("div");

            row.innerHTML = `

          row.style.marginBottom = "12px";

          box.appendChild(row);

      // Secretos del manifiesto: valores propios (los sellados de Kino no se pueden leer)

        Object.keys(secretSpec).slice(0, 10).forEach(name => {
          const d = secretSpec[name];

          sec.appendChild(row);
        });
        box.appendChild(sec);

    // Re-dibuja la vista sin perder el foco del control remoto: antes, al
    // cambiar de pestaña o al terminar de cargar el Inicio en segundo plano,
    // el foco desaparecía y la siguiente flecha saltaba a otro lado.
    function focusSignature(el) {
      if (!el || !el.classList || !el.classList.contains("focusable")) return null;
      if (el.id) return "#" + el.id;
      return el.tagName + "|" + el.className.replace(/\b(active|installed|success)\b/g, "").trim() + "|" + (el.textContent || "").trim().slice(0, 60);
    }
    function renderView() {
      const prev = document.activeElement;
      const hadFocusInMain = !!(prev && prev.closest && prev.closest("#viewContent"));
      const sig = hadFocusInMain ? focusSignature(prev) : null;
      const prevRect = hadFocusInMain ? prev.getBoundingClientRect() : null;
      renderViewInner();
      if (!hadFocusInMain || document.activeElement && document.activeElement !== document.body && document.contains(document.activeElement)) return;
      if (focusScope() !== document) return;
      const list = visibleFocusables(document.getElementById("viewContent"));
      const same = sig && list.find(el => focusSignature(el) === sig);
      const target = same || (prevRect && nearestTo(prevRect, list));
      if (target) { try { target.focus({ preventScroll: true }); } catch (_) { target.focus(); } }
    }

              const list = Array.isArray(res) ? res : (res && Array.isArray(res.items) ? res.items : []);
              if (list.length) {
                found.push({
                  title: inst.name,
                  items: list.slice(0, 24).map(it => ({

            <pre id="workerCode" class="diag-log" style="max-height:180px;">// =============================================================================
// Proxy propio de Kino VIDAA para Cloudflare Workers (gratis)
//
// Por qué: los proxies públicos (codetabs, allorigins, cors.lol) suelen estar
// caídos o bloqueados, y sin proxy los plugins no pueden buscar ni la app puede

//

//   1. Entra en https://dash.cloudflare.com (crea una cuenta gratis).
//   2. Menú "Workers &amp; Pages" → "Create" → "Create Worker" → "Deploy".
//   3. "Edit code": borra todo, pega ESTE archivo completo y pulsa "Deploy".

//
// Clave privada (recomendado): escribe una clave en ACCESS_KEY, aquí abajo,
// SOLO en el editor de Cloudflare (no la subas a ningún repositorio). Así nadie
// más puede usar tu worker aunque conozca la dirección. En la app escribe la

//

import { connect } from "cloudflare:sockets";

const ACCESS_KEY = ""; // ← pon aquí tu clave (p. ej. "mi-clave-larga-123"); vacío = sin clave

const BROWSER_UA =
  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36";

// Cabeceras del navegador del TV que no se reenvían al destino
const DROP = ["host", "origin", "referer", "cookie", "cf-connecting-ip", "cf-ipcountry", "cf-ray", "cf-visitor",
  "x-forwarded-for", "x-forwarded-proto", "x-real-ip", "sec-fetch-site", "sec-fetch-mode", "sec-fetch-dest"];

// ---------------------------------------------------------------------------
// Canales en vivo en http://IP:PUERTO (p. ej. TV Latam: http://190.108.83.69:8000).
// El fetch() de Cloudflare solo conecta a algunos puertos (y no a toda IP), así
// que para esos se habla HTTP "a mano" por una conexión TCP (cloudflare:sockets),
// enviando el video por streaming (sin acumularlo: poco CPU en el plan gratis).
// ---------------------------------------------------------------------------
const FETCH_PORTS = { "http:": ["", "80", "8080", "8880", "2052", "2082", "2086", "2095"],
                      "https:": ["", "443", "2053", "2083", "2087", "2096", "8443"] };
const isIpHost = h =&gt; /^\\d{1,3}(\\.\\d{1,3}){3}$/.test(h) || h.includes(":") || h.startsWith("[");
const needsSocket = u =&gt; !FETCH_PORTS[u.protocol].includes(u.port) || isIpHost(u.hostname);

function joinBytes(a, b) {
  if (!a.length) return b;
  const out = new Uint8Array(a.length + b.length);
  out.set(a); out.set(b, a.length);
  return out;
}
function indexOfSeq(buf, seq) {
  outer: for (let i = 0; i + seq.length &lt;= buf.length; i++) {
    for (let j = 0; j &lt; seq.length; j++) if (buf[i + j] !== seq[j]) continue outer;
    return i;
  }
  return -1;
}
const CRLF = [13, 10], CRLF2 = [13, 10, 13, 10];

async function socketFetch(u, method, headers, body, manual, hops = 0) {
  const secure = u.protocol === "https:";
  const sock = connect({ hostname: u.hostname.replace(/^\\[|\\]$/g, ""), port: Number(u.port || (secure ? 443 : 80)) },
    secure ? { secureTransport: "on", allowHalfOpen: false } : { allowHalfOpen: false });
  const w = sock.writable.getWriter();
  let head = \`\${method} \${u.pathname || "/"}\${u.search} HTTP/1.1\\r\\nHost: \${u.host}\\r\\nConnection: close\\r\\nAccept-Encoding: identity\\r\\n\`;
  for (const [k, v] of headers) if (!/^(host|connection|accept-encoding|content-length|transfer-encoding)$/i.test(k)) head += \`\${k}: \${v}\\r\\n\`;
  if (body) head += \`Content-Length: \${body.byteLength}\\r\\n\`;
  await w.write(new TextEncoder().encode(head + "\\r\\n"));
  if (body) await w.write(new Uint8Array(body));
  w.releaseLock();

  const reader = sock.readable.getReader();
  let pending = new Uint8Array(0);
  const readMore = async () =&gt; { const { value, done } = await reader.read(); if (done) return false; pending = joinBytes(pending, value); return true; };
  let end = -1;
  while ((end = indexOfSeq(pending, CRLF2)) &lt; 0) {
    if (pending.length &gt; 65536) throw new Error("cabeceras demasiado grandes");
    if (!(await readMore())) throw new Error("el servidor cerró la conexión sin responder");
  }
  const lines = new TextDecoder().decode(pending.subarray(0, end)).split("\\r\\n");
  pending = pending.subarray(end + 4);
  const m = /^HTTP\\/\\d(?:\\.\\d)?\\s+(\\d{3})\\s*(.*)$/.exec(lines[0]);
  if (!m) throw new Error("respuesta que no es HTTP");
  const status = Number(m[1]);
  const rh = new Headers();
  for (const l of lines.slice(1)) { const i = l.indexOf(":"); if (i &gt; 0) rh.append(l.slice(0, i).trim(), l.slice(i + 1).trim()); }

  if (!manual &amp;&amp; [301, 302, 303, 307, 308].includes(status) &amp;&amp; rh.get("location") &amp;&amp; hops &lt; 5) {
    reader.cancel().catch(() =&gt; {});
    const next = new URL(rh.get("location"), u);
    const m2 = status === 303 ? "GET" : method, b2 = m2 === "GET" || m2 === "HEAD" ? undefined : body;
    if (needsSocket(next)) return socketFetch(next, m2, headers, b2, manual, hops + 1);
    const r = await fetch(next.toString(), { method: m2, headers, body: b2 });
    return { status: r.status, statusText: r.statusText, headers: r.headers, body: r.body, url: r.url };
  }

  const chunked = /chunked/i.test(rh.get("transfer-encoding") || "");
  let remaining = method === "HEAD" || status === 204 || status === 304 ? 0 : (rh.has("content-length") ? Number(rh.get("content-length")) : -1);
  ["transfer-encoding", "connection", "keep-alive"].forEach(h =&gt; rh.delete(h));
  let chunkLeft = 0, needCRLF = false;
  const stop = ctrl =&gt; { ctrl.close(); reader.cancel().catch(() =&gt; {}); };
  const stream = new ReadableStream({
    async pull(ctrl) {
      for (;;) {
        if (!chunked) {
          if (pending.length) {
            const out = remaining &gt;= 0 ? pending.subarray(0, remaining) : pending;
            pending = new Uint8Array(0);
            if (remaining &gt;= 0) remaining -= out.length;
            if (out.length) ctrl.enqueue(out);
            if (remaining === 0) stop(ctrl);
            return;
          }
          if (remaining === 0) { stop(ctrl); return; }
          if (!(await readMore())) { ctrl.close(); return; }
          continue;
        }
        // Transfer-Encoding: chunked
        if (chunkLeft &gt; 0) {
          if (!pending.length &amp;&amp; !(await readMore())) { ctrl.close(); return; }
          const out = pending.subarray(0, chunkLeft);
          pending = pending.subarray(out.length);
          chunkLeft -= out.length;
          if (!chunkLeft) needCRLF = true;
          ctrl.enqueue(out);
          return;
        }
        if (needCRLF) {
          if (pending.length &lt; 2) { if (!(await readMore())) { ctrl.close(); return; } continue; }
          pending = pending.subarray(2); needCRLF = false; continue;
        }
        const i = indexOfSeq(pending, CRLF);
        if (i &lt; 0) { if (!(await readMore())) { ctrl.close(); return; } continue; }
        const size = parseInt(new TextDecoder().decode(pending.subarray(0, i)).split(";")[0].trim(), 16);
        pending = pending.subarray(i + 2);
        if (!size) { stop(ctrl); return; }
        chunkLeft = size;
      }
    },
    cancel() { reader.cancel().catch(() =&gt; {}); }
  });
  return { status, statusText: m[2] || "", headers: rh, body: stream, url: u.toString() };
}

function cors(headers) {
  headers.set("Access-Control-Allow-Origin", "*");
  headers.set("Access-Control-Allow-Methods", "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS");
  headers.set("Access-Control-Allow-Headers", "*");
  headers.set("Access-Control-Expose-Headers", "*");
  headers.set("Access-Control-Max-Age", "86400");
  return headers;
}

export default {
  async fetch(request) {
    if (request.method === "OPTIONS") return new Response(null, { status: 204, headers: cors(new Headers()) });

    const self = new URL(request.url);
    if (ACCESS_KEY &amp;&amp; self.searchParams.get("key") !== ACCESS_KEY) {
      return new Response("clave incorrecta", { status: 403, headers: cors(new Headers()) });
    }
    const target = self.searchParams.get("url");
    if (!target) {
      return new Response("Proxy de Kino VIDAA funcionando ✓  (uso: /?url=https://...)", {
        status: 200, headers: cors(new Headers({ "content-type": "text/plain; charset=utf-8" })) });
    }
    let dest;
    try { dest = new URL(target); } catch (_) { return new Response("url inválida", { status: 400, headers: cors(new Headers()) }); }
    if (!/^https?:$/.test(dest.protocol)) return new Response("solo http/https", { status: 400, headers: cors(new Headers()) });

    const headers = new Headers();
    for (const [k, v] of request.headers) if (!DROP.includes(k.toLowerCase())) headers.set(k, v);
    headers.set("User-Agent", BROWSER_UA);
    const ref = self.searchParams.get("ref");
    if (ref) {
      headers.set("Referer", ref);
      try { headers.set("Origin", new URL(ref).origin); } catch (_) {}
    }
    const extra = self.searchParams.get("hdr");
    if (extra) {
      try { for (const [k, v] of Object.entries(JSON.parse(extra))) headers.set(k, String(v)); } catch (_) {}
    }

    // El cuerpo se lee entero: si el destino redirige (p. ej. rd.php), se puede
    // volver a enviar. Con el flujo original, la redirección fallaba (HTTP 502).
    const hasBody = !["GET", "HEAD"].includes(request.method);
    const body = hasBody ? await request.arrayBuffer() : undefined;
    headers.delete("content-length");

    let upstream;
    try {
      // &amp;redir=manual: devolver el 3xx con su Location (kino.fetch redirect "manual")
      const redirect = self.searchParams.get("redir") === "manual" ? "manual" : "follow";
      upstream = needsSocket(dest)
        ? await socketFetch(dest, request.method, headers, body, redirect === "manual")
        : await fetch(dest.toString(), { method: request.method, headers, body, redirect });
    } catch (err) {
      return new Response("el destino no respondió: " + err, { status: 502, headers: cors(new Headers()) });
    }

    const out = new Headers(upstream.headers);
    ["content-security-policy", "content-security-policy-report-only", "x-frame-options",
     "cross-origin-resource-policy", "cross-origin-embedder-policy", "cross-origin-opener-policy",
     "set-cookie"].forEach(h =&gt; out.delete(h));
    out.set("X-Final-Url", upstream.url);
    return new Response(upstream.body, { status: upstream.status, statusText: upstream.statusText, headers: cors(out) });
  },
};

    function renderStreamOptions(streams, title, opts = {}) {
      const streamsList = document.getElementById("directStreamsList");

      if (!streams.length) {
        streamsList.innerHTML = opts.pending
          ? "<div style='color:var(--muted); font-size:14px;'>⏳ Buscando enlaces directos en tus plugins...</div>"
          : "<div style='color:var(--muted); font-size:14px;'>No se devolvieron enlaces directos para esta opción. Prueba con '🔎 Buscar Streams en Plugins'.</div>";
        return;
      }
      const head = document.createElement("h3");
      head.style.cssText = "font-size:16px; margin-bottom:4px;";
      head.textContent = `⚡ Enlaces directos — control total con el mando${opts.pending ? " (buscando más...)" : ""}`;
      streamsList.appendChild(head);
      streams.forEach((s, i) => {
        const row = document.createElement("div");
        row.className = "stream-item focusable";
        row.tabIndex = 0;

        // Servidor alterno diferido (contrato Kino `alternatives`): se resuelve al elegirlo
        if (s.lazyRef) {
          row.innerHTML = `
            <div>
              <strong>🎞️ ${s.label || ("Servidor " + (i + 1))}</strong>
              <div style="font-size:12px; color:var(--muted);">Toca para abrir este servidor</div>
            </div>
            <div class="btn-group">
              <button class="action-btn small focusable" data-open-lazy="${i}">▶ Abrir</button>
            </div>
          `;
          const openLazy = e => {
            if (e) e.stopPropagation();
            resolvePluginRef(s.lazyPluginId, s.lazyRef, title);
          };
          row.querySelector("[data-open-lazy]").addEventListener("click", openLazy);
          row.addEventListener("click", openLazy);
          streamsList.appendChild(row);
          return;
        }

        row.innerHTML = `
          <div>
            <strong>🎬 ${s.label || ("Servidor " + (i + 1))}</strong>
            <div style="font-size:12px; color:var(--muted); max-width:650px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.url}</div>
          </div>
          <div class="btn-group">
            <button class="action-btn small focusable" data-play-web="${i}">▶ Web</button>
            <button class="action-btn secondary small focusable" data-play-proxy="${i}">🔁 vía Proxy</button>
            <button class="action-btn secondary small focusable" data-play-native="${i}">🟡 Nativo VIDAA</button>
          </div>
        `;
        row.querySelector("[data-play-web]").addEventListener("click", e => {
          e.stopPropagation();
          startPlayback(s.url, `${title} (${s.label || 'Stream'})`, { mime: s.mime, referer: refOf(s), subtitles: s.subtitles });
        });
        row.querySelector("[data-play-proxy]").addEventListener("click", e => {
          e.stopPropagation();
          startPlayback(s.url, `${title} (${s.label || 'Stream'})`, { viaProxy: true, mime: s.mime, referer: refOf(s), subtitles: s.subtitles });
        });
        row.querySelector("[data-play-native]").addEventListener("click", e => {
          e.stopPropagation();
          handoffToVidaaNativePlayer(s.url, title);

        row.addEventListener("click", () => startPlayback(s.url, `${title} (${s.label || 'Stream'})`, { mime: s.mime, referer: refOf(s), subtitles: s.subtitles }));
        streamsList.appendChild(row);
      });
    }

    async function resolvePluginRef(pluginId, ref, title) {
      markUserPlayIntent(); // solo se llama al pulsar un episodio, un servidor alterno o Reproducir
      const inst = state.installed.find(x => x.id === pluginId);
      if (!inst) return [];
      setStatus(`Resolviendo enlaces desde ${inst.name}...`);
      try {
        // resolve() puede tardar ~60 s probando servidores (límite propio del plugin)
        const res = await withTimeout(callPluginFn(inst, "resolve", ref), 65000, inst.name);
        if (!res) return [];
        const list = [];
        if (res.url) list.push({ url: res.url, label: `${inst.name} · ${res.label || 'Principal'}`, mime: res.mime, headers: res.headers, subtitles: res.subtitles });
        if (Array.isArray(res.copies)) {
          res.copies.forEach(c => {
            if (c && c.url) list.push({ url: c.url, label: `${inst.name} · ${c.label || 'Servidor'}`, mime: c.mime, headers: c.headers, subtitles: c.subtitles || res.subtitles });
          });
        }
        // Contrato Kino: `alternatives` son refs diferidas (c:...@n) que se resuelven al elegirlas
        if (Array.isArray(res.alternatives)) {
          res.alternatives.forEach(a => {
            if (a && a.ref) list.push({ lazyRef: a.ref, lazyPluginId: pluginId, label: `${inst.name} · ${a.label || 'Servidor alterno'}` });
          });
        }
        setStatus(list.length ? `${list.length} opciones de servidor` : "Sin enlaces directos");
        // Para que ⏮/⏭ recorran estas opciones del plugin
        state.directStreams = list.concat((state.directStreams || []).filter(d => !list.some(x => x.url && x.url === d.url)));
        renderStreamOptions(list, title);
        return list;
      } catch (e) {
        setStatus(`Error al resolver en ${inst.name}: ${e.userMessage || e.message || e}`);
        const streamsList = document.getElementById("directStreamsList");
        if (streamsList && document.getElementById("detailOverlay").classList.contains("open")) {
          const hint = e.code === "unavailable"
            ? "<br><br>El sitio está protegido (Cloudflare) o los proxies no responden: revisa Ajustes ▸ 📡 Probar Conexión."
            : "";
          streamsList.innerHTML = `<div style='color:var(--muted); font-size:14px;'>${e.userMessage || e.message || "No se pudo resolver."}${hint}</div>`;
        }
        return [];
      }
    }

        // Episodios solo para series/anime (como Kino): a una película el plugin

        const isMovie = /^(movie|pelicula|película|film|video)$/i.test(String(item.kind || ""));
        if (!isMovie) try {
          const epRes = await withTimeout(callPluginFn(inst, "episodes", item.ref), 30000, inst.name);
          const eps = Array.isArray(epRes) ? epRes : (epRes && Array.isArray(epRes.episodes) ? epRes.episodes : []);
          // El contrato Kino devuelve la ficha de la serie junto a los episodios
          if (epRes && epRes.series) {
            if (epRes.series.overview) document.getElementById("detailDesc").textContent = epRes.series.overview;
            if (epRes.series.poster) document.getElementById("detailPoster").src = epRes.series.poster;
            if (epRes.series.year) document.getElementById("detailMeta").textContent = `${epRes.series.year} · Fuente: ${inst.name}`;
          }
          if (eps.length) {
            const epSec = document.getElementById("episodesSection");
            epSec.innerHTML = `<h3 style="font-size:17px; margin-bottom:8px;">Capítulos / Archivos (${eps.length})</h3><div class="episodes-grid" id="epGrid"></div>`;
            const epGrid = document.getElementById("epGrid");
            eps.slice(0, 120).forEach(ep => {
              const b = document.createElement("button");
              b.className = "ep-btn focusable";
              const epLabel = (ep.season ? `T${ep.season}:` : "") + `E${ep.number || ep.episode || 1} - ${ep.title || ep.name || "Capítulo"}`;
              b.textContent = epLabel;
              b.addEventListener("click", () => {
                state.selectedSeason = Number(ep.season) || 1; // para buscar los subtítulos del episodio
                state.selectedEpisode = Number(ep.number || ep.episode) || 1;
                resolvePluginRef(inst.id, ep.ref || ep.id, `${item.title} ${epLabel}`);
              });
              epGrid.appendChild(b);
            });
          }
        } catch (e) {
          // p. ej. series sin episodios: el plugin manda userMessage en español
          if (e && e.userMessage) {
            document.getElementById("episodesSection").innerHTML = `<div style="color:var(--muted); font-size:14px; margin-top:8px;">${e.userMessage}</div>`;
          }
        }
      }

      // 2. Si viene de un addon Stremio, pedir /meta/{type}/{id}.json
      if (item.stremioBase && item.rawId) {
        try {
          const metaUrl = `${item.stremioBase}/meta/${encodeURIComponent(item.stremioType)}/${encodeURIComponent(item.rawId)}.json`;
          const r = await smartFetch(metaUrl);
          if (r.ok) {
            const m = JSON.parse(r.text).meta;
            if (m) {
              if (m.description) document.getElementById("detailDesc").textContent = m.description;
              if (Array.isArray(m.videos) && m.videos.length > 1) {
                const epSec = document.getElementById("episodesSection");
                epSec.innerHTML = `<h3 style="font-size:17px; margin-bottom:8px;">Episodios (${m.videos.length})</h3><div class="episodes-grid" id="epGrid"></div>`;
                const epGrid = document.getElementById("epGrid");
                m.videos.slice(0, 100).forEach(v => {
                  const b = document.createElement("button");
                  b.className = "ep-btn focusable";
                  const label = `T${v.season || 1}:E${v.episode || v.number || 1} · ${v.name || v.title || "Episodio"}`;
                  b.textContent = label;
                  b.addEventListener("click", () => searchStreamsAcrossPlugins(item.title, v.season, v.episode));
                  epGrid.appendChild(b);
                });
              }
            }
          }
        } catch (_) {}
      }
    }

    // Busca enlaces DIRECTOS (mp4/m3u8) del título en todos los plugins a la vez.
    // Con un enlace directo el video va en el reproductor propio de la app y se
    // controla con el mando (pausa, ⏩, ⏪); los servidores embed no.
    let directRun = 0;
    function findDirectStreams(item, opts = {}) {
      const run = ++directRun;
      const title = item.title;
      if (opts.autoplay) markUserPlayIntent(); // pedido explícito (botones "Buscar otra vez" / "Buscar directo")
      // Conservar lo ya extraído de los servidores embed de esta misma ficha
      state.directStreams = state.selectedItem === item ? (state.directStreams || []).filter(d => d.extracted) : [];
      const failures = [];
      const plugins = state.installed.filter(i => i.address && i.enabled !== false);
      const box = document.getElementById("directStreamsList");
      const stillHere = () => run === directRun && state.selectedItem === item;
      if (!plugins.length) {
        if (box) box.innerHTML = "";
        return Promise.resolve([]);
      }
      if (box) box.innerHTML = "<div style='color:var(--muted); font-size:14px;'>⏳ Buscando enlaces directos en tus plugins...</div>";
      setStatus(`Buscando enlaces directos para "${title}"...`);
      let autoplayed = false;
      const publish = () => {
        if (!stillHere()) return;
        renderStreamOptions(state.directStreams, title, { pending: true });
        if (opts.autoplay && !autoplayed && !playerUI.isOpen()) {
          const first = state.directStreams.find(x => x.url);
          if (first) { autoplayed = true; startPlayback(first.url, `${title} (${first.label})`, { mime: first.mime, referer: refOf(first), subtitles: first.subtitles }); }
        }
      };
      const kindType = opts.season ? "series" : (item.kind === "series" ? "series" : "movie");
      const promise = runPool(plugins, 3, async inst => {
        if (!stillHere()) return;
        try {
          let sRes = null;
          try {
            sRes = await withTimeout(callPluginFn(inst, "search", { q: title, query: title, type: kindType, originalTitle: title, altTitles: [] }), 20000, inst.name);
          } catch (_) {
            sRes = await withTimeout(callPluginFn(inst, "search", title), 15000, inst.name);
          }
          let items = Array.isArray(sRes) ? sRes : (sRes && Array.isArray(sRes.items) ? sRes.items : []);
          if (!items.length) { failures.push(`${inst.name}: sin coincidencias`); return; }
          items = kinoRank.sortBySimilarity(items, title, it => it && (it.title || it.name));
          let lastErr = null;
          for (const match of items.slice(0, userIsPlaying() ? 2 : 1)) {
            if (!stillHere()) return;
            const targetRef = match.ref || match.id;
            if (!targetRef) continue;
            try {
              const resolved = await withTimeout(callPluginFn(inst, "resolve", targetRef), 40000, inst.name);
              const before = state.directStreams.length;
              if (resolved && resolved.url) state.directStreams.push({ url: resolved.url, label: `${inst.name} · ${resolved.label || match.title || "Principal"}`, mime: resolved.mime, headers: resolved.headers, subtitles: resolved.subtitles });
              if (resolved && Array.isArray(resolved.copies)) resolved.copies.forEach(c => { if (c && c.url) state.directStreams.push({ url: c.url, label: `${inst.name} · ${c.label || "Opción"}`, mime: c.mime, headers: c.headers }); });
              if (resolved && Array.isArray(resolved.alternatives)) resolved.alternatives.forEach(a => { if (a && a.ref) state.directStreams.push({ lazyRef: a.ref, lazyPluginId: inst.id, label: `${inst.name} · ${a.label || "Servidor alterno"}` }); });
              if (state.directStreams.length > before) { publish(); return; }
            } catch (e) { lastErr = e; }
          }
          failures.push(`${inst.name}: ${(lastErr && (lastErr.userMessage || lastErr.message)) || "sin enlaces"}`);
        } catch (e) {
          failures.push(`${inst.name}: ${(e && (e.userMessage || e.message)) || "error"}`);
        }
      }).then(() => {
        if (!stillHere()) return state.directStreams;
        renderStreamOptions(state.directStreams, title, { pending: false });
        if (!state.directStreams.length && box) {
          box.innerHTML = `<div style='color:var(--muted); font-size:14px; line-height:1.8;'>⚡ Ningún plugin dio enlace directo${failures.length ? ":<br>" + failures.map(f => `• ${f}`).join("<br>") : "."}</div>`;
        }
        setStatus(state.directStreams.length ? `${state.directStreams.length} enlaces directos encontrados` : "Sin enlaces directos: usa los servidores web de abajo");
        if (opts.autoplay && !autoplayed && !state.directStreams.length && state.activeSources.length && !playerUI.isOpen()) {
          showNoControllableVideo(item); // no abrir una página embed que el mando no puede manejar
        }
        return state.directStreams;
      });
      state.directSearch = { run, item, promise };
      return promise;
    }

    // Compatibilidad: botón "Buscar Streams en Plugins" y episodios de addons
    function searchStreamsAcrossPlugins(title, season, episode) {
      const item = state.selectedItem && state.selectedItem.title === title ? state.selectedItem : { title };
      return findDirectStreams(item, { season, episode });
    }

    // URL de reproducción a través del proxy CORS (para CDNs que no envían

    function findMediaUrls(text, baseUrl) {

    }

    function findChildFrames(text, baseUrl) {

      let m;
      while ((m = re.exec(text)) !== null) {

        if (u.startsWith("//")) u = "https:" + u;
        try { u = new URL(u, baseUrl).href; } catch (_) { continue; }
        if (!out.includes(u)) out.push(u);
      }
      return out;
    }

    // =========================================================================
    // CAPTURA EN CAJA DE ARENA

    // su API o lo descifran con JavaScript al pulsar ▶. Aquí se descarga su
    // página, se ejecuta dentro de un iframe AISLADO (sandbox sin acceso a la
    // app, sin ventanas emergentes y sin poder sacar a la app de su página) y,
    // antes de que corra su código, se le inyectan "espías" en fetch, XHR,
    // <video>, hls.js y jwplayer. Cuando su reproductor obtiene el .m3u8/.mp4,
    // se captura y se reproduce en el reproductor propio (controlable).
