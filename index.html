    // Cicla por los servidores de la ficha (embed o directos) sin salir del player
    // ⏮ Anterior / Siguiente ⏭: recorre los enlaces directos (si se ve uno) o los servidores web
    // Resuelve una alternativa "diferida" del plugin (ref sin URL todavía)
    async function resolveLazyStream(entry) {
      const inst = state.installed.find(x => x.id === entry.lazyPluginId);
      if (!inst) return false;
      markUserPlayIntent();
      try {
        const res = await withTimeout(callPluginFn(inst, "resolve", entry.lazyRef), 40000, inst.name);
        if (!res || !res.url) return false;
        Object.assign(entry, { url: res.url, mime: res.mime, headers: res.headers, subtitles: res.subtitles });
        return true;
      } catch (_) { return false; }
    }
    // ⏮ Anterior / Siguiente ⏭: recorre los enlaces directos (incluidas las
    // alternativas por resolver del plugin) o, en una página embed, los servidores web
    async function cycleServer(delta, auto) {
      if (!auto) state.autoHops = 0;
      const list = (state.directStreams || []).filter(x => x.url || x.lazyRef);
      if (!playerUI.isEmbed() && list.length > 1) {
        let cur = list.findIndex(x => x.url && x.url === state.activeVideoUrl);
        if (cur < 0) cur = 0;
        for (let hop = 1; hop < list.length; hop++) {
          const nxt = list[((cur + delta * hop) % list.length + list.length) % list.length];
          if (auto && nxt.failed) continue;
          playerUI.osd(`${delta > 0 ? "⏭" : "⏮"} ${nxt.label}${nxt.url ? "" : " (resolviendo…)"}`);
          if (!nxt.url && !(await resolveLazyStream(nxt))) { nxt.failed = true; diagLog("player", `✗ la alternativa «${nxt.label}» no dio enlace`); continue; }
          if (!playerUI.isOpen()) return;
          startPlayback(nxt.url, `${state.selectedItem ? state.selectedItem.title : "Kino TV"} (${nxt.label})`, { mime: nxt.mime, referer: refOf(nxt), subtitles: nxt.subtitles });
          return;
        }
        playerUI.osd("No hay más servidores que probar");
        return;
      }
      if (!state.activeSources.length) { setStatus("No hay más servidores en la lista"); playerUI.osd("No hay más servidores"); return; }
      state.currentSourceIndex = (state.currentSourceIndex + delta + state.activeSources.length) % state.activeSources.length;
      const src = state.activeSources[state.currentSourceIndex];
      setStatus(`Probando ${src.name}…`);
      playerUI.osd(`${delta > 0 ? "⏭" : "⏮"} ${src.name} (${state.currentSourceIndex + 1}/${state.activeSources.length})`);
      startPlaybackSource(src, state.selectedItem ? state.selectedItem.title : "Kino TV");
    }
    document.getElementById("playerNextServerBtn").addEventListener("click", () => cycleServer(1));
    document.getElementById("playerPrevServerBtn").addEventListener("click", () => cycleServer(-1));
    document.getElementById("playerPointerBtn").addEventListener("click", () => {
      const src = state.activeSources[state.currentSourceIndex] || (state.activeVideoUrl ? { url: state.activeVideoUrl, name: "Servidor" } : null);
      Pointer.open(src, state.selectedItem ? state.selectedItem.title : "");
    });

    document.getElementById("exitAppBtn").addEventListener("click", () => {
      if (typeof window.Hisense_Exit === "function") window.Hisense_Exit();
      else window.close();
    });

    document.querySelectorAll(".nav-btn[data-view]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.view = btn.dataset.view;
        renderView();
      });
    });

    // Navegación espacial con el control remoto de VIDAA OS (Flechas + OK + Back + Amarillo)
    // ---------------------------------------------------------------------
    // Campos de texto en el TV: con solo enfocarlos, VIDAA abre el teclado en
    // pantalla y el control queda atrapado (así no se podía bajar a los canales
    // en En Vivo). Ahora están bloqueados ("solo lectura") hasta pulsar OK:
    // las flechas los atraviesan como a cualquier botón.
    //   OK = escribir · OK otra vez o Back = terminar · ▲▼ = salir del campo
    // ---------------------------------------------------------------------
    function isTextField(el) {
      return !!(el && el.matches && el.matches("input.tv-input, textarea.tv-input"));
    }
    function isEditingField(el) { return isTextField(el) && !!el.dataset.editing; }
    function lockField(el) {
      if (!isTextField(el)) return;
      delete el.dataset.editing;
      el.readOnly = true;
    }
    function unlockField(el) {
      if (!isTextField(el)) return;
      el.readOnly = false;
      el.dataset.editing = "1";
      el.dataset.typed = "";
      el.setAttribute("inputmode", "text");
    }
    // Ventana de escritura nativa del TV (window.prompt): funciona aunque el
    // teclado en pantalla no se abra sobre el campo
    function promptForField(el) {
      const label = el.getAttribute("placeholder") || "Escribe el texto";
      let v = null;
      try { v = window.prompt(label, el.value || ""); } catch (_) { v = null; }
      lockField(el);
      if (v === null || v === undefined) return false;
      el.value = String(v).trim();
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
      setStatus("✓ Texto escrito. Pulsa 💾 Guardar si hace falta", { priority: true });
      return true;
    }
    document.addEventListener("input", e => { if (isEditingField(e.target)) e.target.dataset.typed = "1"; }, true);
    document.querySelectorAll(".tv-input").forEach(lockField);
    new MutationObserver(muts => {
      muts.forEach(m => m.addedNodes.forEach(n => {
        if (n.nodeType !== 1) return;
        if (isTextField(n) && !n.dataset.editing) lockField(n);
        n.querySelectorAll && n.querySelectorAll(".tv-input").forEach(el => { if (!el.dataset.editing) lockField(el); });
      }));
    }).observe(document.body, { childList: true, subtree: true });
    document.addEventListener("focusout", e => { if (isEditingField(e.target)) lockField(e.target); });
    // Fase de captura: corre antes que los manejadores propios de cada campo
    window.addEventListener("keydown", e => {
      const el = document.activeElement;
      if (!isTextField(el)) return;
      const isEnter = e.key === "Enter" || e.keyCode === 13;
      const isBack = e.key === "Escape" || e.keyCode === 461 || e.key === "GoBack";
      if (!isEditingField(el)) {
        if (isEnter) {
          e.preventDefault();
          e.stopImmediatePropagation();
          el.blur();
          unlockField(el);
          el.focus();
          // Muchos TV solo abren su teclado con un "clic" sobre el campo
          try { el.click(); } catch (_) {}
          try { const n = el.value.length; el.setSelectionRange(n, n); } catch (_) {}
          setStatus("✏️ Escribe y pulsa OK para terminar · ¿No sale el teclado? Pulsa OK otra vez", { priority: true });
        }
        return; // flechas y Back siguen al manejador general
      }
      if (isBack) { e.preventDefault(); e.stopImmediatePropagation(); lockField(el); return; }
      // 2.º OK sin haber escrito nada: el teclado no apareció → ventana nativa
      if (isEnter && !el.dataset.typed) {
        e.preventDefault();
        e.stopImmediatePropagation();
        promptForField(el);
        return;
      }
      if (isEnter) { setTimeout(() => lockField(el), 0); return; } // el campo procesa su Enter (buscar, instalar...)
      if (e.key === "ArrowUp" || e.key === "ArrowDown") { lockField(el); return; } // y se navega
      e.stopImmediatePropagation(); // letras, ◀ ▶, borrar: son del campo
    }, true);

    window.addEventListener("keydown", e => {
      if (e.key === "Escape" || e.key === "Backspace" || e.keyCode === 461 || e.keyCode === 8) {
        if (isEditingField(document.activeElement)) return;
        if (document.getElementById("playerOverlay").classList.contains("open")) {
          e.preventDefault();
          if (Subs.isOpen()) { Subs.closePanel(); return; } // Back cierra primero el panel de subtítulos
          if (Pointer.active) { Pointer.close(); return; }  // y luego el modo puntero
          document.getElementById("closePlayerBtn").click();
          return;
        }
        if (document.getElementById("configOverlay").classList.contains("open")) {
          e.preventDefault();
          document.getElementById("closeConfigBtn").click();
          return;
        }
        if (document.getElementById("detailOverlay").classList.contains("open")) {
          e.preventDefault();
          document.getElementById("closeDetailBtn").click();
          return;
        }
      }
      if (e.keyCode === 405 && state.activeVideoUrl) {
        handoffToVidaaNativePlayer(state.activeVideoUrl, "Kino TV");
        return;
      }
      if (handlePlayerKey(e)) return;
      // OK del control remoto: los navegadores solo "clican" con Enter en
      // <button>/<a>. Las tarjetas y filas de servidores son <div>, así que
      // hay que disparar el clic a mano o nunca se abre la ficha/el video.
      if (e.key === "Enter" || e.keyCode === 13) {
        const el = document.activeElement;
        if (el && el.classList && el.classList.contains("focusable") &&
            !/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) {
          e.preventDefault();
          el.click();
          return;
        }
      }
      const dir = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
      if (dir) {
        const activeTag = document.activeElement && document.activeElement.tagName;
        if (isEditingField(document.activeElement) && (dir === "left" || dir === "right")) return;
        if (moveFocus(dir)) e.preventDefault();
      }
    });

    // ---------------------------------------------------------------------
    // Navegación espacial
    // ---------------------------------------------------------------------
    function focusScope() {
      const subs = document.getElementById("subsPanel");
      if (subs && subs.classList.contains("open")) return subs; // solo las opciones de subtítulos
      return ["playerOverlay", "configOverlay", "detailOverlay"]
        .map(id => document.getElementById(id))
        .find(o => o.classList.contains("open")) || document;
    }
    function visibleFocusables(scope) {
      return Array.from(scope.querySelectorAll(".focusable")).filter(el => {
        if (el.offsetParent === null || el.disabled) return false;
        const r = el.getBoundingClientRect();
        return r.width > 0 && r.height > 0;
      });
    }
    function focusAndReveal(el) {
      if (!el) return false;
      try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); }
      el.scrollIntoView({ block: "nearest", inline: "nearest" });
      return true;
    }
    // Última posición enfocada: si un re-render borra el elemento con foco, la
    // siguiente flecha sigue desde ahí (antes saltaba al primer botón: "Inicio").
    let lastFocusRect = null;
    const zoneMemory = { sidebar: null, main: null };
    document.addEventListener("focusin", e => {
      const el = e.target;
      if (!el || !el.classList || !el.classList.contains("focusable")) return;
      lastFocusRect = el.getBoundingClientRect();
      if (el.closest(".sidebar")) zoneMemory.sidebar = el;
      else if (el.closest("#mainView")) { zoneMemory.main = el; zoneMemory.mainView = state.view; }
    });
    function nearestTo(rect, list) {
      let best = null, bestD = Infinity;
      list.forEach(el => {
        const r = el.getBoundingClientRect();
        const d = Math.hypot((r.left + r.width / 2) - (rect.left + rect.width / 2), (r.top + r.height / 2) - (rect.top + rect.height / 2));
        if (d < bestD) { bestD = d; best = el; }
      });
      return best;
    }
    function moveFocus(dir) {
      const scope = focusScope();
      const all = visibleFocusables(scope);
      if (!all.length) return false;
      const current = document.activeElement;
      if (!current || !all.includes(current)) {
        return focusAndReveal((lastFocusRect && nearestTo(lastFocusRect, all)) || all[0]);
      }
      const vertical = dir === "up" || dir === "down";
      const inSidebar = el => !!el.closest(".sidebar");
      // ▶ desde el menú lateral: SIEMPRE entra al contenido (donde se estaba o
      // al primer elemento). Antes, si nada quedaba a la misma altura del botón
      // del menú, no pasaba nada y no se podía llegar a los cuadros de Ajustes.
      if (scope === document && dir === "right" && inSidebar(current)) {
        const mainList = visibleFocusables(document.getElementById("mainView"));
        const target = (zoneMemory.main && zoneMemory.mainView === state.view && mainList.includes(zoneMemory.main))
          ? zoneMemory.main : mainList[0];
        return target ? focusAndReveal(target) : false;
      }
      const r0 = current.getBoundingClientRect();
      const cx0 = r0.left + r0.width / 2, cy0 = r0.top + r0.height / 2;
      // En vertical se salta de fila en fila: los botones anidados dentro de una
      // fila enfocable (servidores) solo se recorren con ◀ ▶. Antes cada fila
      // eran 4 paradas y había que pasar botón por botón.
      const candidates = all.filter(c => c !== current &&
        // ▲▼ no cruzan entre el menú lateral y el contenido
        !(vertical && scope === document && inSidebar(c) !== inSidebar(current)) &&
        !(vertical && c.parentElement && c.parentElement.closest(".focusable") && !c.parentElement.closest(".focusable").contains(current)) &&
        !(vertical && c.contains(current)));
      let best = null, bestScore = Infinity;
      candidates.forEach(c => {
        const r = c.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        let primary, orthGap, orthCenter;
        if (dir === "down") { if (cy - cy0 <= 4) return; primary = r.top - r0.bottom; }
        if (dir === "up") { if (cy0 - cy <= 4) return; primary = r0.top - r.bottom; }
        if (dir === "right") { if (cx - cx0 <= 4) return; primary = r.left - r0.right; }
        if (dir === "left") { if (cx0 - cx <= 4) return; primary = r0.left - r.right; }
        if (vertical) {
          orthGap = Math.max(0, r.left - r0.right, r0.left - r.right);
          // Desde algo ancho (campo de texto, fila) se baja al elemento de la izquierda
          const refX = r0.width > r.width * 1.5 ? r0.left + r.width / 2 : cx0;
          // Distancia al TRAMO del candidato (0 si queda justo debajo/encima):
          // así un cuadro ancho no pierde contra un botón pequeño más lejano
          orthCenter = Math.max(0, r.left - refX, refX - r.right) + Math.abs(cx - refX) * 0.02;
        } else {
          orthGap = Math.max(0, r.top - r0.bottom, r0.top - r.bottom);
          orthCenter = Math.max(0, r.top - cy0, cy0 - r.bottom) + Math.abs(cy - cy0) * 0.02;
        }
        // En horizontal solo se vale la misma fila (o casi): al final de una
        // fila, ▶ ya no salta a un botón de otra fila.
        if (!vertical && orthGap > 0) return;
        // Lo que está alineado (en la misma fila/columna) gana a lo que está en diagonal
        const score = Math.max(0, primary) + orthGap * 3 + orthCenter * 0.3;
        if (score < bestScore) { bestScore = score; best = c; }
      });
      // ◀ desde el contenido sin nada a la izquierda en esa fila: al menú lateral
      if (!best && scope === document && dir === "left" && !current.closest(".sidebar")) {
        best = document.querySelector(".nav-btn.active") || document.querySelector(".sidebar .focusable");
      }
      if (!best) return false;
      // Entre menú lateral y contenido: volver a donde se estaba
      if (scope === document) {
        const fromSidebar = !!current.closest(".sidebar");
        const toSidebar = !!best.closest(".sidebar");
        if (fromSidebar && !toSidebar && dir === "right") {
          // Volver a donde se estaba en esta pantalla; si no, al primer elemento
          if (zoneMemory.main && zoneMemory.mainView === state.view && all.includes(zoneMemory.main)) best = zoneMemory.main;
          else best = visibleFocusables(document.getElementById("mainView"))[0] || best;
        }
        else if (!fromSidebar && toSidebar && dir === "left") best = document.querySelector(".nav-btn.active") || best;
      }
      return focusAndReveal(best);
    }

    // Inicialización
    // Una sola vez: borrar las respuestas de TMDB que los plugins guardaron
    // vacías mientras la app no tenía llave (si no, seguirían sin contenido)
    try {
      if (!localStorage.getItem("kino_tmdb_cache_purged_v1")) {
        const del = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("kino_pstore_") && /tmdb/i.test(k)) del.push(k);
        }
        del.forEach(k => localStorage.removeItem(k));
        localStorage.setItem("kino_tmdb_cache_purged_v1", "1");
      }
    } catch (_) {}
    // También se puede configurar el proxy abriendo la app con ?proxy=dirección
    try {
      const qp = new URLSearchParams(location.search).get("proxy");
      if (qp) {
        state.customProxy = normalizeProxyInput(qp);
        saveStore("kino_custom_proxy", state.customProxy);
      }
    } catch (_) {}
    // Comprobar que el proxy propio responde (aviso claro en Diagnóstico)
    if (state.customProxy) {
      fetchWithTimeout(state.customProxy.replace(/[?&]url=$/, ""), {}, 8000)
        .then(r => r.text().then(t => {
          const ok = /Kino VIDAA funcionando/.test(t);
          const where = state.customProxy.replace(/^https?:\/\//, "").split(/[/?]/)[0]; // sin la clave
          diagLog("red", ok ? `✓ Proxy propio responde (${where})`
            : r.status === 403 ? `⚠️ Tu proxy pide clave y la que pusiste no coincide (${where})`
            : `⚠️ El proxy propio respondió algo inesperado (HTTP ${r.status}): ¿pegaste el código de cloudflare-worker.js y pulsaste Deploy?`);
          if (!ok) setStatus("⚠️ Tu proxy propio no tiene el código de Kino: revisa el worker en Cloudflare", { priority: true });
        }))
        .catch(() => diagLog("red", `✗ El proxy propio no responde: ${state.customProxy}`));
    }
    state.homeRows = loadHomeCache().filter(r => r.sourceId === "cinemeta-home" ? cinemetaActive() : isInstalled(r.sourceId));
    renderView();
    document.getElementById("navHome").focus();
    refreshHomeCatalog();
  </script>
</body>
</html>
