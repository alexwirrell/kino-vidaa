          var els = document.querySelectorAll(".jw-icon-display,.jw-display-icon-container,.vjs-big-play-button,.plyr__control--overlaid,.play-button,.playbtn,.btn-play,#play,#playbtn,[class*='play-btn'],[class*='playButton'],[id*='play']");
          for (var i = 0; i < Math.min(els.length, 4); i++) { try { els[i].click(); } catch (e) {} }
          var c = document.elementFromPoint(innerWidth / 2, innerHeight / 2);
          if (c && c.tagName !== "IFRAME") c.click();
          var vids = document.querySelectorAll("video");
          for (var j = 0; j < vids.length; j++) {
            vids[j].muted = true;
            var p = vids[j].play();
            if (p && p.catch) p.catch(function () {});
            if (vids[j].currentSrc) media(vids[j].currentSrc, "video");
          }
        } catch (e) {}
      }, 1200);
      // ---------- Modo puntero (la persona mueve un cursor con el control) ----------
      // Marcos internos: se piden a la app y se cargan aquí con el mismo código
      // espía (dirección "f1/f2"); los mensajes de los hijos se reenvían hacia arriba.
      var MYPATH = cfg.path || "", kids = {}, kidSeq = 0;
      function requestFrame(el, u) {
        if (!cfg.pointer || el.getAttribute("data-kfid")) return;
        var id = "f" + (++kidSeq);
        el.setAttribute("data-kfid", id);
        kids[id] = el;
        try { el.removeAttribute("src"); el.removeAttribute("data-src"); } catch (e) {}
        post({ frameReq: abs(u), path: MYPATH ? MYPATH + "/" + id : id });
      }
      function synthClick(el, x, y) {
        var o = { bubbles: true, cancelable: true, composed: true, clientX: x, clientY: y, view: window, button: 0, buttons: 1, pointerType: "mouse", isPrimary: true };
        ["pointerover", "pointerenter", "mouseover", "pointermove", "mousemove", "pointerdown", "mousedown"].forEach(function (t) {
          try { el.dispatchEvent(/^pointer/.test(t) && window.PointerEvent ? new PointerEvent(t, o) : new MouseEvent(t, o)); } catch (e) {}
        });
        try { if (el.focus) el.focus(); } catch (e) {}
        o.buttons = 0;
        ["pointerup", "mouseup", "click"].forEach(function (t) {
          try { el.dispatchEvent(/^pointer/.test(t) && window.PointerEvent ? new PointerEvent(t, o) : new MouseEvent(t, o)); } catch (e) {}
        });
        if (el.tagName === "VIDEO") { try { var pp = el.paused ? el.play() : el.pause(); if (pp && pp.catch) pp.catch(function () {}); } catch (e) {} }
      }
      if (cfg.pointer) window.addEventListener("message", function (ev) {
        var d = ev.data;
        if (!d) return;
        // del hijo hacia la app: reenviar
        if (d.__kinoCapture === TOKEN && ev.source !== parent) { try { parent.postMessage(d, "*"); } catch (e) {} return; }
        if (d.__kinoPointer !== TOKEN) return;
        if (d.type === "frameHtml") {
          var rel = MYPATH ? d.target.slice(MYPATH.length + 1) : d.target;
          var segs = rel.split("/"), kid = kids[segs[0]];
          if (!kid) return;
          if (segs.length === 1) { try { kid.srcdoc = d.html; } catch (e) {} }
          else { try { kid.contentWindow.postMessage(d, "*"); } catch (e) {} }
          return;
        }
        if (d.type === "click" || d.type === "move") {
          var el = document.elementFromPoint(d.x, d.y);
          if (el && el.tagName === "IFRAME" && el.getAttribute("data-kfid")) {
            var r = el.getBoundingClientRect();
            try { el.contentWindow.postMessage({ __kinoPointer: TOKEN, type: d.type, x: d.x - r.left, y: d.y - r.top }, "*"); } catch (e) {}
            return;
          }
          if (el && d.type === "click") synthClick(el, d.x, d.y);
          else if (el) { try { el.dispatchEvent(new MouseEvent("mousemove", { bubbles: true, clientX: d.x, clientY: d.y })); } catch (e) {} }
          return;
        }
        if (d.type === "scroll") { try { window.scrollBy(0, d.dy); } catch (e) {} }
      });
      post({ ready: 1 });
    }

    // Máximo 2 cajas de arena a la vez (el TV tiene poca memoria)
    const sandboxWaiting = [];
    let sandboxRunning = 0;
    function withSandboxSlot(task, priority) {
      return new Promise(resolve => {
        const run = () => {
          sandboxRunning++;
          Promise.resolve().then(task).then(resolve, () => resolve({ found: [], frames: [] })).finally(() => {
            sandboxRunning--;
            const nxt = sandboxWaiting.shift();
            if (nxt) nxt();
          });
        };
        // Los iframes internos de un servidor van primero: suelen ser el reproductor real
        if (sandboxRunning < 2) run(); else if (priority) sandboxWaiting.unshift(run); else sandboxWaiting.push(run);
      });
    }

    function sandboxRunOnce(url, deadline, shouldStop, priority, opts = {}) {
      return withSandboxSlot(async () => {
        const short = url.replace(/^https?:\/\//, "").slice(0, 60);
        if (Date.now() > deadline - 2500 || (shouldStop && shouldStop())) return { found: [], frames: [] };
        let r = opts.prefetched || null;
        if (!r || !r.ok || !r.text) {
          try { r = await smartFetch(url, { timeoutMs: Math.min(12000, deadline - Date.now()), headers: opts.headers ? Object.assign({}, opts.headers) : undefined }); } catch (_) { r = null; }
        }
        if (!r || !r.ok || !r.text || looksBlocked(r)) {
          diagLog("captura", `✗ no se pudo descargar ${short}${r ? " (HTTP " + r.status + ")" : ""}`);
          return { found: [], frames: [] };
        }
        const token = "k" + Math.random().toString(36).slice(2);
        const proxy = state.customProxy || state.lastGoodProxy || "https://api.codetabs.com/v1/proxy?quest=";
        const cfg = JSON.stringify({ token, proxy, page: url, custom: !!state.customProxy && proxy === state.customProxy, noClick: !!opts.noClick, wantHtml: !!opts.wantHtml }).replace(/</g, "\\u003c");
        const inject = `<base href="${url.replace(/"/g, "&quot;")}"><script>(${kinoCaptureHook.toString()})(${cfg});<\/script>`;
        let html = r.text.replace(/<meta[^>]+http-equiv\s*=\s*["']?content-security-policy[^>]*>/gi, "");
        // Los iframes internos no se cargan aquí: se informan y la app los abre en su propia caja
        html = html.replace(/<iframe\b([^>]*?)\ssrc\s*=/gi, "<iframe$1 data-src=");
        html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + inject) : inject + html;
        diagLog("captura", `▶ ejecutando ${short} en caja de arena`);
        return await new Promise(resolve => {
          const found = [];
          const frames = [];
          const f = document.createElement("iframe");
          // Sin allow-same-origin: origen aislado, no ve los datos de la app.
          // Sin allow-top-navigation ni allow-popups: no puede sacar a la app ni abrir ventanas.
          f.setAttribute("sandbox", "allow-scripts allow-forms");
          f.setAttribute("allow", "autoplay");
          f.setAttribute("tabindex", "-1");
          f.setAttribute("aria-hidden", "true");
          f.style.cssText = "position:fixed; left:-12000px; top:0; width:1280px; height:720px; opacity:0; pointer-events:none; border:0;";
          let settle = null;
          let finished = false;
          let lastHtml = "";
          const finish = () => {
            if (finished) return;
            finished = true;
            clearTimeout(settle);
            clearTimeout(hard);
            window.removeEventListener("message", onMsg);
            try { f.srcdoc = ""; f.remove(); } catch (_) {}
            resolve({ found, frames, html: lastHtml });
          };
          const onMsg = ev => {
            const d = ev.data;
            if (!d || d.__kinoCapture !== token || ev.source !== f.contentWindow) return;
            if (d.media && !found.some(x => x.url === d.media)) {
              found.push({ url: d.media, mime: /\.mp4(\?|#|$)/i.test(d.media) ? "video/mp4" : "application/vnd.apple.mpegurl", referer: url });
              diagLog("captura", `✓ video capturado (${d.why}) en ${short}: ${d.media.slice(0, 80)}`);
              // Esperar un instante por si llega la lista "master" (mejor calidad)
              if (!settle) settle = setTimeout(finish, 1500);
            }
            if (d.frame && !frames.includes(d.frame)) frames.push(d.frame);
            if (d.html && opts.wantHtml && (!opts.waitFor || opts.waitFor.test(d.html))) { lastHtml = d.html; finish(); }
          };
          window.addEventListener("message", onMsg);
          const hard = setTimeout(finish, Math.max(3000, Math.min(12000, deadline - Date.now())));
          f.srcdoc = html;
          document.body.appendChild(f);
        });
      }, priority);
    }

    // Captura en caja de arena, siguiendo hasta 2 niveles de iframes internos
    async function sandboxCapture(url, depth = 0, deadline = Date.now() + 30000, shouldStop = null, opts = {}) {
      const { found, frames } = await sandboxRunOnce(url, deadline, shouldStop, depth > 0, depth === 0 ? opts : {});
      if (found.length) {
        // .m3u8 primero, y la lista "master" antes que las de una sola calidad
        return found.sort((a, b) => (/\.m3u8/i.test(b.url) - /\.m3u8/i.test(a.url)) || (/master/i.test(b.url) - /master/i.test(a.url)));
      }
      if (depth >= 2 || !frames.length || Date.now() > deadline - 3000) return [];
      for (const fr of frames.slice(0, 3)) {
        if (shouldStop && shouldStop()) return [];
        const got = await sandboxCapture(fr, depth + 1, deadline, shouldStop, { headers: { Referer: url } });
        if (got.length) return got;
      }
      return [];
    }

    // Primero lo rápido (leer el HTML); si no hay enlace y se pide `deep`,
    // ejecutar la página en la caja de arena.
    async function extractFromEmbed(url, opts = {}) {
      const quick = await extractStatic(url);
      if (quick.length || !opts.deep) return quick;
      if (opts.shouldStop && opts.shouldStop()) return [];
      return sandboxCapture(url, 0, Date.now() + 30000, opts.shouldStop || null);
    }

    async function extractStatic(url, depth = 0, deadline = Date.now() + 20000, headers = null) {
      if (Date.now() > deadline) return [];
      let r;
      try { r = await smartFetch(url, { timeoutMs: Math.min(12000, Math.max(2000, deadline - Date.now())), headers: headers ? Object.assign({}, headers) : undefined }); } catch (_) { return []; }
      if (!r || !r.ok || !r.text || looksBlocked(r)) return [];
      let text = r.text;
      // Desempaquetar cada bloque eval(function(p,a,c,k,e,d){...})
      const packedRe = /eval\(function\(p,a,c,k,e,[dr]\)[\s\S]+?\.split\('\|'\)[^)]*\)\)/g;
      let pm;
      while ((pm = packedRe.exec(r.text)) !== null) {
        const un = unpackPacker(pm[0]);
        if (un) text += "\n" + un;
      }
      const media = findMediaUrls(text, url);
      if (media.length) {
        diagLog("extractor", `✓ ${media.length} video(s) en ${url.slice(0, 70)}`);
        return media.map(x => Object.assign(x, { referer: url }));
      }
      if (depth >= 2) return [];
      const frames = findChildFrames(r.text, url).slice(0, 6);
      const results = await Promise.all(frames.map(f => extractStatic(f, depth + 1, deadline)));
      return [].concat(...results);
    }

    // Prueba todos los servidores embed del título a la vez y agrega lo que
    // encuentre a los enlaces directos de la ficha.
    let extractRun = 0;
    function extractAllEmbeds(item, opts = {}) {
      const run = ++extractRun;
      const embeds = state.activeSources.filter(x => x.type === "embed");
      if (!embeds.length) return Promise.resolve([]);
      const found = [];
      let tried = 0;
      return Promise.all(embeds.map(async src => {
        // En modo profundo se para en cuanto un servidor dé video
        if (opts.deep && found.length) return;
        const media = await extractFromEmbed(src.url, { deep: !!opts.deep, shouldStop: () => run !== extractRun || (opts.deep && found.length > 0) });
        tried++;
        if (opts.deep && run === extractRun && !found.length) setStatus(`⏳ Capturando el video de los servidores web (${tried}/${embeds.length})...`, { priority: true });
        if (run !== extractRun || state.selectedItem !== item) return;
        media.slice(0, 2).forEach(mv => {
          if ((state.directStreams || []).some(d => d.url === mv.url)) return;
          const entry = { url: mv.url, label: `${src.name} · extraído`, mime: mv.mime, extracted: true, referer: mv.referer };
          found.push(entry);
          state.directStreams.push(entry);
        });
        if (found.length && document.getElementById("detailOverlay").classList.contains("open")) {
          renderStreamOptions(state.directStreams, item.title, { pending: true });
        }
      })).then(() => found);
    }

    // Reproduce una "fuente" de la ficha (embed en iframe o URL directa en <video>)
    function startPlaybackSource(src, title) {
      if (!src) { setStatus("No hay un servidor seleccionado para reproducir"); return; }
      if (src.type === "embed") startEmbedPlayback(src, title);
      else startPlayback(src.url, title, { mime: src.mime });
    }

    // Servidor web embed: va en <iframe>, que no necesita CORS. La página del
    // servidor trae su propio reproductor (y su publicidad).
    // Pide a los servidores embed que arranquen solos (sin pulsar su ▶)
    function withAutoplay(url) {
      if (/[?&]autoplay=/i.test(url)) return url;
      return url + (url.includes("?") ? "&" : "?") + "autoplay=1&autoPlay=true";
    }

    function startEmbedPlayback(src, title) {
      playbackRun++; // cancela los intentos pendientes de un video anterior
      Subs.run++; Subs.clear(); // una página embed no admite subtítulos propios
      Pointer.close(true);
      state.activeVideoUrl = src.url;
      document.getElementById("nowPlayingTitle").textContent = `${title || "Reproduciendo"} — ${src.name}`;
      document.getElementById("nowPlayingSub").textContent = "Servidor web: su botón ▶ solo se pulsa con puntero. Si no arranca solo: ⚡ Buscar directo o 🌐 Navegador TV · ▼: ocultar barra · Back: Salir";
      playerUI.setMode("embed");
      document.getElementById("playerOverlay").classList.add("open");
      const video = document.getElementById("videoPlayer");
      const iframe = document.getElementById("webPlayerFrame");
      if (state.hlsInstance) { state.hlsInstance.destroy(); state.hlsInstance = null; }
      video.onerror = null;
      video.pause();
      video.removeAttribute("src");
      video.style.display = "none";
      iframe.style.display = "block";
      playerUI.embedActive = true;
      // Sin parámetros añadidos: la URL tal cual (algunos servidores tomaban los
      // parámetros extra como señal de bot y pedían captcha)
      iframe.src = src.url;
      playerUI.show(true);
      // Mientras tanto, intentar sacar el video de esa página: si sale, se pasa
      // solo al reproductor propio (con Pausa/Play/⏩/⏪ desde el mando)
      const url = src.url;
      playerUI.osd("⏳ Buscando el video para controlarlo con el mando...");
      // Solo lectura del HTML (una petición por el proxy): la ejecución en caja de
      // arena ya no es automática, porque repetida parecía un bot y provocaba captchas
      extractFromEmbed(url, { deep: false }).then(media => {
        if (!playerUI.isOpen() || !playerUI.isEmbed() || state.activeVideoUrl !== url) return;
        if (!media.length) {
          playerUI.osd("Este servidor necesita puntero: pulsa 🖱 Puntero (o ⏭ Siguiente)");
          return;
        }
        playerUI.osd("⚡ Video encontrado: ya se controla con el mando");
        startPlayback(media[0].url, `${title || "Reproduciendo"} — ${src.name}`, { mime: media[0].mime, referer: refOf(media[0]), subtitles: media[0].subtitles });
      });
    }

    // Algunos TV bloquean el arranque automático con sonido: entonces se avisa y
    // el foco queda en ▶ Play, para que un OK lo inicie.
    function tryAutoplay(video) {
      const p = video.play();
      if (p && typeof p.catch === "function") {
        p.catch(err => {
          // AbortError: se cambió de video · NotSupportedError/error: el enlace falló (lo avisa retryViaProxy)
          if (!playerUI.isOpen() || video.error || (err && (err.name === "AbortError" || err.name === "NotSupportedError"))) return;
          diagLog("player", `El TV no dejó arrancar solo (${err && err.name}): esperando OK`);
          playerUI.updatePlayLabel();
          playerUI.show(true);
          playerUI.osd("▶ Pulsa OK para reproducir");
        });
      }
    }

    // hls.js con TODAS sus peticiones (lista, sub-listas y trozos .ts) por el
    // proxy. Antes solo la lista pasaba por el proxy y los trozos seguían
    // pidiéndose directo, así que los canales sin CORS o en http:// fallaban.
    function makeProxyLoader(referer) {
      const Base = Hls.DefaultConfig.loader;
      return class ProxyLoader extends Base {
        load(context, config, callbacks) {
          const original = context.url;
          context.url = proxiedPlaybackUrl(original, referer);
          const onSuccess = callbacks.onSuccess;
          const cb = Object.assign({}, callbacks, {
            onSuccess: (response, stats, ctx, details) => {
              // Las rutas relativas de la lista se resuelven contra la URL ORIGINAL
              if (response) response.url = original;
              if (ctx) ctx.url = original;
              onSuccess(response, stats, ctx, details);
            }
          });
          super.load(context, config, cb);
        }
      };
    }

    // Referer que pide el servidor del video (de la captura o de las cabeceras del plugin)
    // Cabeceras que exige el servidor del video: las que dio el plugin
    // (Referer, User-Agent, Cookie...) y el Referer de la página capturada.
    // Antes solo se reenviaba el Referer y servidores como vidplayz rechazaban el video.
    function refOf(x) {
      if (!x) return "";
      const h = Object.assign({}, (x.headers && typeof x.headers === "object") ? x.headers : {});
      if (x.referer && !h.Referer && !h.referer) h.Referer = x.referer;
      return Object.keys(h).length ? h : "";
    }

    let playbackRun = 0;
    function startPlayback(url, title, opts = {}) {
      if (!url) { setStatus("No hay URL de stream disponible"); return; }
      const run = ++playbackRun;
      Pointer.close(true);
      state.activeVideoUrl = url; // URL original (para el pase a nativo y "Siguiente")
      document.getElementById("nowPlayingTitle").textContent = title || "Reproduciendo";
      document.getElementById("nowPlayingSub").textContent = "OK: Pausa/Play · ◀ ▶: 10 s · ▼: ocultar barra · Back: Salir";
      playerUI.setMode("video");
      document.getElementById("playerOverlay").classList.add("open");
      const video = document.getElementById("videoPlayer");
      const iframe = document.getElementById("webPlayerFrame");
      playerUI.embedActive = false;
      iframe.src = "about:blank";
      iframe.style.display = "none";
      video.style.display = "";

      // Cadena de intentos, del más rápido al más compatible:
      //  hls      → hls.js directo (necesita CORS del servidor)
      //  native   → reproductor del propio TV (no necesita CORS)
      //  hlsproxy → hls.js con TODO pasando por el proxy (CORS + http:// en página https://)
      //  proxy    → archivo completo por el proxy
      const isHls = /\.m3u8(\?|#|$)/i.test(url) || /mpegurl/i.test(opts.mime || "");
      const hlsOk = !!(window.Hls && Hls.isSupported());
      const mixed = location.protocol === "https:" && /^http:\/\//i.test(url); // el TV lo bloquearía
      const nativeHls = !!video.canPlayType && /maybe|probably/.test(video.canPlayType("application/vnd.apple.mpegurl"));
      let stages = [];
      if (isHls) {
        if (!mixed && hlsOk) stages.push("hls");
        if (!mixed && nativeHls) stages.push("native");
        stages.push(hlsOk ? "hlsproxy" : "proxy");
        if (!hlsOk && !nativeHls && !mixed) stages.unshift("native"); // último recurso
      } else {
        if (!mixed) stages.push("native");
        stages.push("proxy");
      }
      // http:// en página https://: algunos navegadores de TV sí dejan reproducir
      // video http en el reproductor nativo (contenido "pasivo"). Último intento.
      if (mixed) stages.push("native");
      if (opts.viaProxy) stages = stages.filter(st => st === "hlsproxy" || st === "proxy");
      // Video que exige Referer (capturado de un servidor web) y hay proxy
      // propio: ir directo por el proxy, que sí puede enviarlo
      if (opts.referer && state.customProxy) stages.sort((a, b) => (/proxy/.test(b) ? 1 : 0) - (/proxy/.test(a) ? 1 : 0));
      stages = stages.filter((st, i) => stages.indexOf(st) === i);
      if (mixed) diagLog("player", "Enlace http:// en página https://: se usa el proxy directamente");
      diagLog("player", `▶ ${String(url).replace(/^https?:\/\//, "").slice(0, 70)} · cabeceras del servidor: ${!opts.referer ? "ninguna" : typeof opts.referer === "string" ? "Referer" : Object.keys(opts.referer).join(", ")}${state.customProxy ? "" : " · sin proxy propio"}`);

      let stageIdx = -1;
      let watchdog = null;
      const cleanup = () => {
        clearTimeout(watchdog);
        video.onerror = null;
        video.onloadeddata = null;
        if (state.hlsInstance) { try { state.hlsInstance.destroy(); } catch (_) {} state.hlsInstance = null; }
      };
      const fail = (why) => {
        if (run !== playbackRun) return;
        const st = stages[stageIdx];
        diagLog("player", `✗ ${st}: ${why} · ${String(url).slice(0, 80)}`);
        // Por el proxy: preguntar qué respondió (p. ej. Cloudflare no conecta a ese puerto o IP)
        if (/proxy/.test(st)) {
          fetchWithTimeout(proxiedPlaybackUrl(url, opts.referer), {}, 8000)
            .then(r => r.text().then(t => diagLog("player", `   ↳ el proxy respondió HTTP ${r.status}: ${String(t).replace(/\s+/g, " ").slice(0, 140)}`)))
            .catch(() => diagLog("player", "   ↳ el proxy no respondió"));
        }
        nextStage();
      };
      const nextStage = () => {
        if (run !== playbackRun) return;
        cleanup();
        stageIdx++;
        if (stageIdx >= stages.length) {
          // Si este enlace es parte de una lista (alternativas del plugin), probar
          // solo la siguiente que no haya fallado (hasta 4 saltos seguidos)
          const listed = (state.directStreams || []).find(x => x.url === url);
          if (listed) listed.failed = true;
          const pending = (state.directStreams || []).filter(x => (x.url || x.lazyRef) && !x.failed);
          if (listed && pending.length && (state.autoHops || 0) < 4) {
            state.autoHops = (state.autoHops || 0) + 1;
            playerUI.osd(`✗ Este servidor no respondió · probando otro (${state.autoHops}/4)…`);
            diagLog("player", `↪ probando la siguiente alternativa automáticamente (${pending.length} pendientes)`);
            setTimeout(() => { if (run === playbackRun) cycleServer(1, true); }, 900);
            return;
          }
          try { video.pause(); } catch (_) {} // p. ej. no dejar sonando un video de relleno
          setStatus("No se pudo reproducir este enlace — prueba ⏭ Siguiente o 🟡 Nativo VIDAA", { priority: true });
          document.getElementById("nowPlayingSub").textContent = "✗ Este enlace no se pudo reproducir en el TV · ⏭ Siguiente para probar otro · detalles en 🩺 Diagnóstico";
          playerUI.osd("✗ No se pudo reproducir este enlace");
          playerUI.show(false);
          playerUI.el("playerNextServerBtn").focus();
          return;
        }
        const stage = stages[stageIdx];
        if (stageIdx > 0) playerUI.osd(stage === "native" ? "🔁 Probando el reproductor del TV..." : "🔁 Probando vía proxy...");
        diagLog("player", `▶ intento ${stageIdx + 1}/${stages.length}: ${stage}`);
        try { video.pause(); video.removeAttribute("src"); video.load(); } catch (_) {}
        // Si en 25 s no llega imagen, pasar al siguiente intento
        watchdog = setTimeout(() => { if (video.readyState < 2) fail("sin imagen en 25 s"); }, 25000);
        video.onloadeddata = () => {
          clearTimeout(watchdog);
          diagLog("player", `✓ reproduciendo (${stage})`);
          // Video "de relleno": algunos sitios entregan un clip corto (p. ej. el león
          // de la MGM, «m3tr0g0ldw1n.mp4», 13 s) en vez de la película cuando no los
          // visita un navegador normal. Una película o episodio no dura < 60 s.
          const d = video.duration;
          const it = state.selectedItem;
          if (!opts.live && it && !/live|music|trailer|clip/i.test(String(it.kind || "")) && isFinite(d) && d > 0 && d < 60) {
            diagLog("player", `⚠️ el servidor dio un video de ${Math.round(d)} s (relleno, no la película): se prueba otra copia`);
            playerUI.osd(`⚠️ Video de ${Math.round(d)} s: no es la película · probando otra copia…`);
            stageIdx = stages.length - 1; // no repetir este enlace por otras vías
            nextStage();
          }
        };
        video.onerror = () => fail(`error de video${video.error ? " código " + video.error.code : ""}`);
        if (stage === "hls" || stage === "hlsproxy") {
          const cfg = { manifestLoadingTimeOut: 20000, fragLoadingTimeOut: 20000, levelLoadingTimeOut: 20000 };
          if (stage === "hlsproxy") cfg.loader = makeProxyLoader(opts.referer);
          const hls = new Hls(cfg);
          state.hlsInstance = hls;
          hls.on(Hls.Events.MANIFEST_PARSED, () => tryAutoplay(video));
          hls.on(Hls.Events.ERROR, (_, data) => {
            if (data && data.fatal) fail(`hls.js ${data.type || ""} ${data.details || ""}`.trim());
          });
          hls.loadSource(url);
          hls.attachMedia(video);
        } else {
          video.src = stage === "proxy" ? proxiedPlaybackUrl(url, opts.referer) : url;
          tryAutoplay(video);
        }
      };
      nextStage();
      // Subtítulos: los del propio video y los de las fuentes de subtítulos
      if (opts.live) diagLog("subtítulos", "canal en vivo: no se buscan subtítulos (solo películas y series)");
      Subs.start(opts.subtitles || [], opts.live ? null : state.selectedItem);
      // Foco en Pausa/Play (antes en Cerrar: un OK de más cerraba el video)
      playerUI.show(true);
    }

    // =========================================================================
    // CONTROLES DEL REPRODUCTOR CON EL CONTROL REMOTO
    // La barra se oculta a los 5 s; con la barra oculta: OK = Pausa/Play,
    // ◀ ▶ = retroceder/adelantar 10 s, cualquier otra tecla muestra la barra.
    // Las teclas multimedia del control (Play, Pausa, ⏩, ⏪, Stop) funcionan siempre.
    // =========================================================================
    const playerUI = {
      hideTimer: null,
      osdTimer: null,
      embedActive: false,
      el: id => document.getElementById(id),
      overlay() { return this.el("playerOverlay"); },
      video() { return this.el("videoPlayer"); },
      isOpen() { return this.overlay().classList.contains("open"); },
      isHidden() { return this.overlay().classList.contains("hud-hidden"); },
      isEmbed() { return this.overlay().classList.contains("mode-embed"); },
      setMode(mode) {
        this.overlay().classList.toggle("mode-embed", mode === "embed");
        this.overlay().classList.toggle("mode-video", mode !== "embed");
        this.updatePlayLabel();
        this.updateProgress();
      },
      defaultButton() { return this.el(this.isEmbed() ? "playerNextServerBtn" : "playerPlayPauseBtn"); },
      show(focusDefault) {
        this.overlay().classList.remove("hud-hidden");
        const hud = this.el("playerHud");
        if (focusDefault || !hud.contains(document.activeElement)) this.defaultButton().focus();
        this.updateProgress();
        this.scheduleHide();
      },
      hide(force) {
        clearTimeout(this.hideTimer);
        if (!this.isOpen()) return;
        if (document.getElementById("subsPanel").classList.contains("open")) return; // eligiendo subtítulos
        // Con el video en pausa la barra se queda visible (salvo que se pida con ▼)
        if (!force && !this.isEmbed() && this.video().paused && this.video().currentSrc) return;
        this.overlay().classList.add("hud-hidden");
      },
      scheduleHide() {
        clearTimeout(this.hideTimer);
        this.hideTimer = setTimeout(() => this.hide(), 5000);
      },
      reset() {
        clearTimeout(this.hideTimer);
        this.overlay().classList.remove("hud-hidden");
        this.el("playerOsd").classList.remove("show");
      },
      osd(msg) {
        const o = this.el("playerOsd");
        o.textContent = msg;
        o.classList.add("show");
        clearTimeout(this.osdTimer);
        this.osdTimer = setTimeout(() => o.classList.remove("show"), 1400);
      },
      togglePlay(forcePlay) {
        if (this.isEmbed()) { this.osd("Servidor web: usa ⚡ Buscar directo para controlar el video"); return; }
        const v = this.video();
        if (forcePlay === true || (forcePlay !== false && v.paused)) {
          v.play().catch(() => {});
          this.osd("▶ Play");
        } else {
          v.pause();
          this.osd("⏸ Pausa");
        }
      },
      seek(delta) {
        if (this.isEmbed()) return;
        const v = this.video();
        if (!isFinite(v.duration) || !v.duration) { this.osd("📡 En vivo"); return; }
        v.currentTime = Math.max(0, Math.min(v.duration - 1, v.currentTime + delta));
        this.osd(`${delta > 0 ? "⏩ +" : "⏪ "}${delta} s · ${fmtTime(v.currentTime)}`);
        this.updateProgress();
      },
      updatePlayLabel() {
        const v = this.video();
        this.el("playerPlayPauseBtn").textContent = v.paused ? "▶ Play" : "⏸ Pausa";
      },
      updateProgress() {
        const v = this.video();
        const live = !isFinite(v.duration) || !v.duration;
        this.el("hudBarFill").style.width = live ? "100%" : `${(v.currentTime / v.duration) * 100}%`;
        this.el("hudTime").textContent = live ? `📡 En vivo · ${fmtTime(v.currentTime)}` : `${fmtTime(v.currentTime)} / ${fmtTime(v.duration)}`;
      }
    };
    function fmtTime(t) {
      t = Math.max(0, Math.floor(Number(t) || 0));
      const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
      return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
    }
    (() => {
      const v = playerUI.video();
      v.addEventListener("play", () => { playerUI.updatePlayLabel(); playerUI.scheduleHide(); });
      v.addEventListener("pause", () => { playerUI.updatePlayLabel(); if (playerUI.isOpen() && v.currentSrc) playerUI.show(false); });
      v.addEventListener("timeupdate", () => { if (!playerUI.isHidden()) playerUI.updateProgress(); });
      v.addEventListener("loadedmetadata", () => playerUI.updateProgress());
      playerUI.el("playerPlayPauseBtn").addEventListener("click", () => { playerUI.togglePlay(); playerUI.scheduleHide(); });
      playerUI.el("playerRewBtn").addEventListener("click", () => { playerUI.seek(-10); playerUI.scheduleHide(); });
      playerUI.el("playerFwdBtn").addEventListener("click", () => { playerUI.seek(10); playerUI.scheduleHide(); });
      // Servidores embed: la página del servidor (iframe) NUNCA debe quedarse
      // con el foco. Si lo toma (p. ej. con autofocus), el control remoto deja
      // de llegar a la app: las flechas solo desplazaban esa página y Back no
      // servía para salir. Se recupera el foco en cuanto se pierde.
      const reclaimFocus = () => {
        if (!playerUI.isOpen()) return;
        const f = playerUI.el("webPlayerFrame");
        if (document.activeElement === f) {
          try { window.focus(); } catch (_) {}
          playerUI.show(true);
        }
      };
      window.addEventListener("blur", () => setTimeout(reclaimFocus, 0));
      setInterval(reclaimFocus, 1000);
      playerUI.el("playerBrowserBtn").addEventListener("click", () => {
        if (!state.activeVideoUrl) return;
        window.open(state.activeVideoUrl, "_blank");
        setStatus("Abierto en el navegador del TV (allí sí hay puntero para pulsar ▶)", { priority: true });
      });
      playerUI.el("playerDirectBtn").addEventListener("click", () => {
        document.getElementById("closePlayerBtn").click();
        if (state.selectedItem) {
          const it = state.selectedItem;
          findDirectStreams(it, { season: state.selectedSeason, episode: state.selectedEpisode, autoplay: true });
        }
      });
      playerUI.overlay().addEventListener("mousemove", () => { if (playerUI.isOpen()) playerUI.show(false); });
    })();

    // Teclas del reproductor. Devuelve true si la tecla ya se atendió.
    function handlePlayerKey(e) {
      if (!playerUI.isOpen()) return false;
      if (Pointer.key(e)) return true; // modo puntero: flechas mueven el cursor, OK hace clic
      const k = e.key, c = e.keyCode;
      const media =
        (k === "MediaPlayPause" || c === 10252 || c === 179) ? "toggle" :
        (k === "MediaPlay" || c === 415) ? "play" :
        (k === "MediaPause" || c === 19) ? "pause" :
        (k === "MediaFastForward" || c === 417) ? "ff" :
        (k === "MediaRewind" || c === 412) ? "rw" :
        (k === "MediaStop" || c === 413) ? "stop" : null;
      if (c === 460 || k === "Subtitle") { // tecla de subtítulos del control
        e.preventDefault();
        if (!playerUI.isEmbed()) { playerUI.show(false); Subs.isOpen() ? Subs.closePanel() : Subs.openPanel(); }
        return true;
      }
      if (media) {
        e.preventDefault();
        if (media === "toggle") playerUI.togglePlay();
        else if (media === "play") playerUI.togglePlay(true);
        else if (media === "pause") playerUI.togglePlay(false);
        else if (media === "ff") playerUI.seek(30);
        else if (media === "rw") playerUI.seek(-30);
        else if (media === "stop") document.getElementById("closePlayerBtn").click();
        return true;
      }
      if (playerUI.isHidden()) {
        e.preventDefault();
        if ((k === "Enter" || c === 13) && !playerUI.isEmbed()) { playerUI.togglePlay(); return true; }
        if (k === "ArrowLeft" && !playerUI.isEmbed()) { playerUI.seek(-10); return true; }
        if (k === "ArrowRight" && !playerUI.isEmbed()) { playerUI.seek(10); return true; }
        if (k === "ArrowDown") return true; // ya está oculta
        playerUI.show(true); // cualquier otra tecla: mostrar la barra
        return true;
      }
      // Con el panel de subtítulos abierto, las flechas recorren sus opciones
      if (Subs.isOpen()) { clearTimeout(playerUI.hideTimer); return false; }
      // Barra de progreso seleccionada: ◀ ▶ se mueven por el video (acelera al mantener), OK pausa
      if (document.activeElement && document.activeElement.id === "hudSeek") {
        if (k === "ArrowLeft" || k === "ArrowRight") {
          e.preventDefault();
          const now = Date.now();
          playerUI.seekStreak = (k === playerUI.seekKey && now - (playerUI.seekAt || 0) < 400) ? (playerUI.seekStreak || 0) + 1 : 0;
          playerUI.seekKey = k; playerUI.seekAt = now;
          const step = playerUI.seekStreak > 12 ? 120 : playerUI.seekStreak > 5 ? 60 : playerUI.seekStreak > 2 ? 30 : 10;
          playerUI.seek(k === "ArrowLeft" ? -step : step);
          playerUI.scheduleHide();
          return true;
        }
        if (k === "Enter" || c === 13) { e.preventDefault(); playerUI.togglePlay(); playerUI.scheduleHide(); return true; }
        if (k === "ArrowDown") { e.preventDefault(); playerUI.defaultButton().focus(); playerUI.scheduleHide(); return true; }
      }
      // ▲ desde los botones: a la barra de progreso (está a la izquierda, a la misma altura)
      const vdur = playerUI.video().duration;
      if (k === "ArrowUp" && !playerUI.isEmbed() && isFinite(vdur) && vdur > 0 && document.activeElement && document.activeElement.closest && document.activeElement.closest(".player-hud .btn-group")) {
        e.preventDefault();
        document.getElementById("hudSeek").focus();
        playerUI.scheduleHide();
        return true;
      }
      // ▼ con la barra visible: ocultarla (antes no había forma de quitarla)
      if (k === "ArrowDown") {
        e.preventDefault();
        playerUI.hide(true);
        playerUI.osd("▲ o OK: mostrar la barra");
        return true;
      }
      playerUI.scheduleHide(); // actividad con la barra visible: reiniciar el temporizador
      return false;
    }

    // =========================================================================
    // SUBTÍTULOS
    // Fuentes (como Kino): 1) los que trae el propio video (stream.subtitles),
    // 2) plugins con subtitles(query), 3) addons de Stremio de subtítulos
    // instalados y 4) OpenSubtitles v3 si no hay ninguno instalado.
    // El archivo se descarga por el proxy (sin CORS), se detecta su codificación
    // (UTF-8 o Windows-1252, típica de los .srt en español), se convierte SRT→VTT
    // y se monta como <track> del reproductor propio.
    // =========================================================================
    const SUB_LANGS = {
      spa: "es", es: "es", "es-419": "es", "es-mx": "es", "es-es": "es", lat: "es", eng: "en", en: "en",
      por: "pt", pob: "pt", pt: "pt", "pt-br": "pt", fre: "fr", fra: "fr", fr: "fr", ita: "it", it: "it",
      ger: "de", deu: "de", de: "de", jpn: "ja", ja: "ja", kor: "ko", ko: "ko", chi: "zh", zho: "zh", zh: "zh",
      rus: "ru", ru: "ru", ara: "ar", ar: "ar", cat: "ca", ca: "ca"
    };
    const SUB_NAMES = { es: "Español", en: "Inglés", pt: "Portugués", fr: "Francés", it: "Italiano", de: "Alemán", ja: "Japonés", ko: "Coreano", zh: "Chino", ru: "Ruso", ar: "Árabe", ca: "Catalán" };
    const normLang = l => {
      const k = String(l || "").toLowerCase().trim();
      return SUB_LANGS[k] || SUB_LANGS[k.split(/[-_]/)[0]] || k.slice(0, 2) || "??";
    };
    const OPENSUBS_V3 = "https://opensubtitles-v3.strem.io/manifest.json";

    const Subs = {
      prefs: Object.assign({ lang: "es", size: "normal" }, loadStore("kino_sub_prefs", {})),
      tracks: [],      // [{ id, lang, label, source, url, format }]
      searching: false,
      current: null,   // id del track mostrado
      run: 0,
      blobUrls: [],
      savePrefs() { saveStore("kino_sub_prefs", this.prefs); },

      // Qué título se reproduce (ids de IMDb/TMDB, temporada y episodio)
      async contextFor(item) {
        if (!item) return null;
        const kind = /series|anime|tv/i.test(String(item.kind || "")) ? "series" : "movie";
        const ids = Object.assign({}, item.ids || {});
        let imdb = item.imdbId || ids.imdb || (item.rawId && /^tt\d+/.test(item.rawId) ? item.rawId.split(":")[0] : "") || "";
        let tmdb = ids.tmdb ? Number(ids.tmdb) : 0;
        if (!tmdb && item.ref && /^(?:m|s|tv|movie):?(\d+)$/.test(String(item.ref))) tmdb = Number(String(item.ref).replace(/\D/g, ""));
        if (!imdb && (tmdb || item.title) && state.tmdbKey) {
          try {
            const meta = await kinoMeta(tmdb ? { type: kind, ids: { tmdb } } : { type: kind, title: item.title, year: item.year ? String(item.year).slice(0, 4) : undefined });
            if (meta && meta.ids) { imdb = meta.ids.imdb || imdb; tmdb = meta.ids.tmdb || tmdb; }
          } catch (_) {}
        }
        // Sin llave de TMDB: buscar el título en Cinemeta (sin llave) para obtener el id de IMDb
        if (!imdb && item.title) {
          try {
            const year = item.year ? String(item.year).slice(0, 4) : "";
            const clean = String(item.title).replace(/\s*\((19|20)\d{2}\)\s*$/, "").trim();
            const list = await fetchCinemetaCatalog(kind === "series" ? "series" : "movie", clean);
            const norm = t => foldAccents(String(t || "").toLowerCase()).replace(/[^a-z0-9]+/g, " ").trim();
            const same = list.filter(m => norm(m.title) === norm(clean));
            const pick = (year && same.find(m => String(m.year).slice(0, 4) === year)) || (same.length === 1 ? same[0] : null) || (!same.length && list.length === 1 ? list[0] : null);
            if (pick && pick.imdbId) { imdb = pick.imdbId; diagLog("subtítulos", `id de IMDb por Cinemeta: ${clean} → ${imdb}`); }
          } catch (_) {}
        }
        return {
          kind, imdbId: imdb || undefined, tmdbId: tmdb || undefined, title: item.title,
          year: item.year ? Number(String(item.year).slice(0, 4)) || undefined : undefined,
          season: kind === "series" ? (state.selectedSeason || 1) : undefined,
          episode: kind === "series" ? (state.selectedEpisode || 1) : undefined
        };
      },

      add(list, source) {
        (list || []).forEach(t => {
          if (!t || !t.url || this.tracks.some(x => x.url === t.url)) return;
          const lang = normLang(t.lang || t.language);
          this.tracks.push({
            id: "s" + this.tracks.length + Math.random().toString(36).slice(2, 6),
            lang, url: String(t.url), format: t.format || (/\.srt(\?|$)/i.test(t.url) ? "srt" : (/\.vtt(\?|$)/i.test(t.url) ? "vtt" : "")),
            label: `${SUB_NAMES[lang] || lang.toUpperCase()}${t.label ? " · " + String(t.label).slice(0, 30) : ""}${t.translated ? " (automático)" : ""}`,
            source
          });
        });
        // Idioma preferido primero, luego inglés; como mucho 30
        const rank = t => t.lang === this.prefs.lang ? 0 : t.lang === "es" ? 1 : t.lang === "en" ? 2 : 3;
        this.tracks.sort((a, b) => rank(a) - rank(b));
        this.tracks = this.tracks.slice(0, 30);
        this.updateButton();
      },

      // Se llama al empezar un video en el reproductor propio
      async start(streamSubs, item) {
        const run = ++this.run;
        this.clear();
        this.searching = !!item;
        this.add(streamSubs, "del video");
        this.autoPick(run);
        const ctx = await this.contextFor(item);
        if (run !== this.run || !ctx) return;
        const langs = Array.from(new Set([this.prefs.lang === "off" ? "es" : this.prefs.lang, "es", "en"]));
        const jobs = [];
        // Plugins instalados con subtitles(query)
        state.installed.filter(i => i.address && i.enabled !== false).forEach(inst => {
          jobs.push((async () => {
            const mod = await withTimeout(loadGitHubPlugin(inst), 10000, inst.name).catch(() => null);
            if (!mod || !mod.exports || typeof mod.exports.subtitles !== "function") return;
            const res = await withTimeout(callPluginFn(inst, "subtitles", Object.assign({ languages: langs }, ctx)), 12000, inst.name).catch(() => null);
            if (run === this.run && Array.isArray(res)) this.add(res, inst.name);
          })());
        });
        // Addons de Stremio de subtítulos (por id de IMDb)
        if (ctx.imdbId) {
          let addons = state.installed.filter(i => i.stremio && i.enabled !== false && (/sub/i.test(i.id) || /subtit/i.test(i.name || "")));
          if (!addons.length) addons = [{ id: "opensubtitles-v3", name: "OpenSubtitles", stremio: OPENSUBS_V3 }];
          const vid = ctx.kind === "series" ? `${ctx.imdbId}:${ctx.season}:${ctx.episode}` : ctx.imdbId;
          addons.forEach(a => {
            jobs.push((async () => {
              const base = a.stremio.replace(/\/manifest\.json$/i, "");
              const r = await smartFetch(`${base}/subtitles/${ctx.kind}/${encodeURIComponent(vid)}.json`, { timeoutMs: 12000 }).catch(() => null);
              if (!r || !r.ok) return;
              let d; try { d = parseLenientJson(r.text); } catch (_) { return; }
              const list = (d && Array.isArray(d.subtitles) ? d.subtitles : []).filter(s => langs.includes(normLang(s.lang)));
              if (run === this.run) this.add(list.map(s => ({ lang: s.lang, url: s.url })), a.name);
            })());
          });
        }
        await Promise.all(jobs.map(j => j.catch(() => {})));
        if (run !== this.run) return;
        this.searching = false;
        if (this.isOpen()) this.openPanel(); // refrescar la lista si estaba abierta
        diagLog("subtítulos", `${this.tracks.length} disponibles${ctx.imdbId ? " para " + ctx.imdbId : " (sin id de IMDb: pon la llave de TMDB para buscar más)"}`);
        this.autoPick(run);
      },

      autoPick(run) {
        if (run !== this.run || this.current || this.prefs.lang === "off") return;
        const t = this.tracks.find(x => x.lang === this.prefs.lang);
        if (t) this.select(t.id, true);
      },

      decodeText(raw, text) {
        if (!raw) return text || "";
        try { return new TextDecoder("utf-8", { fatal: true }).decode(raw); }
        catch (_) { try { return new TextDecoder("windows-1252").decode(raw); } catch (__) { return text || ""; } }
      },

      toVtt(text, format) {
        let t = String(text || "").replace(/^﻿/, "").replace(/\r\n?/g, "\n");
        if (format === "vtt" || /^WEBVTT/.test(t.trimStart())) return t.trimStart().startsWith("WEBVTT") ? t : "WEBVTT\n\n" + t;
        // SRT → VTT: tiempos con punto y sin numeración obligatoria
        const body = t.replace(/(\d{1,2}:\d{2}:\d{2}),(\d{1,3})/g, (m, a, b) => `${a.padStart(8, "0")}.${b.padEnd(3, "0")}`)
          .replace(/<\/?font[^>]*>/gi, "").replace(/\{\\[^}]*\}/g, "");
        return "WEBVTT\n\n" + body;
      },

      async select(id, auto) {
        const video = document.getElementById("videoPlayer");
        if (!id) {
          this.current = null;
          Array.from(video.textTracks || []).forEach(tt => { tt.mode = "disabled"; });
          if (!auto) { this.prefs.lang = "off"; this.savePrefs(); playerUI.osd("💬 Sin subtítulos"); }
          this.updateButton();
          return;
        }
        const t = this.tracks.find(x => x.id === id);
        if (!t) return;
        const run = this.run;
        try {
          if (!t.blob) {
            const r = await smartFetch(t.url, { timeoutMs: 15000 });
            if (!r || !r.ok) throw new Error("HTTP " + (r && r.status));
            const vtt = this.toVtt(this.decodeText(r.raw, r.text), t.format);
            if (!/-->/.test(vtt)) throw new Error("archivo sin subtítulos");
            t.blob = URL.createObjectURL(new Blob([vtt], { type: "text/vtt" }));
            this.blobUrls.push(t.blob);
          }
          if (run !== this.run) return;
          let el = video.querySelector(`track[data-sub="${t.id}"]`);
          if (!el) {
            el = document.createElement("track");
            el.kind = "subtitles"; el.srclang = t.lang; el.label = t.label; el.src = t.blob; el.dataset.sub = t.id;
            video.appendChild(el);
          }
          Array.from(video.textTracks || []).forEach(tt => { tt.mode = "disabled"; });
          const tt = el.track;
          tt.mode = "showing";
          this.current = t.id;
          if (!auto) { this.prefs.lang = t.lang; this.savePrefs(); }
          playerUI.osd(`💬 ${t.label}`);
          diagLog("subtítulos", `✓ ${t.label} (${t.source})`);
        } catch (e) {
          diagLog("subtítulos", `✗ ${t.label}: ${e.message || e}`);
          t.broken = true;
          if (!auto) playerUI.osd("✗ No se pudo cargar ese subtítulo");
          else { const next = this.tracks.find(x => x.lang === t.lang && !x.broken && x.id !== t.id); if (next) return this.select(next.id, true); }
        }
        this.updateButton();
      },

      clear() {
        const video = document.getElementById("videoPlayer");
        Array.from(video.querySelectorAll("track[data-sub]")).forEach(el => el.remove());
        this.blobUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch (_) {} });
        this.blobUrls = [];
        this.tracks = [];
        this.current = null;
        this.closePanel();
        this.updateButton();
      },

      applySize() {
        document.getElementById("playerOverlay").classList.toggle("subs-big", this.prefs.size === "big");
      },

      updateButton() {
        const b = document.getElementById("playerSubsBtn");
        if (!b) return;

        b.textContent = cur ? `💬 ${SUB_NAMES[cur.lang] || cur.lang.toUpperCase()}` : (this.tracks.length ? `💬 Subtítulos (${this.tracks.length})` : "💬 Subtítulos");
      },

      isOpen() { return document.getElementById("subsPanel").classList.contains("open"); },
      openPanel() {
        const panel = document.getElementById("subsPanel");
        const list = document.getElementById("subsList");
        list.innerHTML = "";
        const mk = (label, active, fn) => {
          const btn = document.createElement("button");
          btn.className = "subs-opt focusable" + (active ? " active" : "");
          btn.textContent = (active ? "✓ " : "") + label;
          btn.addEventListener("click", fn);
          list.appendChild(btn);
          return btn;
        };
        const first = mk("Sin subtítulos", !this.current, () => { this.select(null); this.closePanel(); });
        if (!this.tracks.length) {
          const note = document.createElement("div");
          note.className = "subs-note";
          note.textContent = this.searching ? "Buscando subtítulos… (OpenSubtitles y tus plugins de subtítulos)" : "No se encontraron subtítulos para este título";
          list.appendChild(note);
        }
        this.tracks.slice(0, 14).forEach(t => mk(`${t.label} — ${t.source}${t.broken ? " ✗" : ""}`, t.id === this.current, () => { this.select(t.id); this.closePanel(); }));
        mk(`🔠 Tamaño: ${this.prefs.size === "big" ? "Grande" : "Normal"}`, false, () => {
          this.prefs.size = this.prefs.size === "big" ? "normal" : "big";
          this.savePrefs(); this.applySize(); this.openPanel();
        });
        panel.classList.add("open");
        clearTimeout(playerUI.hideTimer);
        playerUI.overlay().classList.remove("hud-hidden");
        (list.querySelector(".subs-opt.active") || first).focus();
      },
      closePanel() {
        const panel = document.getElementById("subsPanel");
        if (!panel || !panel.classList.contains("open")) return;
        panel.classList.remove("open");
        const b = document.getElementById("playerSubsBtn");
        if (b && playerUI.isOpen()) b.focus();
        playerUI.scheduleHide();
      }
    };
    Subs.applySize();
    document.getElementById("playerSubsBtn").addEventListener("click", () => Subs.isOpen() ? Subs.closePanel() : Subs.openPanel());

    // =========================================================================
    // PUNTERO VIRTUAL
    // La página del servidor se muestra dentro de la caja de arena (donde la app
    // controla su código) y un cursor se mueve con las flechas; OK hace clic en
    // ese punto, también dentro de los marcos internos del reproductor. En
    // cuanto la página pide el video, se pasa solo al reproductor propio.
    // Límite honesto: son clics "sintéticos"; los captchas suelen rechazarlos.
    // =========================================================================
    const Pointer = {
      active: false, token: "", frame: null, cursor: null, x: 0, y: 0,
      lastKey: "", lastAt: 0, streak: 0, src: null, title: "",
      buildDoc(url, text, path) {
        const proxy = state.customProxy || state.lastGoodProxy || "https://api.codetabs.com/v1/proxy?quest=";
        const cfg = JSON.stringify({ token: this.token, proxy, page: url, custom: !!state.customProxy && proxy === state.customProxy, noClick: true, pointer: true, path: path || "" }).replace(/</g, "\\u003c");
        const inject = `<base href="${url.replace(/"/g, "&quot;")}"><script>(${kinoCaptureHook.toString()})(${cfg});<\/script>`;
        let html = String(text || "").replace(/<meta[^>]+http-equiv\s*=\s*["']?content-security-policy[^>]*>/gi, "");
        html = html.replace(/<iframe\b([^>]*?)\ssrc\s*=/gi, "<iframe$1 data-src="); // la app los carga con el código espía
        return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + inject) : inject + html;
      },
      async open(src, title) {
        if (!src || !src.url) return;
        markUserPlayIntent();
        this.close(true);
        this.src = src; this.title = title || "";
        this.token = "p" + Math.random().toString(36).slice(2);
        playerUI.osd("🖱 Abriendo la página con puntero...");
        const r = await smartFetch(src.url, { timeoutMs: 15000 }).catch(() => null);
        if (!r || !r.ok || !r.text || looksBlocked(r)) {
          playerUI.osd(r && looksBlocked(r) ? "✗ La página pide verificación (captcha/Cloudflare)" : "✗ No se pudo abrir la página del servidor");
          diagLog("puntero", `✗ no se pudo abrir ${src.url.slice(0, 70)}${r ? " (HTTP " + r.status + ")" : ""}`);
          return;
        }
        if (!playerUI.isOpen()) return;
        // La página embed normal se descarga (no debe sonar por detrás)
        const iframe = document.getElementById("webPlayerFrame");
        playerUI.embedActive = false;
        iframe.src = "about:blank";
        const ov = document.getElementById("playerOverlay");
        const f = document.createElement("iframe");
        f.id = "pointerFrame";
        f.setAttribute("sandbox", "allow-scripts allow-forms"); // aislada: sin datos de la app, sin ventanas, sin salir de la app
        f.setAttribute("allow", "autoplay; fullscreen; encrypted-media");
        f.setAttribute("tabindex", "-1");
        f.style.cssText = "position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; z-index:3;";
        f.srcdoc = this.buildDoc(src.url, r.text, "");
        ov.appendChild(f);
        const c = document.createElement("div");
        c.id = "vCursor";
        ov.appendChild(c);
        this.frame = f; this.cursor = c; this.active = true;
        this.x = Math.round(window.innerWidth / 2); this.y = Math.round(window.innerHeight / 2);
        this.place();
        ov.classList.add("pointer-mode", "hud-hidden");
        clearTimeout(playerUI.hideTimer);
        window.addEventListener("message", this.onMsg);
        diagLog("puntero", `▶ página abierta con puntero: ${src.url.slice(0, 70)}`);
        playerUI.osd("🖱 Flechas: mover · OK: clic · CH+/CH−: desplazar · Back: salir");
      },
      onMsg: async (ev) => {
        const P = Pointer, d = ev.data;
        if (!P.active || !d || d.__kinoCapture !== P.token || ev.source !== (P.frame && P.frame.contentWindow)) return;
        if (d.frameReq) {
          // Un marco interno (p. ej. el reproductor real): cargarlo también con el código espía
          const r = await smartFetch(d.frameReq, { timeoutMs: 15000, headers: { Referer: P.src.url } }).catch(() => null);
          if (!P.active || !r || !r.ok || !r.text) { diagLog("puntero", `✗ marco interno sin respuesta: ${String(d.frameReq).slice(0, 60)}`); return; }
          P.frame.contentWindow.postMessage({ __kinoPointer: P.token, type: "frameHtml", target: d.path, html: P.buildDoc(d.frameReq, r.text, d.path) }, "*");
          return;
        }
        if (d.media) {
          // La página pidió el video: pasar al reproductor propio (controlable)
          diagLog("puntero", `✓ video capturado con el puntero (${d.why}): ${d.media.slice(0, 80)}`);
          const src = P.src, title = P.title;
          P.close();
          playerUI.osd("⚡ Video encontrado: pasando al reproductor propio");
          startPlayback(d.media, `${title || "Reproduciendo"} — ${src.name || "Servidor"}`, { mime: /\.mp4(\?|#|$)/i.test(d.media) ? "video/mp4" : "application/vnd.apple.mpegurl", referer: { Referer: src.url } });
        }
      },
      place() {
        if (!this.cursor) return;
        this.x = Math.max(0, Math.min(window.innerWidth - 2, this.x));
        this.y = Math.max(0, Math.min(window.innerHeight - 2, this.y));
        this.cursor.style.transform = `translate(${this.x}px, ${this.y}px)`;
      },
      send(msg) {
        try { this.frame.contentWindow.postMessage(Object.assign({ __kinoPointer: this.token }, msg), "*"); } catch (_) {}
      },
      // Teclas en modo puntero. Devuelve true si la atendió.
      key(e) {
        if (!this.active) return false;
        const k = e.key, c = e.keyCode;
        const dirs = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
        if (dirs[k]) {
          e.preventDefault();
          // Acelera al mantener o repetir la misma flecha
          const now = Date.now();
          this.streak = (k === this.lastKey && now - this.lastAt < 350) ? this.streak + 1 : 0;
          this.lastKey = k; this.lastAt = now;
          const step = Math.min(10 + this.streak * 7, 90);
          this.x += dirs[k][0] * step; this.y += dirs[k][1] * step;
          this.place();
          this.send({ type: "move", x: this.x, y: this.y });
          return true;
        }
        if (k === "Enter" || c === 13) {
          e.preventDefault();
          this.cursor.classList.remove("click"); void this.cursor.offsetWidth; this.cursor.classList.add("click");
          this.send({ type: "click", x: this.x, y: this.y });
          return true;
        }
        if (k === "PageUp" || c === 427 || c === 33) { e.preventDefault(); this.send({ type: "scroll", dy: -Math.round(window.innerHeight * 0.6) }); return true; }
        if (k === "PageDown" || c === 428 || c === 34) { e.preventDefault(); this.send({ type: "scroll", dy: Math.round(window.innerHeight * 0.6) }); return true; }
        return false;
      },
      close(silent) {
        window.removeEventListener("message", this.onMsg);
        if (this.frame) { try { this.frame.srcdoc = ""; this.frame.remove(); } catch (_) {} }
        if (this.cursor) this.cursor.remove();
        this.frame = null; this.cursor = null;
        const was = this.active;
        this.active = false;
        document.getElementById("playerOverlay").classList.remove("pointer-mode");
        if (was && !silent && playerUI.isOpen()) {
          // Volver a mostrar la página normal del servidor (se había descargado)
          if (this.src && playerUI.isEmbed()) { const ifr = document.getElementById("webPlayerFrame"); playerUI.embedActive = true; ifr.src = this.src.url; }
          playerUI.show(true);
          playerUI.osd("🖱 Puntero cerrado");
        }
      }
    };

    function handoffToVidaaNativePlayer(url, title) {
      if (!url) return;
      try {
        if (window.omi_platform && typeof window.omi_platform.sendPlatformMessage === "function") {
          window.omi_platform.sendPlatformMessage(JSON.stringify({
            type: "launch_media_player",
            url: url,
            title: title || "Kino TV"
          }));
          setStatus("Enviado al reproductor nativo de VIDAA OS");
          return;
        }
      } catch (e) {}
      window.open(url, "_blank");
    }

    // Eventos de botones de modales
    document.getElementById("playDirectBtn").addEventListener("click", async () => {
      const it = state.selectedItem;
      if (!it) return;
      markUserPlayIntent();
      state.autoHops = 0;
      const playDirect = () => {
        const d = (state.directStreams || []).find(x => x.url);
        if (d) { startPlayback(d.url, `${it.title} (${d.label})`, { mime: d.mime, referer: refOf(d), subtitles: d.subtitles }); return true; }
        return false;
      };
      // 1. Enlace directo (se controla con el mando) o el video propio del título
      if (playDirect()) return;
      if (it.video) { startPlayback(it.video, it.title); return; }
      // 2. Título de un plugin: resolver su enlace
      if (it.pluginId && it.ref && !it.stremioBase) {
        const list = await resolvePluginRef(it.pluginId, it.ref, it.title);
        const first = list.find(x => x.url);
        if (first) startPlayback(first.url, `${it.title} (${first.label})`, { mime: first.mime, referer: refOf(first), subtitles: first.subtitles });
        return;
      }
      // 3. Esperar (máx. 15 s) a que la búsqueda en plugins o el extractor de
      //    los servidores embed den un enlace directo, controlable con el mando
      const pend = [state.directSearch, state.extractSearch].filter(x => x && x.item === it).map(x => x.promise);
      if (pend.length) {
        setStatus("⏳ Buscando un video que se pueda controlar con el mando (máx. 15 s)...", { priority: true });
        const allDone = Promise.all(pend);
        const t0 = Date.now();
        while (Date.now() - t0 < 15000) {
          if ((state.directStreams || []).some(x => x.url)) break;
          const finished = await Promise.race([allDone.then(() => true), new Promise(r => setTimeout(() => r(false), 300))]);
          if (finished) break;
        }
        if (state.selectedItem !== it || playerUI.isOpen()) return;
        if (playDirect()) return;
      }
      // 3b. La búsqueda de fondo no puede ejecutar páginas de servidores (para no
      //     parecer un bot); ahora que pulsaste Reproducir, repetirla con permiso
      // (solo si la de fondo se saltó alguna captura, o no hubo búsqueda: si no, sería esperar en vano)
      const hadBackground = !!(state.directSearch && state.directSearch.item === it);
      if (state.installed.some(i => i.address && i.enabled !== false) && (state.captureSkipped || !hadBackground)) {
        setStatus("⏳ Buscando el video en tus plugins (máx. 40 s)...", { priority: true });
        await Promise.race([findDirectStreams(it, { season: state.selectedSeason, episode: state.selectedEpisode }), new Promise(r => setTimeout(r, 40000))]);
        if (state.selectedItem !== it || playerUI.isOpen()) return;
        if (playDirect()) return;
      }
      // 4. Leer el HTML de los servidores web (rápido, una petición cada uno)
      if (state.activeSources.some(x => x.type === "embed")) {
        setStatus("⏳ Revisando los servidores web...", { priority: true });
        const quick = extractAllEmbeds(it);
        state.extractSearch = { item: it, promise: quick };
        await Promise.race([quick, new Promise(r => setTimeout(r, 15000))]);
        if (state.selectedItem !== it || playerUI.isOpen()) return;
        if (playDirect()) return;
      }
      // 5. Nada controlable con el mando. Antes se abría la página embed, cuyo ▶
      //    no se puede pulsar con el control: ahora se explica y se ofrecen
      //    opciones en vez de dejar un video atascado.
      if (state.activeSources.length) {
        showNoControllableVideo(it);
        return;
      }
      findDirectStreams(it, { autoplay: true, season: state.selectedSeason, episode: state.selectedEpisode });
    });

    function showNoControllableVideo(it) {
      const box = document.getElementById("directStreamsList");
      setStatus("No se encontró un video que se pueda controlar con el mando", { priority: true });
      box.innerHTML = `
        <div class="list-box" style="flex-direction:column; align-items:stretch; gap:10px; border-color:rgba(229,9,20,0.5);">
          <strong>⚠️ No encontré un video que se controle con el mando</strong>

            Tus plugins no dieron enlace directo y los servidores web (abajo) tienen su propio botón ▶,
            que solo se pulsa con puntero. Opciones:
          </div>
          <div class="btn-group">
            <button class="action-btn small focusable" id="ncRetryBtn">🔄 Buscar otra vez en plugins</button>
            <button class="action-btn blue small focusable" id="ncBrowserBtn">🌐 Abrir en Navegador TV (con puntero)</button>
            <button class="action-btn small focusable" id="ncPointerBtn">🖱 Abrir con puntero virtual</button>
            <button class="action-btn secondary small focusable" id="ncEmbedBtn">Abrir servidor web aquí igualmente</button>

      document.getElementById("ncRetryBtn").addEventListener("click", () => findDirectStreams(it, { autoplay: true }));
      document.getElementById("ncBrowserBtn").addEventListener("click", () => {

        await Promise.race([extractAllEmbeds(it, { deep: true }), new Promise(r => setTimeout(r, 40000))]);
        const d = (state.directStreams || []).find(x => x.url);
        if (d && state.selectedItem === it) startPlayback(d.url, `${it.title} (${d.label})`, { mime: d.mime, referer: refOf(d), subtitles: d.subtitles });
        else setStatus("No se pudo sacar el video de los servidores web", { priority: true });
      });
      document.getElementById("ncPointerBtn").addEventListener("click", () => {
        state.currentSourceIndex = 0;
        startPlaybackSource(state.activeSources[0], it.title); // abre el servidor web...
        Pointer.open(state.activeSources[0], it.title);        // ...y encima, el puntero
      });
      document.getElementById("ncEmbedBtn").addEventListener("click", () => {
        state.currentSourceIndex = 0;
        startPlaybackSource(state.activeSources[0], it.title);
      });
      focusAndReveal(document.getElementById("ncRetryBtn"));
    }

    document.getElementById("closeDetailBtn").addEventListener("click", () => {

    document.getElementById("closePlayerBtn").addEventListener("click", () => {
      const video = document.getElementById("videoPlayer");
      const iframe = document.getElementById("webPlayerFrame");
      // Quitar el handler ANTES de vaciar el src: si no, el evento "error" que
      // dispara un src vacío reintenta vía proxy y vuelve a abrir el player.
      playbackRun++; // cancela los intentos pendientes del reproductor
      Subs.run++; Subs.clear();
      Pointer.close(true);
      video.onerror = null;
      video.onloadeddata = null;
      if (state.hlsInstance) { state.hlsInstance.destroy(); state.hlsInstance = null; }
      video.pause();
      video.removeAttribute("src");
      try { video.load(); } catch (_) {}
      video.style.display = "";
      playerUI.embedActive = false;
      iframe.src = "about:blank";
      iframe.style.display = "none";
      playerUI.reset();
      document.getElementById("playerOverlay").classList.remove("open");
