        grid.appendChild(card);
      });

      wrap.appendChild(grid);
      viewContent.appendChild(wrap);

      const filterInput = document.getElementById("storeFilterInput");
      filterInput.addEventListener("input", e => {
        state.storeQuery = e.target.value;
        const pos = filterInput.selectionStart;
        renderView();
        const newInput = document.getElementById("storeFilterInput");
        if (newInput) { newInput.focus(); newInput.setSelectionRange(pos, pos); }
      });
    }

    async function syncPluginStoreFromGitHub() {
      setStatus("Sincronizando índice de plugins con kinotvapp/kino-plugins...");
      try {
        const [idxRes, catRes] = await Promise.all([
          smartFetch("https://raw.githubusercontent.com/kinotvapp/kino-plugins/main/index.json"),
          smartFetch("https://raw.githubusercontent.com/kinotvapp/kino-plugins/main/catalog.json")
        ]);
        const newComm = idxRes.ok ? (JSON.parse(stripBom(idxRes.text)).entries || KINO_COMMUNITY_STORE) : KINO_COMMUNITY_STORE;
        const newSeed = catRes.ok ? (JSON.parse(stripBom(catRes.text)).plugins || KINO_SEED_PLUGINS) : KINO_SEED_PLUGINS;
        state.storeEntries = buildUnifiedStore(newSeed, newComm);
        setStatus(`Tienda actualizada: ${state.storeEntries.length} plugins disponibles`);
        renderView();
      } catch (e) {
        setStatus("Usando catálogo integrado de Kino v0.9.79");
      }
    }

    // Re-dibuja la vista sin perder el foco del control remoto: antes, al
    // cambiar de pestaña o al terminar de cargar el Inicio en segundo plano,
    // el foco desaparecía y la siguiente flecha saltaba a otro lado.
    function focusSignature(el) {
      if (!el || !el.classList || !el.classList.contains("focusable")) return null;
      if (el.id) return "#" + el.id;
      return el.tagName + "|" + el.className.replace(/\b(active|installed|success)\b/g, "").trim() + "|" + (el.textContent || "").trim().slice(0, 60);
    }
    function renderView() {
      const prev = document.activeElement;
      const hadFocusInMain = !!(prev && prev.closest && prev.closest("#viewContent"));
      const sig = hadFocusInMain ? focusSignature(prev) : null;
      const prevRect = hadFocusInMain ? prev.getBoundingClientRect() : null;
      renderViewInner();
      if (!hadFocusInMain || document.activeElement && document.activeElement !== document.body && document.contains(document.activeElement)) return;
      if (focusScope() !== document) return;
      const list = visibleFocusables(document.getElementById("viewContent"));
      const same = sig && list.find(el => focusSignature(el) === sig);
      const target = same || (prevRect && nearestTo(prevRect, list));
      if (target) { try { target.focus({ preventScroll: true }); } catch (_) { target.focus(); } }
    }
    function renderViewInner() {
      viewContent.innerHTML = "";
      updateBadges();
      document.querySelectorAll(".nav-btn[data-view]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === state.view);
      });

      if (state.view === "home") {
        viewTitle.textContent = "Inicio";
        const topActions = document.createElement("div");
        topActions.className = "tabs-bar";
        topActions.innerHTML = `
          <button class="action-btn secondary small focusable" id="reloadHomeBtn">🔄 Recargar Filas de Plugins</button>
          <button class="action-btn small focusable" id="goStoreBtn">🧩 Ir a Tienda de Plugins (${state.storeEntries.length})</button>
        `;
        viewContent.appendChild(topActions);
        document.getElementById("reloadHomeBtn").addEventListener("click", refreshHomeCatalog);
        document.getElementById("goStoreBtn").addEventListener("click", () => { state.view = "plugins"; renderView(); });

        if (!state.homeRows.length) {
          const empty = document.createElement("div");
          empty.className = "list-box";
          empty.innerHTML = `<div>Cargando filas de tus plugins activos (${state.installed.map(i => i.name).join(", ")})...</div>`;
          viewContent.appendChild(empty);
        } else {
          state.homeRows.forEach(section => {
            const rowDiv = document.createElement("div");
            rowDiv.className = "row-section";
            rowDiv.innerHTML = `
              <div class="row-header">
                <div class="row-title">${section.row} <span class="row-source-tag">${section.sourceName || "Plugin"}</span></div>
              </div>
            `;
            rowDiv.appendChild(renderCardGrid(section.items));
            viewContent.appendChild(rowDiv);
          });
        }
      } else if (state.view === "plugins") {
        renderPluginsStoreView();
      } else if (state.view === "search") {
        viewTitle.textContent = "Buscar en Todos tus Plugins Instalados";
        const box = document.createElement("div");
        box.innerHTML = `
          <div class="input-row">
            <input id="searchInput" class="tv-input focusable" type="text" placeholder="Escribe una película, serie o anime para buscar en todos tus plugins activos..." />
            <button id="searchRunBtn" class="action-btn focusable">🔍 Buscar</button>
          </div>
          <div id="searchResults"></div>
        `;
        viewContent.appendChild(box);
        const input = document.getElementById("searchInput");
        const runBtn = document.getElementById("searchRunBtn");
        const resultsDiv = document.getElementById("searchResults");

        const executeMultiSearch = async () => {
          const q = input.value.trim();
          if (!q) return;
          const runToken = ++state.searchRun; // invalida búsquedas anteriores
          const active = state.installed.filter(i => i.enabled !== false);
          setStatus(`Buscando "${q}" en ${active.length} plugins...`);
          resultsDiv.innerHTML = "";
          const progress = document.createElement("p");
          progress.style.cssText = "color:var(--muted); font-size:14px; margin-bottom:10px;";
          progress.textContent = `Consultando ${active.length} plugins… los resultados aparecen conforme responden.`;
          resultsDiv.appendChild(progress);
          let answered = 0;
          let withResults = 0;

          const addGroup = (g, putFirst) => {
            if (state.searchRun !== runToken) return;
            const sec = document.createElement("div");
            sec.className = "row-section";
            sec.innerHTML = `<div class="row-title">Resultados en ${g.title}</div>`;
            sec.appendChild(renderCardGrid(g.items));
            if (putFirst) resultsDiv.insertBefore(sec, progress.nextSibling);
            else resultsDiv.appendChild(sec);
          };

          // Vía sin proxy: Cinemeta (catálogo oficial Stremio) tiene CORS abierto
          // y responde enseguida — sus resultados aparecen primero, aunque todos
          // los plugins sigan peleando con los proxies.
          const cinemetaTask = withTimeout(Promise.all([fetchCinemetaCatalog("movie", q), fetchCinemetaCatalog("series", q)]), 25000, "cinemeta")
            .then(([cmMovies, cmSeries]) => {
              if (state.searchRun !== runToken) return;
              if (cmSeries.length) { withResults++; addGroup({ title: "Series (Cinemeta · servidores embed, sin proxy)", items: cmSeries.slice(0, 18) }, true); }
              if (cmMovies.length) { withResults++; addGroup({ title: "Películas (Cinemeta · servidores embed, sin proxy)", items: cmMovies.slice(0, 18) }, true); }
            })
            .catch(() => {});

          // Busca en UN plugin y devuelve sus grupos de resultados (sin tocar el DOM)
          const searchOnePlugin = async (inst) => {
            const found = [];
            if (inst.stremio) {
              const baseUrl = inst.stremio.replace(/\/manifest\.json$/i, "");
              for (const t of ["movie", "series"]) {
                try {
                  const u = `${baseUrl}/catalog/${t}/top/search=${encodeURIComponent(q)}.json`;
                  const r = await smartFetch(u);
                  if (r.ok) {
                    const d = JSON.parse(r.text);
                    if (d.metas && d.metas.length) {
                      found.push({
                        title: `${inst.name} (${t})`,
                        items: d.metas.slice(0, 18).map(m => ({
                          id: `${inst.id}_${m.id}`,
                          rawId: m.id,
                          ref: m.id,
                          title: m.name,
                          year: m.releaseInfo || "",
                          poster: m.poster || "",
                          synopsis: m.description || "",
                          kind: m.type || t,
                          stremioBase: baseUrl,
                          stremioType: m.type || t,
                          pluginId: inst.id,
                          source: inst.name
                        }))
                      });
                    }
                  }
                } catch (_) {}
              }
            } else if (inst.address) {
              let res = null;
              try {
                res = await callPluginFn(inst, "search", { q, query: q, type: "movie", originalTitle: q, altTitles: [] });
              } catch (_) {
                try { res = await callPluginFn(inst, "search", q); } catch (_) {}
              }
              const list = Array.isArray(res) ? res : (res && Array.isArray(res.items) ? res.items : []);
              if (list.length) {
                found.push({
                  title: inst.name,
                  items: list.slice(0, 24).map(it => ({
                    id: `${inst.id}_${it.id || it.ref || it.title}`,
                    ref: it.ref || it.id,
                    title: it.title || it.name || "Sin título",
                    year: it.year || "",
                    poster: it.poster || it.image || "",
                    synopsis: it.overview || it.synopsis || "",
                    kind: it.kind || it.type || "movie",
                    video: it.url || it.video || "",
                    pluginId: inst.id,
                    source: inst.name
                  }))
                });
              }
            }
            return found;
          };

          // Todos los plugins EN PARALELO, cada uno con su propio límite de 30 s:
          // un plugin lento o caído ya no congela a los demás.
          const tasks = active.map(inst =>
            withTimeout(searchOnePlugin(inst), 30000, inst.name)
              .then(groups => {
                groups.forEach(g => { withResults++; addGroup(g); });
              })
              .catch(e => console.warn(`Búsqueda en ${inst.name}:`, e && e.message))
              .finally(() => {
                answered++;
                if (state.searchRun === runToken) {
                  progress.textContent = `Consultando plugins… ${answered}/${active.length} respondieron.`;
                  setStatus(`Buscando "${q}" · ${answered}/${active.length} fuentes · ${withResults} con resultados`);
                }
              })
          );
          await Promise.allSettled([...tasks, cinemetaTask]);
          if (state.searchRun !== runToken) return; // el usuario lanzó otra búsqueda

          if (!withResults) {
            resultsDiv.innerHTML = "<p style='color:var(--muted)'>No se encontraron resultados. Revisa Ajustes ▸ Probar Conexión, o instala más plugins desde la Tienda.</p>";
          } else {
            progress.textContent = `✅ ${withResults} fuentes con resultados de ${active.length} plugins.`;
          }
          setStatus(`Búsqueda completada (${withResults} fuentes con resultados)`);
        };
        runBtn.addEventListener("click", executeMultiSearch);
        input.addEventListener("keydown", e => { if (e.key === "Enter") executeMultiSearch(); });
      } else if (state.view === "livetv") {
        viewTitle.textContent = `Canales en Vivo (${state.liveChannels.length} canales)`;
        const container = document.createElement("div");
        container.innerHTML = `
          <div class="input-row">
            <input id="m3uName" class="tv-input focusable" placeholder="Nombre del canal o lista M3U" />
            <input id="m3uUrl" class="tv-input focusable" placeholder="URL .m3u8 / .mp4 o lista .m3u completa" />
            <button id="addM3uBtn" class="action-btn focusable">+ Agregar Canal / Lista M3U</button>
          </div>
          <div id="channelsList"></div>
        `;
        viewContent.appendChild(container);
        const listDiv = document.getElementById("channelsList");
        const renderChannels = () => {
          listDiv.innerHTML = "";
          state.liveChannels.forEach((ch, idx) => {
            const row = document.createElement("div");
            row.className = "list-box";
            row.innerHTML = `
              <div>
                <strong>📺 ${ch.name}</strong> <span class="tag-chip">${ch.group || "En Vivo"}</span>
                <div style="font-size:12px; color:var(--muted); margin-top:3px;">${ch.url || ("Plugin: " + (ch.pluginId || "Kino"))}</div>
              </div>
              <div class="btn-group">
                <button class="action-btn small focusable" data-play="${idx}">▶ Reproducir</button>
                <button class="action-btn secondary small focusable" data-del="${idx}">🗑</button>
              </div>
            `;
            row.querySelector("[data-play]").addEventListener("click", async () => {
              if (ch.url) {
                startPlayback(ch.url, ch.name);
              } else if (ch.pluginId && ch.ref) {
                const inst = state.installed.find(x => x.id === ch.pluginId);
                if (inst) {
                  setStatus(`Resolviendo canal ${ch.name}...`);
                  const r = await withTimeout(callPluginFn(inst, "resolve", ch.ref), 45000, inst.name);
                  const streamUrl = r && (r.url || (Array.isArray(r.copies) && r.copies[0] && r.copies[0].url));
                  if (streamUrl) startPlayback(streamUrl, ch.name);
                  else setStatus("No se pudo obtener stream del canal");
                }
              }
            });
            row.querySelector("[data-del]").addEventListener("click", () => {
              state.liveChannels.splice(idx, 1);
              saveStore("kino_m3u_v2", state.liveChannels.filter(ch => !ch.pluginId)); // los de plugins se recargan solos
              renderChannels();
            });
            listDiv.appendChild(row);
          });
        };
        renderChannels();
        document.getElementById("addM3uBtn").addEventListener("click", async () => {
          const name = document.getElementById("m3uName").value.trim() || "Canal M3U";
          const url = document.getElementById("m3uUrl").value.trim();
          if (!url) return;
          if (url.endsWith(".m3u") || url.includes("m3u")) {
            try {
              setStatus("Importando lista M3U...");
              const r = await smartFetch(url);
              const lines = r.text.split(/\r?\n/);
              let currentName = "Canal M3U";
              lines.forEach(line => {
                if (line.startsWith("#EXTINF:")) {
                  const parts = line.split(",");
                  currentName = parts[parts.length - 1].trim() || "Canal M3U";
                } else if (line.startsWith("http")) {
                  state.liveChannels.push({ name: currentName, url: line.trim(), group: name });
                }
              });
              saveStore("kino_m3u_v2", state.liveChannels.filter(ch => !ch.pluginId)); // los de plugins se recargan solos
              renderChannels();
              setStatus("Lista M3U importada");
              return;
            } catch (_) {}
          }
          state.liveChannels.push({ name, url, group: "Personalizado" });
          saveStore("kino_m3u_v2", state.liveChannels.filter(ch => !ch.pluginId)); // los de plugins se recargan solos
          renderChannels();
        });
      } else if (state.view === "favorites") {
        viewTitle.textContent = "Mi Biblioteca (Favoritos)";
        if (!state.favorites.length) {
          viewContent.innerHTML = "<p style='color:var(--muted)'>Aún no tienes títulos guardados en Favoritos.</p>";
        } else {
          viewContent.appendChild(renderCardGrid(state.favorites));
        }
      } else if (state.view === "settings") {
        viewTitle.textContent = "Ajustes de Kino VIDAA y Puente CORS";
        const box = document.createElement("div");
        box.innerHTML = `
          <div class="list-box" style="flex-direction:column; align-items:stretch; gap:12px;">
            <h3>1. Modo de Conexión para Plugins (Puente CORS)</h3>
            <p style="color:var(--muted); font-size:14px;">Como la app corre en el navegador de VIDAA TV sobre GitHub Pages, algunos plugins comunitarios consultan sitios web que requieren proxy CORS.</p>
            <div class="tabs-bar">
              <button class="pill-btn focusable ${state.corsMode === 'auto' ? 'active' : ''}" data-cors="auto">Automático (Directo + Respaldo Proxy)</button>
              <button class="pill-btn focusable ${state.corsMode === 'direct' ? 'active' : ''}" data-cors="direct">Solo Directo</button>
            </div>
            <input id="customProxyInput" class="tv-input focusable" value="${state.customProxy}" placeholder="URL de Proxy CORS propio opcional (ej. https://mi-worker.workers.dev/?url=)" />
            <div class="btn-group">
              <button id="testProxiesBtn" class="action-btn secondary focusable">📡 Probar Conexión con CineHD Plus (xuper)</button>
            </div>
            <div id="proxyTestResults" style="font-size:13px; color:var(--muted); line-height:1.7;"></div>
          </div>
          <div class="list-box" style="flex-direction:column; align-items:stretch; gap:12px;">
            <h3>2. Llave API de TMDB (Opcional, para el plugin oficial TMDB)</h3>
            <input id="tmdbKeyInput" class="tv-input focusable" value="${state.tmdbKey}" placeholder="Pega tu API Key v3 de TMDB (opcional)" />
          </div>
          <div class="list-box">
            <div>
              <strong>Mostrar categoría 18+ en la Tienda de Plugins</strong>
              <div style="font-size:13px; color:var(--muted)">Oculta por defecto, igual que en Kino APK.</div>
            </div>
            <button id="toggleAdultBtn" class="action-btn secondary focusable">${state.showAdult ? "Activado" : "Desactivado"}</button>
          </div>
          <button id="saveSettingsBtn" class="action-btn focusable">💾 Guardar Ajustes</button>
        `;
        viewContent.appendChild(box);
        box.querySelectorAll("[data-cors]").forEach(b => {
          b.addEventListener("click", () => {
            state.corsMode = b.dataset.cors;
            saveStore("kino_cors_mode", state.corsMode);
            renderView();
          });
        });
        document.getElementById("toggleAdultBtn").addEventListener("click", () => {
          state.showAdult = !state.showAdult;
          saveStore("kino_show_adult", state.showAdult);
          renderView();
        });
        document.getElementById("testProxiesBtn").addEventListener("click", async () => {
          const out = document.getElementById("proxyTestResults");
          const target = "https://cinehdplus.org/peliculas/?sort=recent";
          const candidates = [];
          if (document.getElementById("customProxyInput").value.trim()) {
            candidates.push({ label: "Tu proxy propio", prefix: document.getElementById("customProxyInput").value.trim() });
          }
          candidates.push(
            { label: "codetabs", prefix: "https://api.codetabs.com/v1/proxy?quest=" },
            { label: "allorigins", prefix: "https://api.allorigins.win/raw?url=" },
            { label: "cors.lol", prefix: "https://api.cors.lol/?url=" }
          );
          out.innerHTML = "Probando acceso a cinehdplus.org (puede tardar unos segundos por ruta)...<br>";
          // 1) Conexión directa (solo posible si el sitio habilita CORS o el WebView lo permite)
          try {
            const t0 = Date.now();
            const r = await fetchWithTimeout(target, { headers: { "Accept-Language": "es-MX,es;q=0.9" } }, 12000);
            const txt = await readBodyCapped(r, 300000);
            const blocked = looksBlocked({ status: r.status, text: txt });
            out.innerHTML += `${r.ok && !blocked ? "✅" : "⚠️"} Directo (sin proxy): HTTP ${r.status} · ${((Date.now() - t0) / 1000).toFixed(1)}s${blocked ? " · Cloudflare lo protege, hará falta proxy" : ""}<br>`;
          } catch (_) {
            out.innerHTML += "❌ Directo (sin proxy): bloqueado por CORS en este navegador — normal en VIDAA, se usará proxy<br>";
          }
          // 2) Cada proxy de la cadena
          for (const c of candidates) {
            try {
              const t0 = Date.now();
              const r = await fetchWithTimeout(c.prefix + encodeURIComponent(target), {}, 15000);
              const txt = await readBodyCapped(r, 300000);
              const blocked = looksBlocked({ status: r.status, text: txt });
              const okHtml = r.ok && !blocked && /<html|<!doctype/i.test(txt);
              out.innerHTML += `${okHtml ? "✅" : "❌"} Proxy ${c.label}: HTTP ${r.status} · ${((Date.now() - t0) / 1000).toFixed(1)}s${okHtml ? " · funciona con CineHD Plus" : (blocked ? " · bloqueado o saturado" : " · respuesta inusual")}<br>`;
              if (okHtml) { state.lastGoodProxy = c.prefix; saveStore("kino_last_proxy", c.prefix); }
            } catch (_) {
              out.innerHTML += `❌ Proxy ${c.label}: sin respuesta<br>`;
            }
          }
          out.innerHTML += "<br>Si todos fallan, despliega un proxy propio (p. ej. un Cloudflare Worker) y pégalo arriba.";
        });
        document.getElementById("saveSettingsBtn").addEventListener("click", () => {
          state.customProxy = document.getElementById("customProxyInput").value.trim();

          saveStore("kino_custom_proxy", state.customProxy);

      } else if (state.view === "diag") {

        const wrap = document.createElement("div");

            <pre id="workerCode" class="diag-log" style="max-height:180px;">addEventListener('fetch', e =&gt; e.respondWith((async () =&gt; {

    function renderStreamOptions(streams, title) {
      const streamsList = document.getElementById("streamsList");
      streamsList.innerHTML = "";
      if (!streams.length) {
        streamsList.innerHTML = "<div style='color:var(--muted); font-size:14px;'>No se devolvieron enlaces directos para esta opción. Prueba con '🔎 Buscar Streams en Plugins'.</div>";
        return;
      }
      streams.forEach((s, i) => {
        const row = document.createElement("div");
        row.className = "stream-item focusable";
        row.tabIndex = 0;

        // Servidor alterno diferido (contrato Kino `alternatives`): se resuelve al elegirlo
        if (s.lazyRef) {
          row.innerHTML = `
            <div>
              <strong>🎞️ ${s.label || ("Servidor " + (i + 1))}</strong>
              <div style="font-size:12px; color:var(--muted);">Toca para abrir este servidor</div>
            </div>
            <div class="btn-group">
              <button class="action-btn small focusable" data-open-lazy="${i}">▶ Abrir</button>
            </div>
          `;
          const openLazy = e => {
            if (e) e.stopPropagation();
            resolvePluginRef(s.lazyPluginId, s.lazyRef, title);
          };
          row.querySelector("[data-open-lazy]").addEventListener("click", openLazy);
          row.addEventListener("click", openLazy);
          streamsList.appendChild(row);
          return;
        }

        row.innerHTML = `
          <div>
            <strong>🎬 ${s.label || ("Servidor " + (i + 1))}</strong>
            <div style="font-size:12px; color:var(--muted); max-width:650px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.url}</div>
          </div>
          <div class="btn-group">
            <button class="action-btn small focusable" data-play-web="${i}">▶ Web</button>
            <button class="action-btn secondary small focusable" data-play-proxy="${i}">🔁 vía Proxy</button>
            <button class="action-btn secondary small focusable" data-play-native="${i}">🟡 Nativo VIDAA</button>
          </div>
        `;
        row.querySelector("[data-play-web]").addEventListener("click", e => {
          e.stopPropagation();
          startPlayback(s.url, `${title} (${s.label || 'Stream'})`, { mime: s.mime });
        });
        row.querySelector("[data-play-proxy]").addEventListener("click", e => {
          e.stopPropagation();
          startPlayback(proxiedPlaybackUrl(s.url), `${title} (${s.label || 'Stream'})`, { viaProxy: true, mime: s.mime });
        });
        row.querySelector("[data-play-native]").addEventListener("click", e => {
          e.stopPropagation();
          handoffToVidaaNativePlayer(s.url, title);
        });
        row.addEventListener("click", () => startPlayback(s.url, `${title} (${s.label || 'Stream'})`, { mime: s.mime }));
        streamsList.appendChild(row);
      });
    }

    async function resolvePluginRef(pluginId, ref, title) {
      const inst = state.installed.find(x => x.id === pluginId);
      if (!inst) return [];
      setStatus(`Resolviendo enlaces desde ${inst.name}...`);
      try {
        // resolve() puede tardar ~60 s probando servidores (límite propio del plugin)
        const res = await withTimeout(callPluginFn(inst, "resolve", ref), 65000, inst.name);
        if (!res) return [];
        const list = [];
        if (res.url) list.push({ url: res.url, label: `${inst.name} · ${res.label || 'Principal'}`, mime: res.mime, headers: res.headers });
        if (Array.isArray(res.copies)) {
          res.copies.forEach(c => {
            if (c && c.url) list.push({ url: c.url, label: `${inst.name} · ${c.label || 'Servidor'}`, mime: c.mime, headers: c.headers });
          });
        }
        // Contrato Kino: `alternatives` son refs diferidas (c:...@n) que se resuelven al elegirlas
        if (Array.isArray(res.alternatives)) {
          res.alternatives.forEach(a => {
            if (a && a.ref) list.push({ lazyRef: a.ref, lazyPluginId: pluginId, label: `${inst.name} · ${a.label || 'Servidor alterno'}` });
          });
        }
        setStatus(list.length ? `${list.length} opciones de servidor` : "Sin enlaces directos");
        renderStreamOptions(list, title);
        return list;
      } catch (e) {
        setStatus(`Error al resolver en ${inst.name}: ${e.userMessage || e.message || e}`);
        const streamsList = document.getElementById("streamsList");
        if (streamsList && document.getElementById("detailOverlay").classList.contains("open")) {
          const hint = e.code === "unavailable"
            ? "<br><br>El sitio está protegido (Cloudflare) o los proxies no responden: revisa Ajustes ▸ 📡 Probar Conexión."
            : "";
          streamsList.innerHTML = `<div style='color:var(--muted); font-size:14px;'>${e.userMessage || e.message || "No se pudo resolver."}${hint}</div>`;
        }
        return [];
      }
    }

      document.getElementById("playDirectBtn").focus();

      // Vía sin proxy: si el título trae ID de IMDb (Cinemeta) se arman los
      // servidores embed de inmediato — no hay que resolver nada por la red.
      state.selectedSeason = 1;
      state.selectedEpisode = 1;

      if (item.video) {
        state.activeSources.push({ name: "Servidor Directo MP4 (sin publicidad)", badge: "Directo MP4", type: "direct", url: item.video });

      const inst = state.installed.find(x => x.id === item.pluginId);

      if (inst && inst.address && item.ref) {
        try {

            if (det.year) document.getElementById("detailMeta").textContent = `${det.year} · Fuente: ${inst.name}`;
          }
        } catch (_) {}

        try {
          const epRes = await withTimeout(callPluginFn(inst, "episodes", item.ref), 30000, inst.name);
          const eps = Array.isArray(epRes) ? epRes : (epRes && Array.isArray(epRes.episodes) ? epRes.episodes : []);
          // El contrato Kino devuelve la ficha de la serie junto a los episodios
          if (epRes && epRes.series) {
            if (epRes.series.overview) document.getElementById("detailDesc").textContent = epRes.series.overview;
            if (epRes.series.poster) document.getElementById("detailPoster").src = epRes.series.poster;
            if (epRes.series.year) document.getElementById("detailMeta").textContent = `${epRes.series.year} · Fuente: ${inst.name}`;
          }
          if (eps.length) {
            const epSec = document.getElementById("episodesSection");
            epSec.innerHTML = `<h3 style="font-size:17px; margin-bottom:8px;">Capítulos / Archivos (${eps.length})</h3><div class="episodes-grid" id="epGrid"></div>`;
            const epGrid = document.getElementById("epGrid");

              const b = document.createElement("button");
              b.className = "ep-btn focusable";
              const epLabel = (ep.season ? `T${ep.season}:` : "") + `E${ep.number || ep.episode || 1} - ${ep.title || ep.name || "Capítulo"}`;
              b.textContent = epLabel;
              b.addEventListener("click", () => resolvePluginRef(inst.id, ep.ref || ep.id, `${item.title} ${epLabel}`));
              epGrid.appendChild(b);

          // p. ej. series sin episodios: el plugin manda userMessage en español
          if (e && e.userMessage) {
            document.getElementById("episodesSection").innerHTML = `<div style="color:var(--muted); font-size:14px; margin-top:8px;">${e.userMessage}</div>`;
          }
        }
      }

      // 2. Si viene de un addon Stremio, pedir /meta/{type}/{id}.json
      if (item.stremioBase && item.rawId) {
        try {
          const metaUrl = `${item.stremioBase}/meta/${encodeURIComponent(item.stremioType)}/${encodeURIComponent(item.rawId)}.json`;
          const r = await smartFetch(metaUrl);
          if (r.ok) {

    // Busca streams para el título actual en todos los plugins de video instalados (útil cuando el catálogo viene de Cinemeta/TMDB)
    async function searchStreamsAcrossPlugins(title, season, episode) {
      setStatus(`Buscando servidores para "${title}" en tus plugins...`);
      const foundStreams = [];
      const failures = [];
      for (const inst of state.installed) {
        if (!inst.address || inst.enabled === false) continue;
        try {
          let sRes = null;
          try {
            sRes = await withTimeout(callPluginFn(inst, "search", { q: title, query: title, type: season ? "series" : "movie", originalTitle: title, altTitles: [] }), 30000, inst.name);
          } catch (_) {
            try { sRes = await withTimeout(callPluginFn(inst, "search", title), 20000, inst.name); } catch (_) {}
          }
          const items = Array.isArray(sRes) ? sRes : (sRes && Array.isArray(sRes.items) ? sRes.items : []);
          if (!items.length) { failures.push(`${inst.name}: sin coincidencias`); continue; }
          // Prueba hasta 3 coincidencias: la primera no siempre es el título correcto
          let resolvedAny = false;
          let lastErr = null;
          for (const match of items.slice(0, 3)) {
            const targetRef = match.ref || match.id;
            if (!targetRef) continue;
            try {
              const resolved = await withTimeout(callPluginFn(inst, "resolve", targetRef), 65000, inst.name);
              if (resolved && resolved.url) {
                foundStreams.push({ url: resolved.url, label: `${inst.name} · ${resolved.label || match.title || 'Principal'}`, mime: resolved.mime, headers: resolved.headers });
                resolvedAny = true;
              }
              if (resolved && Array.isArray(resolved.copies)) {
                resolved.copies.forEach(c => {
                  if (c && c.url) { foundStreams.push({ url: c.url, label: `${inst.name} · ${c.label || 'Opción'}`, mime: c.mime, headers: c.headers }); resolvedAny = true; }
                });
              }
              if (resolved && Array.isArray(resolved.alternatives)) {
                resolved.alternatives.forEach(a => {
                  if (a && a.ref) { foundStreams.push({ lazyRef: a.ref, lazyPluginId: inst.id, label: `${inst.name} · ${a.label || 'Servidor alterno'}` }); resolvedAny = true; }
                });
              }
              if (resolvedAny) break;
            } catch (e) {
              lastErr = e;
            }
          }
          if (!resolvedAny) failures.push(`${inst.name}: ${(lastErr && (lastErr.userMessage || lastErr.message)) || "sin enlaces"}`);
        } catch (e) {
          failures.push(`${inst.name}: ${(e && (e.userMessage || e.message)) || "error"}`);
        }
      }
      renderStreamOptions(foundStreams, title);
      if (!foundStreams.length && failures.length) {
        const streamsList = document.getElementById("streamsList");
        streamsList.innerHTML = `<div style='color:var(--muted); font-size:14px; line-height:1.8;'>Ningún plugin abrió enlaces:<br>${failures.map(f => `• ${f}`).join("<br>")}<br><br>Si todo dice "no está disponible", revisa Ajustes ▸ 📡 Probar Conexión.</div>`;
      }
      setStatus(foundStreams.length ? `Se encontraron ${foundStreams.length} enlaces` : "Ningún plugin abrió enlaces para este título");
    }

    // URL de reproducción a través del proxy CORS (para CDNs que no envían
    // cabeceras CORS, que hls.js necesita, o que bloquean al WebView)
    function proxiedPlaybackUrl(url) {
      const prefix = state.lastGoodProxy || state.customProxy || "https://api.codetabs.com/v1/proxy?quest=";
      return prefix + encodeURIComponent(url);
    }

    // Reproduce una "fuente" de la ficha (embed en iframe o URL directa en <video>)
    function startPlaybackSource(src, title) {
      if (!src) { setStatus("No hay un servidor seleccionado para reproducir"); return; }
      if (src.type === "embed") startEmbedPlayback(src, title);
      else startPlayback(src.url, title, { mime: src.mime });
    }

    // Servidor web embed: va en <iframe>, que no necesita CORS. La página del
    // servidor trae su propio reproductor (y su publicidad).
    function startEmbedPlayback(src, title) {
      state.activeVideoUrl = src.url;
      document.getElementById("nowPlayingTitle").textContent = `${title || "Reproduciendo"} — ${src.name}`;
      document.getElementById("nowPlayingSub").textContent = "Servidor web con su propia publicidad. 🖱 Controlar video para usar sus botones · Si no carga: 🔄 Siguiente · Back: Salir";
      playerUI.setMode("embed");
      document.getElementById("playerOverlay").classList.add("open");
      const video = document.getElementById("videoPlayer");
      const iframe = document.getElementById("webPlayerFrame");
      if (state.hlsInstance) { state.hlsInstance.destroy(); state.hlsInstance = null; }
      video.onerror = null;
      video.pause();
      video.removeAttribute("src");
      video.style.display = "none";
      iframe.style.display = "block";
      playerUI.embedActive = true;
      iframe.src = src.url;
      playerUI.show(true);
    }

    function startPlayback(url, title, opts = {}) {
      if (!url) { setStatus("No hay URL de stream disponible"); return; }
      if (!opts.viaProxy) state.activeVideoUrl = url; // conserva la URL original para el pase a nativo
      document.getElementById("nowPlayingTitle").textContent = title || "Reproduciendo";
      document.getElementById("nowPlayingSub").textContent = opts.viaProxy
        ? "Vía proxy · OK: Pausa/Play · ◀ ▶: 10 s · Back: Salir"
        : "OK: Pausa/Play · ◀ ▶: 10 s · Amarillo: Nativo VIDAA · Back: Salir";
      playerUI.setMode("video");
      document.getElementById("playerOverlay").classList.add("open");
      const video = document.getElementById("videoPlayer");
      const iframe = document.getElementById("webPlayerFrame");
      playerUI.embedActive = false;
      iframe.src = "about:blank";
      iframe.style.display = "none";
      video.style.display = "";
      // Sin crossOrigin: <video> reproduce orígenes cruzados sin CORS; solo hls.js lo necesita
      if (state.hlsInstance) { state.hlsInstance.destroy(); state.hlsInstance = null; }

      const isHls = /\.m3u8(\?|#|$)/i.test(url) || /mpegurl/i.test(opts.mime || "");
      let retried = !!opts.viaProxy;

      const retryViaProxy = () => {
        if (retried) {
          setStatus("No se pudo reproducir ni directo ni vía proxy — prueba 🟡 Nativo VIDAA");
          return;
        }
        retried = true;
        setStatus("El servidor no respondió directo; reintentando vía proxy…");
        startPlayback(proxiedPlaybackUrl(url), title, { viaProxy: true, mime: opts.mime });
      };

      video.onerror = () => { retryViaProxy(); };

      if (isHls && window.Hls && Hls.isSupported()) {
        const hls = new Hls({ manifestLoadingTimeOut: 20000, fragLoadingTimeOut: 20000 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data && data.fatal) retryViaProxy();
        });
        state.hlsInstance = hls;
      } else {
        video.src = url;
        video.play().catch(() => {});
      }
      // Foco en Pausa/Play (antes en Cerrar: un OK de más cerraba el video)
      playerUI.show(true);
    }

    // =========================================================================
    // CONTROLES DEL REPRODUCTOR CON EL CONTROL REMOTO
    // La barra se oculta a los 5 s; con la barra oculta: OK = Pausa/Play,
    // ◀ ▶ = retroceder/adelantar 10 s, cualquier otra tecla muestra la barra.
    // Las teclas multimedia del control (Play, Pausa, ⏩, ⏪, Stop) funcionan siempre.
    // =========================================================================
    const playerUI = {
      hideTimer: null,
      osdTimer: null,
      embedActive: false,
      el: id => document.getElementById(id),
      overlay() { return this.el("playerOverlay"); },
      video() { return this.el("videoPlayer"); },
      isOpen() { return this.overlay().classList.contains("open"); },
      isHidden() { return this.overlay().classList.contains("hud-hidden"); },
      isEmbed() { return this.overlay().classList.contains("mode-embed"); },
      setMode(mode) {
        this.overlay().classList.toggle("mode-embed", mode === "embed");
        this.overlay().classList.toggle("mode-video", mode !== "embed");
        this.updatePlayLabel();
        this.updateProgress();
      },
      defaultButton() { return this.el(this.isEmbed() ? "playerFocusFrameBtn" : "playerPlayPauseBtn"); },
      show(focusDefault) {
        this.overlay().classList.remove("hud-hidden");
        const hud = this.el("playerHud");
        if (focusDefault || !hud.contains(document.activeElement)) this.defaultButton().focus();
        this.updateProgress();
        this.scheduleHide();
      },
      hide() {
        clearTimeout(this.hideTimer);
        if (!this.isOpen()) return;
        // Con el video en pausa la barra se queda visible
        if (!this.isEmbed() && this.video().paused && this.video().currentSrc) return;
        this.overlay().classList.add("hud-hidden");
      },
      scheduleHide() {
        clearTimeout(this.hideTimer);
        this.hideTimer = setTimeout(() => this.hide(), 5000);
      },
      reset() {
        clearTimeout(this.hideTimer);
        this.overlay().classList.remove("hud-hidden");
        this.el("playerOsd").classList.remove("show");
      },
      osd(msg) {
        const o = this.el("playerOsd");
        o.textContent = msg;
        o.classList.add("show");
        clearTimeout(this.osdTimer);
        this.osdTimer = setTimeout(() => o.classList.remove("show"), 1400);
      },
      togglePlay(forcePlay) {
        if (this.isEmbed()) { this.osd("Usa 🖱 Controlar video para este servidor"); return; }
        const v = this.video();
        if (forcePlay === true || (forcePlay !== false && v.paused)) {
          v.play().catch(() => {});
          this.osd("▶ Play");
        } else {
          v.pause();
          this.osd("⏸ Pausa");
        }
      },
      seek(delta) {
        if (this.isEmbed()) return;
        const v = this.video();
        if (!isFinite(v.duration) || !v.duration) { this.osd("📡 En vivo"); return; }
        v.currentTime = Math.max(0, Math.min(v.duration - 1, v.currentTime + delta));
        this.osd(`${delta > 0 ? "⏩ +" : "⏪ "}${delta} s · ${fmtTime(v.currentTime)}`);
        this.updateProgress();
      },
      updatePlayLabel() {
        const v = this.video();
        this.el("playerPlayPauseBtn").textContent = v.paused ? "▶ Play" : "⏸ Pausa";
      },
      updateProgress() {
        const v = this.video();
        const live = !isFinite(v.duration) || !v.duration;
        this.el("hudBarFill").style.width = live ? "100%" : `${(v.currentTime / v.duration) * 100}%`;
        this.el("hudTime").textContent = live ? `📡 En vivo · ${fmtTime(v.currentTime)}` : `${fmtTime(v.currentTime)} / ${fmtTime(v.duration)}`;
      }
    };
    function fmtTime(t) {
      t = Math.max(0, Math.floor(Number(t) || 0));
      const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
      return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
    }
    (() => {
      const v = playerUI.video();
      v.addEventListener("play", () => { playerUI.updatePlayLabel(); playerUI.scheduleHide(); });
      v.addEventListener("pause", () => { playerUI.updatePlayLabel(); if (playerUI.isOpen() && v.currentSrc) playerUI.show(false); });
      v.addEventListener("timeupdate", () => { if (!playerUI.isHidden()) playerUI.updateProgress(); });
      v.addEventListener("loadedmetadata", () => playerUI.updateProgress());
      playerUI.el("playerPlayPauseBtn").addEventListener("click", () => { playerUI.togglePlay(); playerUI.scheduleHide(); });
      playerUI.el("playerRewBtn").addEventListener("click", () => { playerUI.seek(-10); playerUI.scheduleHide(); });
      playerUI.el("playerFwdBtn").addEventListener("click", () => { playerUI.seek(10); playerUI.scheduleHide(); });
      // Servidores embed: el video está dentro de una página ajena (iframe) y
      // solo recibe las teclas si tiene el foco. Back dentro del iframe vuelve
      // su historial a about:blank, y eso se detecta para cerrar el reproductor.
      playerUI.el("playerFocusFrameBtn").addEventListener("click", () => {
        const f = playerUI.el("webPlayerFrame");
        playerUI.overlay().classList.add("hud-hidden");
        clearTimeout(playerUI.hideTimer);
        try { f.focus(); f.contentWindow && f.contentWindow.focus(); } catch (_) {}
      });
      playerUI.el("webPlayerFrame").addEventListener("load", () => {
        if (!playerUI.embedActive || !playerUI.isOpen()) return;
        let blank = false;
        try { blank = playerUI.el("webPlayerFrame").contentWindow.location.href === "about:blank"; } catch (_) { /* página ajena: sigue reproduciendo */ }
        if (blank) document.getElementById("closePlayerBtn").click();
      });
      // Si el foco se va al iframe (p. ej. con un puntero), ocultar la barra
      window.addEventListener("blur", () => {
        if (playerUI.isOpen() && playerUI.isEmbed() && document.activeElement === playerUI.el("webPlayerFrame")) {
          playerUI.overlay().classList.add("hud-hidden");
        }
      });
      playerUI.overlay().addEventListener("mousemove", () => { if (playerUI.isOpen()) playerUI.show(false); });
    })();

    // Teclas del reproductor. Devuelve true si la tecla ya se atendió.
    function handlePlayerKey(e) {
      if (!playerUI.isOpen()) return false;
      const k = e.key, c = e.keyCode;
      const media =
        (k === "MediaPlayPause" || c === 10252 || c === 179) ? "toggle" :
        (k === "MediaPlay" || c === 415) ? "play" :
        (k === "MediaPause" || c === 19) ? "pause" :
        (k === "MediaFastForward" || c === 417) ? "ff" :
        (k === "MediaRewind" || c === 412) ? "rw" :
        (k === "MediaStop" || c === 413) ? "stop" : null;
      if (media) {
        e.preventDefault();
        if (media === "toggle") playerUI.togglePlay();
        else if (media === "play") playerUI.togglePlay(true);
        else if (media === "pause") playerUI.togglePlay(false);
        else if (media === "ff") playerUI.seek(30);
        else if (media === "rw") playerUI.seek(-30);
        else if (media === "stop") document.getElementById("closePlayerBtn").click();
        return true;
      }
      if (playerUI.isHidden()) {
        e.preventDefault();
        if ((k === "Enter" || c === 13) && !playerUI.isEmbed()) { playerUI.togglePlay(); return true; }
        if (k === "ArrowLeft" && !playerUI.isEmbed()) { playerUI.seek(-10); return true; }
        if (k === "ArrowRight" && !playerUI.isEmbed()) { playerUI.seek(10); return true; }
        playerUI.show(true); // cualquier otra tecla: mostrar la barra
        return true;
      }
      playerUI.scheduleHide(); // actividad con la barra visible: reiniciar el temporizador
      return false;
    }

    function handoffToVidaaNativePlayer(url, title) {
      if (!url) return;
      try {
        if (window.omi_platform && typeof window.omi_platform.sendPlatformMessage === "function") {
          window.omi_platform.sendPlatformMessage(JSON.stringify({
            type: "launch_media_player",
            url: url,
            title: title || "Kino TV"
          }));
          setStatus("Enviado al reproductor nativo de VIDAA OS");
          return;
        }
      } catch (e) {}
      window.open(url, "_blank");
    }

    // Eventos de botones de modales
    document.getElementById("playDirectBtn").addEventListener("click", async () => {
      const it = state.selectedItem;
      if (!it) return;
      // Si la ficha ya armó servidores (embed por IMDb o MP4 directo), reproducir el primero
      if (state.activeSources.length) {
        state.currentSourceIndex = 0;
        startPlaybackSource(state.activeSources[0], it.title);
        return;
      }
      if (it.video) {
        startPlayback(it.video, it.title);
        return;
      }
      if (it.pluginId && it.ref && !it.stremioBase) {
        const list = await resolvePluginRef(it.pluginId, it.ref, it.title);
        if (list.length === 1) startPlayback(list[0].url, it.title);
        return;
      }
      await searchStreamsAcrossPlugins(it.title);
    });

    document.getElementById("searchAllPluginsBtn").addEventListener("click", () => {
      if (state.selectedItem) searchStreamsAcrossPlugins(state.selectedItem.title);
    });

    document.getElementById("playNativeBtn").addEventListener("click", () => {
      if (state.selectedItem && state.selectedItem.video) {
        handoffToVidaaNativePlayer(state.selectedItem.video, state.selectedItem.title);
      } else if (state.activeVideoUrl) {
        handoffToVidaaNativePlayer(state.activeVideoUrl, state.selectedItem ? state.selectedItem.title : "Kino TV");
      }
    });

    document.getElementById("playerNativeHandoffBtn").addEventListener("click", () => {
      handoffToVidaaNativePlayer(state.activeVideoUrl, document.getElementById("nowPlayingTitle").textContent);
    });

    document.getElementById("favToggleBtn").addEventListener("click", () => {
      if (!state.selectedItem) return;
      const idx = state.favorites.findIndex(f => f.id === state.selectedItem.id);
      if (idx >= 0) { state.favorites.splice(idx, 1); setStatus("Eliminado de Favoritos"); }
      else { state.favorites.push(state.selectedItem); setStatus("Guardado en Favoritos ❤️"); }
      saveStore("kino_favs_v2", state.favorites);
    });

    document.getElementById("closeDetailBtn").addEventListener("click", () => {
      document.getElementById("detailOverlay").classList.remove("open");
      const card = state.lastFocusedCard;
      if (card && document.body.contains(card)) card.focus();
      else document.getElementById("navHome").focus();
    });

    document.getElementById("saveConfigBtn").addEventListener("click", async () => {
      const p = state.configuringPlugin;
      if (p) {
        state.pluginConfigs[p.id] = state.pluginConfigs[p.id] || {};
        document.querySelectorAll("#configFieldsBox [data-cfg-key]").forEach(inp => {
          state.pluginConfigs[p.id][inp.dataset.cfgKey] = inp.value.trim();
        });
        saveStore("kino_plugin_configs", state.pluginConfigs);
        delete state.loadedModules[p.id];
        setStatus(`Configuración guardada para ${p.name}`);
      }
      document.getElementById("configOverlay").classList.remove("open");
      await refreshHomeCatalog();
    });

    document.getElementById("closeConfigBtn").addEventListener("click", () => {
      document.getElementById("configOverlay").classList.remove("open");
    });

    document.getElementById("closePlayerBtn").addEventListener("click", () => {
      const video = document.getElementById("videoPlayer");
      const iframe = document.getElementById("webPlayerFrame");
      // Quitar el handler ANTES de vaciar el src: si no, el evento "error" que
      // dispara un src vacío reintenta vía proxy y vuelve a abrir el player.
      video.onerror = null;
      if (state.hlsInstance) { state.hlsInstance.destroy(); state.hlsInstance = null; }
      video.pause();
      video.removeAttribute("src");
      try { video.load(); } catch (_) {}
      video.style.display = "";
      playerUI.embedActive = false;
      iframe.src = "about:blank";
      iframe.style.display = "none";
      playerUI.reset();
      document.getElementById("playerOverlay").classList.remove("open");
      // Devolver el foco a la ficha para seguir navegando con el control
      if (document.getElementById("detailOverlay").classList.contains("open")) {
        document.getElementById("playDirectBtn").focus();
      }
    });

    // Cicla por los servidores de la ficha (embed o directos) sin salir del player
    document.getElementById("playerNextServerBtn").addEventListener("click", () => {
      if (!state.activeSources.length) { setStatus("No hay más servidores en la lista"); return; }
      state.currentSourceIndex = (state.currentSourceIndex + 1) % state.activeSources.length;
      const src = state.activeSources[state.currentSourceIndex];
      setStatus(`Probando ${src.name}…`);
      startPlaybackSource(src, state.selectedItem ? state.selectedItem.title : "Kino TV");
    });

    document.getElementById("exitAppBtn").addEventListener("click", () => {
      if (typeof window.Hisense_Exit === "function") window.Hisense_Exit();
      else window.close();
    });

    document.querySelectorAll(".nav-btn[data-view]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.view = btn.dataset.view;
        renderView();
      });
    });

    // Navegación espacial con el control remoto de VIDAA OS (Flechas + OK + Back + Amarillo)
    window.addEventListener("keydown", e => {
      if (e.key === "Escape" || e.key === "Backspace" || e.keyCode === 461 || e.keyCode === 8) {
        const activeTag = document.activeElement && document.activeElement.tagName;
        if (activeTag === "INPUT" && e.key === "Backspace") return;
        if (document.getElementById("playerOverlay").classList.contains("open")) {
          e.preventDefault();
          document.getElementById("closePlayerBtn").click();
          return;
        }
        if (document.getElementById("configOverlay").classList.contains("open")) {
          e.preventDefault();
          document.getElementById("closeConfigBtn").click();
          return;
        }
        if (document.getElementById("detailOverlay").classList.contains("open")) {
          e.preventDefault();
          document.getElementById("closeDetailBtn").click();
          return;
        }
      }
      if (e.keyCode === 405 && state.activeVideoUrl) {
        handoffToVidaaNativePlayer(state.activeVideoUrl, "Kino TV");
        return;
      }
      if (handlePlayerKey(e)) return;
      // OK del control remoto: los navegadores solo "clican" con Enter en
      // <button>/<a>. Las tarjetas y filas de servidores son <div>, así que
      // hay que disparar el clic a mano o nunca se abre la ficha/el video.
      if (e.key === "Enter" || e.keyCode === 13) {
        const el = document.activeElement;
        if (el && el.classList && el.classList.contains("focusable") &&
            !/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) {
          e.preventDefault();
          el.click();
          return;
        }
      }
      const dir = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
      if (dir) {
        const activeTag = document.activeElement && document.activeElement.tagName;
        if ((activeTag === "INPUT" || activeTag === "TEXTAREA") && (dir === "left" || dir === "right")) return;
        if (activeTag === "SELECT" && (dir === "up" || dir === "down")) return;
        if (moveFocus(dir)) e.preventDefault();
      }
    });

    // ---------------------------------------------------------------------
    // Navegación espacial
    // ---------------------------------------------------------------------
    function focusScope() {
      return ["playerOverlay", "configOverlay", "detailOverlay"]
        .map(id => document.getElementById(id))
        .find(o => o.classList.contains("open")) || document;
    }
    function visibleFocusables(scope) {
      return Array.from(scope.querySelectorAll(".focusable")).filter(el => {
        if (el.offsetParent === null || el.disabled) return false;
        const r = el.getBoundingClientRect();
        return r.width > 0 && r.height > 0;
      });
    }
    function focusAndReveal(el) {
      if (!el) return false;
      try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); }
      el.scrollIntoView({ block: "nearest", inline: "nearest" });
      return true;
    }
    // Última posición enfocada: si un re-render borra el elemento con foco, la
    // siguiente flecha sigue desde ahí (antes saltaba al primer botón: "Inicio").
    let lastFocusRect = null;
    const zoneMemory = { sidebar: null, main: null };
    document.addEventListener("focusin", e => {
      const el = e.target;
      if (!el || !el.classList || !el.classList.contains("focusable")) return;
      lastFocusRect = el.getBoundingClientRect();
      if (el.closest(".sidebar")) zoneMemory.sidebar = el;
      else if (el.closest("#mainView")) zoneMemory.main = el;
    });
    function nearestTo(rect, list) {
      let best = null, bestD = Infinity;
      list.forEach(el => {
        const r = el.getBoundingClientRect();
        const d = Math.hypot((r.left + r.width / 2) - (rect.left + rect.width / 2), (r.top + r.height / 2) - (rect.top + rect.height / 2));
        if (d < bestD) { bestD = d; best = el; }
      });
      return best;
    }
    function moveFocus(dir) {
      const scope = focusScope();
      const all = visibleFocusables(scope);
      if (!all.length) return false;
      const current = document.activeElement;
      if (!current || !all.includes(current)) {
        return focusAndReveal((lastFocusRect && nearestTo(lastFocusRect, all)) || all[0]);
      }
      const vertical = dir === "up" || dir === "down";
      const r0 = current.getBoundingClientRect();
      const cx0 = r0.left + r0.width / 2, cy0 = r0.top + r0.height / 2;
      // En vertical se salta de fila en fila: los botones anidados dentro de una
      // fila enfocable (servidores) solo se recorren con ◀ ▶. Antes cada fila
      // eran 4 paradas y había que pasar botón por botón.
      const candidates = all.filter(c => c !== current &&
        !(vertical && c.parentElement && c.parentElement.closest(".focusable") && !c.parentElement.closest(".focusable").contains(current)) &&
        !(vertical && c.contains(current)));
      let best = null, bestScore = Infinity;
      candidates.forEach(c => {
        const r = c.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        let primary, orthGap, orthCenter;
        if (dir === "down") { if (cy - cy0 <= 4) return; primary = r.top - r0.bottom; }
        if (dir === "up") { if (cy0 - cy <= 4) return; primary = r0.top - r.bottom; }
        if (dir === "right") { if (cx - cx0 <= 4) return; primary = r.left - r0.right; }
        if (dir === "left") { if (cx0 - cx <= 4) return; primary = r0.left - r.right; }
        if (vertical) {
          orthGap = Math.max(0, r.left - r0.right, r0.left - r.right);
          // Desde algo ancho (campo de texto, fila) se baja al elemento de la izquierda
          const refX = r0.width > r.width * 2.5 ? r0.left + r.width / 2 : cx0;
          orthCenter = Math.abs(cx - refX);
        } else {
          orthGap = Math.max(0, r.top - r0.bottom, r0.top - r.bottom);
          orthCenter = Math.abs(cy - cy0);
        }
        // Lo que está alineado (en la misma fila/columna) gana a lo que está en diagonal
        const score = Math.max(0, primary) + orthGap * 3 + orthCenter * 0.3;
        if (score < bestScore) { bestScore = score; best = c; }
      });
      if (!best) return false;
      // Entre menú lateral y contenido: volver a donde se estaba
      if (scope === document) {
        const fromSidebar = !!current.closest(".sidebar");
        const toSidebar = !!best.closest(".sidebar");
        if (fromSidebar && !toSidebar && dir === "right" && zoneMemory.main && all.includes(zoneMemory.main)) best = zoneMemory.main;
        else if (!fromSidebar && toSidebar && dir === "left") best = document.querySelector(".nav-btn.active") || best;
      }
      return focusAndReveal(best);
    }

    // Inicialización
    renderView();
    document.getElementById("navHome").focus();
    refreshHomeCatalog();
  </script>
</body>
</html>
